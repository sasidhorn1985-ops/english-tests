<!-- GOOGLE SHEET SCORE SUBMISSION V2 - ระบบส่งคะแนนแบบใหม่ ทนกว่าเดิม -->
<div id="score-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999999;align-items:center;justify-content:center;padding:20px;font-family:'Sarabun','Noto Sans Thai',system-ui,sans-serif">
  <div style="background:white;border-radius:20px;max-width:440px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:popIn .3s ease">
    <div style="text-align:center;margin-bottom:16px"><div style="font-size:40px">🎉</div><h3 style="font-size:19px;font-weight:800;margin:8px 0 4px">ทำเสร็จแล้ว! ส่งคะแนนเลยไหม?</h3><p style="font-size:13px;color:#78716c">กรอกชื่อเพื่อให้ครูบันทึกคะแนนลง Google Sheet อัตโนมัติ</p></div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <input id="student-name" placeholder="ชื่อ-นามสกุล (บังคับ)" style="padding:12px 14px;border:1.5px solid #e7e5e4;border-radius:12px;font-size:14px;width:100%;box-sizing:border-box;outline:none">
      <input id="student-class" placeholder="ชั้น / ห้อง (เช่น ม.2/1)" style="padding:12px 14px;border:1.5px solid #e7e5e4;border-radius:12px;font-size:14px;width:100%;box-sizing:border-box;outline:none">
      <div id="score-preview" style="background:#f5f5f4;padding:12px 14px;border-radius:12px;font-size:14px;color:#1c1917;font-weight:600;text-align:center;border:1px dashed #d6d3d1"></div>
      <button id="submit-score-btn" style="background:#4f46e5;color:white;padding:13px;border:none;border-radius:12px;font-weight:700;cursor:pointer;width:100%;font-size:15px;box-shadow:0 4px 14px rgba(79,70,229,.3)">📤 ส่งคะแนนให้ครู</button>
      <button id="skip-score-btn" style="background:#f5f5f4;color:#57534e;padding:11px;border:none;border-radius:12px;cursor:pointer;width:100%;font-size:14px">ข้าม ไม่ส่งตอนนี้</button>
      <p id="submit-status" style="font-size:13px;text-align:center;display:none;margin:4px 0 0;padding:8px;border-radius:8px"></p>
    </div>
  </div>
</div>
<style>@keyframes popIn{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}} #score-modal input:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.15)}</style>
<script>
(function(){
  const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbzc4ofn7BMgVzfjRwMe2Mifuk0kp8vVQwlAkV4FKoIcG2qnNxPKuvBM2lTDD6I-Mpf0/exec";
  const TEST_NAME = "100-Pool-Random-Test_Present_Simple-Vs-Continuous_Basic";
  let modalShown = false;
  let currentScore = 0;
  let currentTotal = 20;

  function getScoreFromPage(){
    try{
      const bodyText = document.body.innerText;
      // หาเลข 7 / 20 แบบในรูป
      const patterns = [
        /(\d+)\s*\/\s*20/g,
        /คะแนน[\s\S]*?(\d+)\s*\/\s*(\d+)/,
        /(\d+)\s*ถูก/g
      ];
      // วิธีที่ชัวร์สุด: หา span ตัวใหญ่ที่เป็นคะแนน
      const bigScoreEl = document.querySelector('span.text-\[44px\]');
      if(bigScoreEl) {
        const s = parseInt(bigScoreEl.textContent);
        if(!isNaN(s)) { currentScore = s; currentTotal = 20; return {score:s,total:20}; }
      }
      // fallback: หาจาก text ที่มี / 20
      const m = bodyText.match(/(\d+)\s*\/\s*20/);
      if(m) {
        // เอาตัวแรกที่เจอหลังคำว่า สรุปผล
        const summaryIndex = bodyText.indexOf('สรุปผลการทดสอบ');
        if(summaryIndex > -1){
          const after = bodyText.substring(summaryIndex, summaryIndex+200);
          const mm = after.match(/(\d+)\s*\/\s*20/);
          if(mm) return {score:parseInt(mm[1]), total:20};
        }
        return {score:parseInt(m[1]), total:20};
      }
    }catch(e){}
    return null;
  }

  function showScoreModal(score,total){
    if(modalShown) return;
    modalShown = true;
    currentScore = score; currentTotal = total;
    const percent = Math.round(score/total*100);
    const preview = document.getElementById('score-preview');
    if(preview) preview.innerText = `📊 ${TEST_NAME} — ได้ ${score} / ${total} (${percent}%)`;
    const modal = document.getElementById('score-modal');
    if(modal) modal.style.display = 'flex';
    
    // ปุ่มส่ง
    const btn = document.getElementById('submit-score-btn');
    const status = document.getElementById('submit-status');
    if(btn){
      btn.onclick = async () => {
        const name = document.getElementById('student-name').value.trim();
        const classRoom = document.getElementById('student-class').value.trim();
        if(!name){ alert('กรอกชื่อก่อนนะครับ 😊'); document.getElementById('student-name').focus(); return; }
        btn.innerText = '⏳ กำลังส่ง...'; btn.disabled = true;
        btn.style.opacity = '0.7';
        try{
          await fetch(GOOGLE_SHEET_URL, {
            method: 'POST', mode: 'no-cors',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({
              name: name, classRoom: classRoom, testName: TEST_NAME,
              score: score, total: total, percent: percent,
              details: `${TEST_NAME} - ${score}/${total} (${percent}%)`,
              timestamp: new Date().toISOString(),
              userAgent: navigator.userAgent
            })
          });
          status.style.display='block'; status.style.background='#dcfce7'; status.style.color='#166534';
          status.innerText = '✅ ส่งคะแนนสำเร็จ! ครูได้รับแล้วใน Google Sheet';
          btn.innerText = '✅ ส่งแล้ว'; btn.style.background='#16a34a';
          setTimeout(()=>{ document.getElementById('score-modal').style.display='none'; modalShown = false; }, 2500);
        }catch(e){
          status.style.display='block'; status.style.background='#fee2e2'; status.style.color='#991b1b';
          status.innerText = '❌ ส่งไม่สำเร็จ ลองใหม่นะครับ — ' + e.message;
          btn.innerText = '🔄 ลองใหม่'; btn.disabled = false; btn.style.opacity='1';
        }
      };
    }
    const skip = document.getElementById('skip-score-btn');
    if(skip) skip.onclick = () => { document.getElementById('score-modal').style.display='none'; modalShown = false; };
  }

  // วิธีตรวจจับแบบใหม่: ดูว่ามีคำว่า "สรุปผลการทดสอบ" โผล่มาหรือยัง
  function checkIfFinished(){
    if(modalShown) return;
    const bodyText = document.body.innerText;
    if(bodyText.includes('สรุปผลการทดสอบ') && bodyText.includes('/ 20')){
      const result = getScoreFromPage();
      if(result && result.score >=0){
        console.log('Score detected:', result);
        showScoreModal(result.score, result.total);
      }
    }
  }

  // ตรวจทุก 1 วิ + ใช้ MutationObserver ดูการเปลี่ยนแปลงของ DOM
  setInterval(checkIfFinished, 1000);
  
  const observer = new MutationObserver(checkIfFinished);
  observer.observe(document.body, {childList:true, subtree:true});

  // เผื่อกรณีโหลดหน้านี้มาแล้วเป็นหน้าสรุปเลย (รีเฟรช)
  window.addEventListener('load', () => setTimeout(checkIfFinished, 1500));

  console.log('✅ Score system ready for', TEST_NAME);
})();
</script>
