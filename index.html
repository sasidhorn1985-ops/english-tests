.dot{width:12px;height:12px;border-radius:999px;background:#facc15;display:inline-block;box-shadow:0 0 0 3px #fef9c3}
.sec-title{font-size:18px;font-weight:700;letter-spacing:-0.01em}
.count{font-size:11px;padding:3px 8px;border-radius:999px;background:#f5f5f5;border:1px solid #e5e7eb;color:#6b7280;font-weight:600}
.subsec{margin-top:28px;font-size:12px;font-weight:700;letter-spacing:0.14em;color:#6b7280;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.subsec b{color:#111;letter-spacing:0.02em;text-transform:none;font-size:12px}
.subsec .pill{font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;background:#f5f5f5;border:1px solid #e5e7eb;padding:2px 8px;border-radius:999px;color:#6b7280}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.grid1{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px;max-width:100%}
@media(max-width:640px){.grid2{grid-template-columns:1fr}.wrap{padding:28px 16px 48px}h1{font-size:27px}}
.card{display:flex;flex-direction:column;justify-content:space-between;border:1px solid #e5e7eb;border-radius:14px;background:#fff;padding:18px 20px;text-decoration:none;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:#111;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.badges{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.b1{display:inline-flex;align-items:center;gap:6px;border:1px solid #e5e7eb;background:#fafafa;color:#6b7280;padding:4px 9px;border-radius:999px}
.b1 i{width:6px;height:6px;border-radius:999px;display:inline-block}
.b2{border:1px solid;padding:4px 9px;border-radius:999px}
.b2.basic{background:#f0fdf4;color:#15803d;border-color:#bbf7d0}
.b2.inter{background:#eef2ff;color:#4f46e5;border-color:#c7d2fe}
.b2.adv{background:#f5f3ff;color:#7c3aed;border-color:#ddd6fe}
.sep{color:#d1d5db}
.card h4{margin:14px 0 0;font-size:16.5px;line-height:1.35;letter-spacing:-.01em;color:#111;font-weight:600}
.card p{margin:6px 0 0;font-size:13.5px;line-height:1.5;color:#6b7280}
.foot{margin-top:18px;display:flex;align-items:center;justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;color:#fff}
.meta{font-size:11px;color:#9ca3af;font-weight:500}
</style>
</head>
