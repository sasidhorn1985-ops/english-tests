const QPOOL = [{"id": 1, "sentence": "Sarah is in her car. She ____ (drive) to work.", "options": ["is driving", "drives", "drive"], "correctAnswer": "is driving", "explanationTh": "กำลังขับอยู่ตอนนี้ (at the time of speaking) ใช้ Present Continuous", "explanationEn": "action happening now, at the time of speaking", "rule": "Present Continuous - now"}, {"id": 2, "sentence": "Please don't make so much noise. I ____ (try) to work.", "options": ["am trying", "try", "tries"], "correctAnswer": "am trying", "explanationTh": "กำลังพยายามทำงานอยู่ตอนนี้ ใช้ Present Continuous", "explanationEn": "I am in the middle of doing it", "rule": "Present Continuous - now"}, {"id": 3, "sentence": "Where's Mark? He ____ (have) a shower.", "options": ["is having", "has", "have"], "correctAnswer": "is having", "explanationTh": "กำลังอาบน้ำอยู่ตอนนี้ have ในความหมายจัดกิจกรรม ใช้ Continuous ได้", "explanationEn": "have a shower = activity in progress", "rule": "Present Continuous - now"}, {"id": 4, "sentence": "Let's go out now. It ____ (not / rain) anymore.", "options": ["isn't raining", "doesn't rain", "don't rain"], "correctAnswer": "isn't raining", "explanationTh": "ตอนนี้ฝนไม่ตกแล้ว ใช้ Present Continuous ปฏิเสธ", "explanationEn": "not raining now", "rule": "Present Continuous - now"}, {"id": 5, "sentence": "What's all that noise? What ____ (go) on?", "options": ["is going", "goes", "go"], "correctAnswer": "is going", "explanationTh": "เกิดอะไรขึ้นตอนนี้ ใช้ Present Continuous", "explanationEn": "What is happening now", "rule": "Present Continuous - now"}, {"id": 6, "sentence": "I'm reading a really good book at the moment. It ____ (be) about a man who...", "options": ["is", "is being", "be"], "correctAnswer": "is", "explanationTh": "be เป็น stative ไม่ใช้ being ในความหมายนี้", "explanationEn": "is about = stative", "rule": "Stative - be"}, {"id": 7, "sentence": "Kate wants to work in Italy, so she ____ (learn) Italian.", "options": ["is learning", "learns", "learn"], "correctAnswer": "is learning", "explanationTh": "กำลังเรียนอยู่ช่วงนี้ (around now) ไม่จำเป็นต้องทำตอนพูดเป๊ะๆ", "explanationEn": "action around now, started but not finished", "rule": "Present Continuous - around now"}, {"id": 8, "sentence": "Some friends of mine ____ (build) their own house. They hope to finish it next summer.", "options": ["are building", "build", "builds"], "correctAnswer": "are building", "explanationTh": "กำลังสร้างบ้านอยู่ช่วงนี้ ยังไม่เสร็จ ใช้ Present Continuous", "explanationEn": "building around now, not finished yet", "rule": "Present Continuous - around now"}, {"id": 9, "sentence": "You ____ (work) hard today.", "options": ["are working", "work", "works"], "correctAnswer": "are working", "explanationTh": "ทำงานหนักวันนี้ (today) ช่วงนี้ ใช้ Present Continuous", "explanationEn": "today = period around now", "rule": "Present Continuous - today"}, {"id": 10, "sentence": "The company I work for ____ (not / do) so well this year.", "options": ["isn't doing", "doesn't do", "don't do"], "correctAnswer": "isn't doing", "explanationTh": "this year ช่วงนี้ทำไม่ดี ใช้ Present Continuous", "explanationEn": "this year = around now", "rule": "Present Continuous - this year"}, {"id": 11, "sentence": "Is your English ____ (get) better?", "options": ["getting", "gets", "get"], "correctAnswer": "getting", "explanationTh": "การเปลี่ยนแปลงรอบๆ ตอนนี้ (change around now) ใช้ Present Continuous", "explanationEn": "change happening around now", "rule": "Present Continuous - change"}, {"id": 12, "sentence": "The population of the world ____ (increase) very fast.", "options": ["is increasing", "increases", "increase"], "correctAnswer": "is increasing", "explanationTh": "ประชากรโลกกำลังเพิ่มขึ้น ใช้ Present Continuous กับ increase", "explanationEn": "increasing is change verb", "rule": "Present Continuous - change"}, {"id": 13, "sentence": "At first I didn't like my job, but I ____ (begin) to enjoy it now.", "options": ["am beginning", "begin", "begins"], "correctAnswer": "am beginning", "explanationTh": "begin เป็น verb ที่ใช้ Continuous ได้เมื่อหมายถึงเริ่มเปลี่ยนแปลง", "explanationEn": "begin to enjoy = change around now", "rule": "Present Continuous - begin"}, {"id": 14, "sentence": "The weather ____ (get) colder and colder.", "options": ["is getting", "gets", "get"], "correctAnswer": "is getting", "explanationTh": "อากาศกำลังเย็นลงเรื่อยๆ ใช้ Present Continuous", "explanationEn": "getting = change", "rule": "Present Continuous - get"}, {"id": 15, "sentence": "The earth ____ (get) warmer.", "options": ["is getting", "gets", "get"], "correctAnswer": "is getting", "explanationTh": "โลกกำลังอุ่นขึ้น การเปลี่ยนแปลง", "explanationEn": "global warming change", "rule": "Present Continuous - change"}, {"id": 16, "sentence": "Alex is a bus driver, but now he is in bed asleep. He ____ (not / drive) a bus.", "options": ["isn't driving", "doesn't drive", "don't drive"], "correctAnswer": "isn't driving", "explanationTh": "ตอนนี้ไม่ได้ขับรถ (ชั่วคราว) ใช้ Present Continuous", "explanationEn": "not driving now, temporary", "rule": "Present Continuous - now"}, {"id": 17, "sentence": "Alex ____ (drive) a bus. He is a bus driver.", "options": ["drives", "is driving", "drive"], "correctAnswer": "drives", "explanationTh": "เขาขับรถบัสเป็นอาชีพ (ความจริงทั่วไป) ใช้ Present Simple", "explanationEn": "He drives a bus = fact, general truth", "rule": "Present Simple - fact"}, {"id": 18, "sentence": "Nurses ____ (look) after patients in hospitals.", "options": ["look", "are looking", "looks"], "correctAnswer": "look", "explanationTh": "พยาบาลดูแลคนไข้เป็นเรื่องทั่วไป ใช้ Present Simple", "explanationEn": "things in general", "rule": "Present Simple - general"}, {"id": 19, "sentence": "I usually ____ (go) away at weekends.", "options": ["go", "am going", "goes"], "correctAnswer": "go", "explanationTh": "ปกติไปเที่ยววันหยุด ใช้ Present Simple กับ usually", "explanationEn": "habit with usually", "rule": "Present Simple - habit"}, {"id": 20, "sentence": "The earth ____ (go) round the sun.", "options": ["goes", "is going", "go"], "correctAnswer": "goes", "explanationTh": "โลกหมุนรอบดวงอาทิตย์ ความจริงทั่วไป ใช้ Present Simple", "explanationEn": "general truth", "rule": "Present Simple - truth"}, {"id": 21, "sentence": "The café ____ (open) at 7.30 in the morning.", "options": ["opens", "is opening", "open"], "correctAnswer": "opens", "explanationTh": "คาเฟ่เปิด 7.30 เป็นตารางเวลาทั่วไป ใช้ Present Simple", "explanationEn": "opens at 7.30 = timetable fact", "rule": "Present Simple - timetable"}, {"id": 22, "sentence": "I ____ (work) in a shop, but my sister ____ (teach) in a school.", "options": ["work / teaches", "am working / is teaching", "works / teach"], "correctAnswer": "work / teaches", "explanationTh": "I work... but He works... / They teach... but My sister teaches... เติม s เมื่อ he/she/it", "explanationEn": "Present Simple he/she/it +s", "rule": "Present Simple - he/she/it"}, {"id": 23, "sentence": "Tanya ____ (speak) German very well.", "options": ["speaks", "is speaking", "speak"], "correctAnswer": "speaks", "explanationTh": "พูดภาษาเยอรมันเก่ง เป็นความสามารถทั่วไป ใช้ Present Simple", "explanationEn": "speaks German = general ability", "rule": "Present Simple - general"}, {"id": 24, "sentence": "The swimming pool ____ (open) at 7.30 every morning.", "options": ["opens", "is opening", "open"], "correctAnswer": "opens", "explanationTh": "สระว่ายน้ำเปิด 7.30 ทุกเช้า ใช้ Present Simple", "explanationEn": "every morning = Present Simple", "rule": "Present Simple - every"}, {"id": 25, "sentence": "Bad driving ____ (cause) many accidents.", "options": ["causes", "is causing", "cause"], "correctAnswer": "causes", "explanationTh": "การขับรถแย่ๆ ทำให้เกิดอุบัติเหตุ เป็นเรื่องทั่วไป", "explanationEn": "cause(s) = general truth", "rule": "Present Simple - truth"}, {"id": 26, "sentence": "Where ____ you ____ from? I come from Canada.", "options": ["do / come", "are / coming", "does / come"], "correctAnswer": "do / come", "explanationTh": "คำถาม Present Simple ใช้ do/does + V1", "explanationEn": "Where do you come from?", "rule": "Present Simple - question"}, {"id": 27, "sentence": "What ____ this word ____?", "options": ["does / mean", "is / meaning", "does / means"], "correctAnswer": "does / mean", "explanationTh": "What does this word mean? (not What means)", "explanationEn": "does this word mean", "rule": "Present Simple - question"}, {"id": 28, "sentence": "Rice ____ (not / grow) in cold climates.", "options": ["doesn't grow", "isn't growing", "don't grow"], "correctAnswer": "doesn't grow", "explanationTh": "ข้าวไม่ขึ้นในอากาศหนาว ใช้ Present Simple ปฏิเสธ", "explanationEn": "doesn't grow = general fact negative", "rule": "Present Simple - negative"}, {"id": 29, "sentence": "What ____ you ____? I work in a shop.", "options": ["do / do", "are / doing", "does / do"], "correctAnswer": "do / do", "explanationTh": "What do you do? ถามอาชีพ do เป็น main verb", "explanationEn": "do as main verb in question", "rule": "Present Simple - do as main verb"}, {"id": 30, "sentence": "He is always so lazy. He ____ (not / do) anything to help.", "options": ["doesn't do", "isn't doing", "don't do"], "correctAnswer": "doesn't do", "explanationTh": "เขาไม่ทำอะไรเลย ใช้ doesn't do", "explanationEn": "doesn't do anything", "rule": "Present Simple - negative"}, {"id": 31, "sentence": "I ____ (get) up at 8 o'clock every morning.", "options": ["get", "am getting", "gets"], "correctAnswer": "get", "explanationTh": "ตื่น 8 โมงทุกเช้า ใช้ Present Simple บอกความถี่", "explanationEn": "every morning = frequency", "rule": "Present Simple - frequency"}, {"id": 32, "sentence": "How often ____ you ____ to the dentist?", "options": ["do / go", "are / going", "does / go"], "correctAnswer": "do / go", "explanationTh": "ถามความถี่ How often do you go...", "explanationEn": "How often do you go", "rule": "Present Simple - how often"}, {"id": 33, "sentence": "Julie ____ (not / drink) tea very often.", "options": ["doesn't drink", "isn't drinking", "don't drink"], "correctAnswer": "doesn't drink", "explanationTh": "Julie ไม่ดื่มชาบ่อย ใช้ doesn't", "explanationEn": "doesn't drink very often", "rule": "Present Simple - frequency negative"}, {"id": 34, "sentence": "Robert usually ____ (go) away two or three times a year.", "options": ["goes", "is going", "go"], "correctAnswer": "goes", "explanationTh": "Robert usually goes... he/she/it + goes", "explanationEn": "usually goes", "rule": "Present Simple - usually"}, {"id": 35, "sentence": "I ____ (promise) I won't be late.", "options": ["promise", "am promising", "promises"], "correctAnswer": "promise", "explanationTh": "I promise... เราทำบางสิ่งโดยการพูด ใช้ Present Simple ไม่ใช้ Continuous", "explanationEn": "performative verb promise", "rule": "Present Simple - promise"}, {"id": 36, "sentence": "What ____ you ____? I suggest that you...", "options": ["do / suggest", "are / suggesting", "does / suggest"], "correctAnswer": "do / suggest", "explanationTh": "What do you suggest? suggest เป็น performative ใช้ Present Simple", "explanationEn": "I suggest...", "rule": "Present Simple - suggest"}, {"id": 37, "sentence": "I ____ (apologise) for what I did.", "options": ["apologise", "am apologising", "apologises"], "correctAnswer": "apologise", "explanationTh": "I apologise... ใช้ Present Simple", "explanationEn": "I apologise", "rule": "Present Simple - apologise"}, {"id": 38, "sentence": "The water ____ (boil). Can you turn it off?", "options": ["is boiling", "boils", "boil"], "correctAnswer": "is boiling", "explanationTh": "น้ำกำลังเดือดตอนนี้ ใช้ Present Continuous", "explanationEn": "boiling now, not complete", "rule": "Present Continuous - now"}, {"id": 39, "sentence": "Water ____ (boil) at 100 degrees Celsius.", "options": ["boils", "is boiling", "boil"], "correctAnswer": "boils", "explanationTh": "น้ำเดือดที่ 100 องศา ความจริงทั่วไป ใช้ Present Simple", "explanationEn": "general truth boils at 100", "rule": "Present Simple - truth"}, {"id": 40, "sentence": "Listen to those people. What language ____ they ____ (speak)?", "options": ["are / speaking", "do / speak", "does / speak"], "correctAnswer": "are / speaking", "explanationTh": "พวกเขากำลังพูดภาษาอะไรอยู่ตอนนี้ ใช้ Present Continuous", "explanationEn": "are they speaking now", "rule": "Present Continuous - now"}, {"id": 41, "sentence": "Excuse me, ____ you ____ English?", "options": ["do / speak", "are / speaking", "does / speak"], "correctAnswer": "do / speak", "explanationTh": "คุณพูดภาษาอังกฤษได้ไหม (ความสามารถทั่วไป) ใช้ Present Simple", "explanationEn": "Do you speak English? = ability", "rule": "Present Simple - ability"}, {"id": 42, "sentence": "It ____ (not / rain) very much in summer.", "options": ["doesn't rain", "isn't raining", "don't rain"], "correctAnswer": "doesn't rain", "explanationTh": "ฤดูร้อนฝนไม่ตกมาก เป็นเรื่องทั่วไป ใช้ Present Simple", "explanationEn": "doesn't rain in summer = general", "rule": "Present Simple - general"}, {"id": 43, "sentence": "Let's go out. It ____ (not / rain) now.", "options": ["isn't raining", "doesn't rain", "don't rain"], "correctAnswer": "isn't raining", "explanationTh": "ตอนนี้ฝนไม่ตก ใช้ Present Continuous", "explanationEn": "isn't raining now", "rule": "Present Continuous - now"}, {"id": 44, "sentence": "What ____ you usually ____ at weekends?", "options": ["do / do", "are / doing", "does / do"], "correctAnswer": "do / do", "explanationTh": "ปกติทำอะไรวันหยุด ใช้ Present Simple", "explanationEn": "usually do at weekends", "rule": "Present Simple - usually"}, {"id": 45, "sentence": "I ____ (get) hungry. Let's go and eat.", "options": ["am getting", "get", "gets"], "correctAnswer": "am getting", "explanationTh": "ฉันเริ่มหิวแล้ว (กำลังหิว) ใช้ Present Continuous กับ get", "explanationEn": "I am getting hungry now", "rule": "Present Continuous - get"}, {"id": 46, "sentence": "I always ____ (get) hungry in the afternoon.", "options": ["get", "am getting", "gets"], "correctAnswer": "get", "explanationTh": "ฉันหิวตอนบ่ายเสมอ เป็นนิสัย ใช้ Present Simple", "explanationEn": "always get hungry = habit", "rule": "Present Simple - always"}, {"id": 47, "sentence": "Kate wants to work in Italy, so she ____ (learn) Italian.", "options": ["is learning", "learns", "learn"], "correctAnswer": "is learning", "explanationTh": "กำลังเรียนอิตาเลียนอยู่ช่วงนี้ (ชั่วคราว)", "explanationEn": "is learning Italian around now", "rule": "Present Continuous - temporary"}, {"id": 48, "sentence": "The population ____ (increase) by about 200,000 people a day.", "options": ["increases", "is increasing", "increase"], "correctAnswer": "increases", "explanationTh": "ประชากรเพิ่มขึ้นวันละ 200,000 เป็นความจริงทั่วไป ใช้ Present Simple", "explanationEn": "increases by 200k = fact", "rule": "Present Simple - fact"}, {"id": 49, "sentence": "I ____ (live) with some friends until I find a place of my own.", "options": ["am living", "live", "lives"], "correctAnswer": "am living", "explanationTh": "อาศัยอยู่กับเพื่อนชั่วคราวจนกว่าจะหาที่อยู่ได้ ใช้ Present Continuous", "explanationEn": "temporary situation until I find", "rule": "Present Continuous - temporary"}, {"id": 50, "sentence": "My parents ____ (live) in London. They have lived there all their lives.", "options": ["live", "are living", "lives"], "correctAnswer": "live", "explanationTh": "พ่อแม่อาศัยในลอนดอนตลอดชีวิต (ถาวร) ใช้ Present Simple", "explanationEn": "permanent situation", "rule": "Present Simple - permanent"}, {"id": 51, "sentence": "John isn't lazy. He ____ (work) hard most of the time.", "options": ["works", "is working", "work"], "correctAnswer": "works", "explanationTh": "John ทำงานหนักส่วนใหญ่ เป็นเรื่องทั่วไป ใช้ Present Simple", "explanationEn": "works hard most of time = general", "rule": "Present Simple - general"}, {"id": 52, "sentence": "You ____ (work) hard today.", "options": ["are working", "work", "works"], "correctAnswer": "are working", "explanationTh": "วันนี้ทำงานหนัก (ชั่วคราววันนี้) ใช้ Present Continuous", "explanationEn": "working hard today = temporary today", "rule": "Present Continuous - today"}, {"id": 53, "sentence": "I've lost my pen again. I ____ (always / lose) things.", "options": ["am always losing", "always lose", "always loses"], "correctAnswer": "am always losing", "explanationTh": "บ่นว่าทำหายบ่อยเกินไป ใช้ always + Present Continuous แสดงความรำคาญ", "explanationEn": "I'm always losing = I lose very often, annoying", "rule": "Present Continuous - always losing"}, {"id": 54, "sentence": "You ____ (always / watch) television. You should do something more active.", "options": ["are always watching", "always watch", "always watches"], "correctAnswer": "are always watching", "explanationTh": "ดูทีวีบ่อยเกินไป ใช้ always + Continuous", "explanationEn": "You watch TV too often", "rule": "Present Continuous - always watching"}, {"id": 55, "sentence": "Tim is never satisfied. He ____ (always / complain).", "options": ["is always complaining", "always complains", "always complain"], "correctAnswer": "is always complaining", "explanationTh": "บ่นตลอด ใช้ always + Continuous", "explanationEn": "He complains too much", "rule": "Present Continuous - always complaining"}, {"id": 56, "sentence": "I always ____ (go) to work by car.", "options": ["go", "am going", "goes"], "correctAnswer": "go", "explanationTh": "ฉันไปทำงานโดยรถเสมอ (ทุกครั้ง) ใช้ Present Simple", "explanationEn": "I do it every time = always go", "rule": "Present Simple - always"}, {"id": 57, "sentence": "I'm hungry. I ____ (want) something to eat.", "options": ["want", "am wanting", "wants"], "correctAnswer": "want", "explanationTh": "want เป็น stative verb ไม่ใช้ Continuous", "explanationEn": "want is stative, not I'm wanting", "rule": "Stative - want"}, {"id": 58, "sentence": "____ you ____ what I mean?", "options": ["Do / understand", "Are / understanding", "Does / understand"], "correctAnswer": "Do / understand", "explanationTh": "understand เป็น stative ไม่ใช้ Continuous", "explanationEn": "Do you understand? not Are you understanding", "rule": "Stative - understand"}, {"id": 59, "sentence": "Ann ____ (not / seem) very happy at the moment.", "options": ["doesn't seem", "isn't seeming", "don't seem"], "correctAnswer": "doesn't seem", "explanationTh": "seem เป็น stative ใช้ Present Simple", "explanationEn": "doesn't seem", "rule": "Stative - seem"}, {"id": 60, "sentence": "This room ____ (smell). Let's open a window.", "options": ["smells", "is smelling", "smell"], "correctAnswer": "smells", "explanationTh": "smell ในความหมายมีกลิ่น ใช้ Present Simple", "explanationEn": "This room smells = present simple", "rule": "Stative - smell"}, {"id": 61, "sentence": "I ____ (hear) a strange noise. Can you hear it?", "options": ["can hear / hear", "am hearing / hear", "hear / hear"], "correctAnswer": "can hear / hear", "explanationTh": "I can hear... ใช้ can + hear สำหรับได้ยินตอนนี้", "explanationEn": "We often use can + hear", "rule": "Stative - hear"}, {"id": 62, "sentence": "I ____ (think) Mary is Canadian, but I'm not sure.", "options": ["think", "am thinking", "thinks"], "correctAnswer": "think", "explanationTh": "think = believe มีความเห็น ไม่ใช้ Continuous", "explanationEn": "think means believe, not continuous", "rule": "Stative - think = believe"}, {"id": 63, "sentence": "What ____ you ____ about my plan? (= What is your opinion?)", "options": ["do / think", "are / thinking", "does / think"], "correctAnswer": "do / think", "explanationTh": "What do you think... ถามความเห็น ใช้ Present Simple", "explanationEn": "What do you think about my plan", "rule": "Stative - think opinion"}, {"id": 64, "sentence": "I ____ (think) about what happened. I often think about it.", "options": ["am thinking / think", "think / think", "am thinking / am thinking"], "correctAnswer": "am thinking / think", "explanationTh": "am thinking = กำลังพิจารณา ใช้ Continuous ได้, think บ่อยๆ ใช้ Present Simple", "explanationEn": "think about = consider can be continuous", "rule": "Think - con function shuffleArray(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

              <div className="grid gap-2 max-h-[400px] overflow-auto pr-1">
                {answered.map((a,i)=>(
                  <div key={i} className={`p-3 rounded-xl border text-[13px] ${a.correct?'bg-emerald-50 border-emerald-200':'bg-rose-50 border-rose-200'}`}>
                    <p className="font-semibold">{i+1}. {a.q.sentence}</p>
                    <p>ตอบ: {a.chosen} {a.correct?'✅':'❌'} | เฉลย: {a.q.correctAnswer}</p>
                    <p className="text-[11px] text-zinc-500 mt-1">{a.q.explanationTh}</p>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>

        {showModal && (
          <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
            <div className="bg-white rounded-[20px] w-full max-w-[420px] p-6 shadow-2xl">
              <h3 className="text-[18px] font-bold">📊 ส่งคะแนน</h3>
              <div className="mt-3 bg-indigo-50 border border-indigo-200 rounded-xl p-3 text-center text-[13px]">
                📊 <b>{TEST_NAME}</b><br/>
                ได้ <b style={{fontSize:'18px', color:'#4f46e5'}}>{score} / {total}</b> ({percent}%)
              </div>
              <div className="mt-4 grid gap-3">
                <input value={name} onChange={e=>setName(e.target.value)} placeholder="ชื่อ-นามสกุล *" className="w-full border border-zinc-300 rounded-xl px-4 py-3 text-[14px] focus:outline-none focus:ring-2 focus:ring-indigo-400"/>
                <input value={classRoom} onChange={e=>setClassRoom(e.target.value)} placeholder="ชั้น / ห้อง (เช่น ม.2/1)" className="w-full border border-zinc-300 rounded-xl px-4 py-3 text-[14px] focus:outline-none focus:ring-2 focus:ring-indigo-400"/>
                {sent ? (
                  <div className="bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-xl p-3 text-[13px] text-center">✅ <b>ส่งสำเร็จ!</b><br/>คะแนน: {score}/{total}</div>
                ) : (
                  <button onClick={handleSubmit} disabled={sending} className="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold text-[14px] hover:bg-indigo-700 disabled:opacity-60">
                    {sending ? "⏳ กำลังส่ง..." : "✅ ส่งคะแนน"}
                  </button>
                )}
                <button onClick={()=>setShowModal(false)} className="w-full bg-zinc-100 text-zinc-700 py-2.5 rounded-xl font-semibold text-[13px] hover:bg-zinc-200">ปิด</button>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-[#f8f7ff]">
      {/* TOP BAR - ธีมเดิมแบบในรูป */}
      <div className="bg-white border-b border-zinc-100 sticky top-0 z-20">
        <div className="max-w-[1200px] mx-auto px-4 sm:px-6 py-3 sm:py-4 flex items-center justify-between gap-3">
          <div className="flex items-center gap-3 min-w-0">
            <a href="./index.html" className="shrink-0 inline-flex items-center gap-2 bg-white border border-zinc-200 px-4 py-2 rounded-full text- font-bold shadow-sm hover:bg-zinc-50 no-underline">🏠 หน้าแรก</a>
            <div className="min-w-0">
              <h1 className="text-[15px] sm:text-[20px] font-bold leading-tight tracking-tight truncate">Present Simple vs Present Continuous - Cambridge <span className="text-zinc-500 font-medium">— พื้นฐาน 100 ข้อ</span></h1>
              <p className="text-[11px] sm:text-[12px] text-zinc-500 hidden sm:block">แบบพื้นฐาน คลัง 100 ข้อ สุ่มทำรอบละ 20 ข้อ</p>
            </div>
          </div>
          <button onClick={generateExam} className="shrink-0 inline-flex items-center gap-2 bg-indigo-600 text-white px-4 sm:px-5 py-2 sm:py-2.5 rounded-full text-[12px] sm:text-[13px] font-bold hover:bg-indigo-700 shadow">🔀 สุ่มใหม่ 20 ข้อ</button>
        </div>
      </div>

      <div className="max-w-[1200px] mx-auto px-4 sm:px-6 py-6 grid grid-cols-1 lg:grid-cols-[1.6fr_0.9fr] gap-6 items-start">
        {/* LEFT QUESTION CARD */}
        <div className="bg-white rounded-[20px] sm:rounded-[24px] border border-zinc-200 shadow-[0_8px_32px_rgba(0,0,0,0.06)] overflow-hidden">
          <div className="px-5 sm:px-7 pt-5 pb-4 flex items-center justify-between gap-3">
            <div className="flex items-center gap-3">
              <span className="bg-indigo-50 text-indigo-600 border border-indigo-100 px-3 py-1 rounded-full text-[12px] font-bold">ข้อ {idx+1} / {exam.length}</span>
              <span className="text-[12px] text-zinc-500">คลัง 100 ข้อ</span>
            </div>
            <div className="flex gap-1">
              {exam.map((_,i)=>(
                <span key={i} className={`h-1.5 rounded-full transition-all ${i===idx ? 'w-6 bg-indigo-400' : i < idx ? 'w-1.5 bg-indigo-200' : 'w-1.5 bg-zinc-200'}`}></span>
              ))}
            </div>
          </div>

          <div className="px-5 sm:px-7 pb-5">
            <div className="bg-[#f6f5ff] border border-[#e9e5ff] rounded-[16px] sm:rounded-[20px] p-5 sm:p-7">
              <p className="text-[19px] sm:text-[22px] font-medium leading-[1.6] tracking-normal text-zinc-800">
                {currentQ.sentence.split("____").map((part,i,arr)=>(
                  <React.Fragment key={i}>
                    {part}
                    {i < arr.length-1 && (
                      <span className="inline-flex items-center justify-center min-w-[84px] sm:min-w-[108px] mx-2 px-3 py-1 rounded-xl bg-white border border-indigo-200 text-indigo-400 font-bold text-[16px] sm:text-[18px] translate-y-[-1px] shadow-sm">____</span>
                    )}
                  </React.Fragment>
                ))}
              </p>
            </div>
          </div>

          <div className="px-5 sm:px-7 pb-6 grid gap-3">
            {currentQ.options.map((opt,i)=>{
              const isCorrectOpt = opt === currentQ.correctAnswer;
              const isSelected = selected === opt;
              let cls = "bg-white border-zinc-200 hover:border-indigo-300 hover:bg-indigo-50/40";
              let circleCls = "border-zinc-300 bg-white";
              if(showExp){
                if(isCorrectOpt) {cls="bg-indigo-50 border-indigo-400 text-indigo-900 ring-2 ring-indigo-200"; circleCls="bg-indigo-500 border-indigo-500 text-white";}
                else if(isSelected && !isCorrectOpt) {cls="bg-rose-50 border-rose-300 text-rose-800"; circleCls="bg-rose-500 border-rose-500 text-white";}
                else {cls="bg-zinc-50 border-zinc-200 opacity-60";}
              }else if(isSelected){
                cls="bg-zinc-900 border-zinc-900 text-white";
                circleCls="bg-white border-white text-zinc-800";
              }
              return (
                <button key={i} type="button" onClick={()=>handleSelect(opt)} className={`w-full text-left flex items-center justify-between gap-3 px-4 sm:px-5 py-3.5 sm:py-4 rounded-[14px] sm:rounded-[16px] border text-[15px] sm:text-[16px] font-medium transition-all ${cls}`}>
                  <span className="flex items-center gap-3 sm:gap-4">
                    <span className={`w-7 h-7 sm:w-8 sm:h-8 rounded-full flex items-center justify-center text-[12px] font-bold border-2 shrink-0 ${circleCls}`}>
                      {showExp && isCorrectOpt ? "✓" : showExp && isSelected && !isCorrectOpt ? "✗" : ""}
                    </span>
                    <span className="font-semibold">{opt}</span>
                  </span>
                  <span className="text-[12px] sm:text-[13px] font-bold opacity-60">
                    {!showExp ? "เลือก" : isCorrectOpt ? "ถูก" : ""}
                  </span>
                </button>
              );
            })}
          </div>

          {showExp && (
            <div className="px-5 sm:px-7 pb-6">
              <div className={`rounded-[14px] border p-4 ${selected===currentQ.correctAnswer ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'}`}>
                <p className={`text-[13px] font-bold ${selected===currentQ.correctAnswer ? 'text-emerald-700' : 'text-rose-700'}`}>
                  {selected===currentQ.correctAnswer ? '✅ ถูกต้อง!' : `❌ คำตอบที่ถูกคือ: ${currentQ.correctAnswer}`}
                </p>
                <p className="text-[12px] text-zinc-700 mt-1.5 leading-relaxed"><b>ไทย:</b> {currentQ.explanationTh}</p>
                <p className="text-[11px] text-zinc-500 mt-1"><b>EN:</b> {currentQ.explanationEn}</p>
              </div>
            </div>
          )}

          <div className="px-5 sm:px-7 pb-6 flex items-center justify-between gap-3">
            <button onClick={handlePrev} disabled={idx===0} className="inline-flex items-center gap-2 bg-white border border-zinc-200 px-4 py-2.5 rounded-full text-[13px] font-bold disabled:opacity-40 hover:bg-zinc-50">← ก่อนหน้า</button>
            <button onClick={handleNext} disabled={!showExp} className="inline-flex items-center gap-2 bg-indigo-600 text-white px-6 py-2.5 rounded-full text-[13px] font-bold disabled:opacity-40 hover:bg-indigo-700 shadow-[0_4px_16px_rgba(79,70,229,0.3)]">
              {idx < exam.length-1 ? "ข้อถัดไป →" : "ดูสรุปผล 📊"}
            </button>
          </div>

          <div className="px-5 sm:px-7 pb-4 text-[11px] text-zinc-400 text-center">คะแนนตอนนี้: {score} / {exam.length} • ช้อยส์สุ่มแล้ว ไม่ใช่ข้อแรกเสมอ</div>
        </div>

        {/* RIGHT LIST - แบบในรูป */}
        <div className="bg-white rounded-[20px] sm:rounded-[24px] border border-zinc-200 shadow-[0_8px_32px_rgba(0,0,0,0.06)] p-5 sm:p-6">
          <h3 className="font-bold text-[14px] mb-4">รายการข้อสอบ (20 ข้อ)</h3>
          <div className="grid grid-cols-5 gap-2 sm:gap-3">
            {exam.map((_,i)=>{
              const ans = answered[i];
              const isCurrent = i===idx;
              let cls = "bg-zinc-50 border-zinc-200 text-zinc-400 hover:bg-zinc-100";
              if(ans) cls = ans.correct ? "bg-emerald-50 border-emerald-200 text-emerald-700" : "bg-rose-50 border-rose-200 text-rose-700";
              if(isCurrent) cls = "bg-white border-indigo-500 text-indigo-600 ring-2 ring-indigo-200";
              return (
                <button key={i} onClick={()=>jumpTo(i)} className={`h-[56px] rounded-[14px] border text-[13px] font-bold flex flex-col items-center justify-center gap-0.5 transition-all ${cls}`}>
                  <span>{i+1}</span>
                  <span className="text-[10px] leading-none">{ans ? (ans.correct ? "✓" : "✗") : "•"}</span>
                </button>
              );
            })}
          </div>
          <div className="mt-5 bg-zinc-50 border border-zinc-100 rounded-xl p-3 text-[11px] leading-relaxed text-zinc-500">
            ตัวอย่างที่ผิดบ่อย: <span className="text-zinc-700">They are come</span> <span className="text-rose-600 font-bold">❌</span> ต้องเป็น <b className="text-zinc-800">They come</b> (ไม่เติม) เพราะ come เป็นกริยาแท้แล้ว
          </div>
        </div>
      </div>

      <div className="text-center py-6 text-[11px] text-zinc-400">สร้างตามโจทย์ที่ให้มา — แก้ให้ถูกต้อง: ประโยคที่มีกริยาแท้แล้ว (come, build, bites...) ต้องตอบ ไม่เติม ห้ามใส่ is/am/are</div>

      {showModal && !showSummary && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
          <div className="bg-white rounded-[20px] w-full max-w-[420px] p-6 shadow-2xl">
            <h3 className="text-[18px] font-bold">📊 ใกล้จบแล้ว</h3>
            <p className="text-[13px] text-zinc-500 mt-1">ทำครบ {exam.length} ข้อแล้ว กดดูสรุปผลได้เลย</p>
            <button onClick={()=>{setShowSummary(true); setShowModal(false); setTimeout(()=>setShowModal(true),400);}} className="mt-4 w-full bg-indigo-600 text-white py-3 rounded-xl font-bold text-[14px]">ดูสรุปผล 📊</button>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
