esent Continuous บอกอนาคตที่นัดแล้วได้",rule:"Have meeting = arrangement",category:"Verbs changing meaning"},{id:29,sentence:"He ____ (have) an extensive collection of rare academic journals.",thaiContext:"เขามีคอลเลกชันวารสารวิชาการหายากมากมาย - เป็นเจ้าของ",options:["has","is having","has had","is being had"],correctAnswer:"has",explanationEn:"Have = possess, stative.",explanationTh:"have = เป็นเจ้าของ เป็น stative",rule:"Have: possession",category:"Verbs changing meaning"},{id:30,sentence:"She ____ (think) of establishing a new laboratory for neuroscience research.",thaiContext:"เธอกำลังพิจารณาที่จะตั้งห้องปฏิบัติการใหม่ - กำลังคิดพิจารณา",options:["is thinking","thinks","has thought","is being thought"],correctAnswer:"is thinking",explanationEn:"Think of = consider, process, continuous possible.",explanationTh:"think of = กำลังพิจารณา ใช้ continuous ได้",rule:"Think of = consider",category:"Verbs changing meaning"},{id:31,sentence:"I ____ (see) the doctor about my chronic headaches later today.",thaiContext:"ฉันจะไปพบหมอเรื่องปวดหัวเรื้อรังวันนี้ - มีนัดหมาย",options:["am seeing","see","have seen","will see"],correctAnswer:"am seeing",explanationEn:"See doctor = have appointment, future arrangement.",explanationTh:"see doctor = ไปพบหมอ มีนัด ใช้ Present Continuous บอกอนาคต",rule:"See doctor = appointment",category:"Verbs changing meaning"},{id:32,sentence:"Why ____ you ____ (be) so defensive during the presentation yesterday?",thaiContext:"ทำไมคุณถึงทำตัวตั้งรับมากระหว่างการนำเสนอ - พฤติกรรมชั่วคราว",options:["are you being","do you be","have you been","are you"],correctAnswer:"are you being",explanationEn:"Be + being for temporary behavior.",explanationTh:"are you being = คุณกำลังทำตัวแบบนั้นอยู่ ชั่วคราว",rule:"Be being = temporary",category:"Verbs changing meaning"},{id:33,sentence:"He ____ (weigh) the samples to ensure accuracy and validity of the results.",thaiContext:"เขากำลังชั่งตัวอย่างเพื่อให้แน่ใจในความแม่นยำ - การกระทำ",options:["is weighing","weighs","has weighed","weighs up"],correctAnswer:"is weighing",explanationEn:"Weigh = action of measuring weight, continuous.",explanationTh:"weigh เป็นการกระทำชั่งน้ำหนัก ใช้ continuous ได้",rule:"Weigh: action vs state",category:"Verbs changing meaning"},{id:34,sentence:"The package ____ (weigh) 2 kilos according to the shipping label.",thaiContext:"พัสดุหนัก 2 กิโลตามฉลาก - น้ำหนักเป็นคุณสมบัติ",options:["weighs","is weighing","has weighed","is being weighed"],correctAnswer:"weighs",explanationEn:"Weigh = has weight, stative.",explanationTh:"weigh ที่บอกน้ำหนัก ใช้ Present Simple",rule:"Weigh: weight property",category:"Verbs changing meaning"},{id:35,sentence:"She ____ (appear) to be extremely confident in her research findings.",thaiContext:"เธอดูเหมือนมั่นใจมากในผลการวิจัย - appear = ดูเหมือน",options:["appears","is appearing","has appeared","is being appeared"],correctAnswer:"appears",explanationEn:"Appear = seem, stative.",explanationTh:"appear ที่แปลว่าดูเหมือน เป็น stative",rule:"Appear = seem stative",category:"Verbs changing meaning"},{id:36,sentence:"You ____ (always / lose) your lab access card! It's so frustrating.",thaiContext:"คุณทำบัตรห้องแล็บหายตลอดเลย! น่ารำคาญมาก - นิสัยน่ารำคาญ",options:["are always losing","always lose","have always lost","always lost"],correctAnswer:"are always losing",explanationEn:"Always + Present Continuous = annoying habit.",explanationTh:"always + Present Continuous ใช้บ่นนิสัยน่ารำคาญที่เกิดซ้ำๆ",rule:"Annoying habit: always + continuous",category:"Annoying habits"},{id:37,sentence:"He ____ (always / complain) about the workload, even though it's quite manageable.",thaiContext:"เขาบ่นเรื่องงานตลอด ทั้งที่งานก็จัดการได้ - บ่นเป็นนิสัยน่ารำคาญ",options:["is always complaining","always complains","has always complained","always complained"],correctAnswer:"is always complaining",explanationEn:"Annoying repeated complaint = present continuous with always.",explanationTh:"ใช้ Present Continuous + always เพื่อบ่นนิสัย",rule:"Always + continuous = complaint",category:"Annoying habits"},{id:38,sentence:"My laptop ____ (always / crash) when I try to run the statistical simulation.",thaiContext:"โน้ตบุ๊กฉันค้างตลอดเวลาพยายามรันการจำลอง - บ่น",options:["is always crashing","always crashes","has always crashed","always crashed"],correctAnswer:"is always crashing",explanationEn:"Always crashing = annoying habit of machine.",explanationTh:"บ่นว่าเครื่องค้างบ่อย ใช้ always + continuous",rule:"Machine annoying habit",category:"Annoying habits"},{id:39,sentence:"She ____ (constantly / interrupt) others during academic seminars.",thaiContext:"เธอขัดจังหวะคนอื่นตลอดในสัมมนาวิชาการ - นิสัยน่ารำคาญ",options:["is constantly interrupting","constantly interrupts","has constantly interrupted","constantly interrupted"],correctAnswer:"is constantly interrupting",explanationEn:"Constantly + continuous for annoying habit.",explanationTh:"constantly + Present Continuous = บ่นนิสัยน่ารำคาญ",rule:"Constantly + continuous",category:"Annoying habits"},{id:40,sentence:"They ____ (always / argue) over who should be the lead author.",thaiContext:"พวกเขาเถียงกันตลอดว่าใครควรเป็นผู้เขียนหลัก - นิสัย",options:["are always arguing","always argue","have always argued","always argued"],correctAnswer:"are always arguing",explanationEn:"Always + continuous emphasizes irritation.",explanationTh:"always + continuous เน้นความรำคาญ",rule:"Annoying argument habit",category:"Annoying habits"},{id:41,sentence:"The last train to Cambridge ____ (leave) at 11:15 PM tonight according to the timetable.",thaiContext:"รถไฟขบวนสุดท้ายไปเคมบริดจ์ออก 23:15 ตามตารางเวลา - ตารางเวลาอนาคต",options:["leaves","is leaving","will leave","has left"],correctAnswer:"leaves",explanationEn:"Timetable future uses Present Simple.",explanationTh:"ตารางเวลา รถไฟ เครื่องบิน ฉายหนัง ใช้ Present Simple บอกอนาคตได้",rule:"Timetable future: Present Simple",category:"Timetable future"},{id:42,sentence:"The new exhibition on renewable energy ____ (open) next Monday at 10 AM.",thaiContext:"นิทรรศการใหม่เปิดวันจันทร์หน้า 10 โมง - ตารางกำหนดการ",options:["opens","is opening","will open","has opened"],correctAnswer:"opens",explanationEn:"Scheduled opening = Present Simple for timetable.",explanationTh:"กำหนดการเปิดตามตาราง ใช้ Present Simple",rule:"Scheduled event = Simple",category:"Timetable future"},{id:43,sentence:"The flight to Tokyo ____ (depart) at 14:30 from Terminal 2 tomorrow.",thaiContext:"เที่ยวบินไปโตเกียวออก 14:30 พรุ่งนี้ - ตารางบิน",options:["departs","is departing","will depart","has departed"],correctAnswer:"departs",explanationEn:"Flight timetable = Present Simple.",explanationTh:"ตารางบิน ใช้ Present Simple",rule:"Flight timetable",category:"Timetable future"},{id:44,sentence:"The final examination ____ (end) at noon tomorrow as per the official schedule.",thaiContext:"สอบปลายภาคจบเที่ยงพรุ่งนี้ตามตารางทางการ - ตารางสอบ",options:["ends","is ending","will end","has ended"],correctAnswer:"ends",explanationEn:"Exam timetable = Present Simple.",explanationTh:"ตารางสอบ ใช้ Present Simple",rule:"Exam timetable",category:"Timetable future"},{id:45,sentence:"The shuttle bus ____ (arrive) every 20 minutes starting at 6 AM tomorrow.",thaiContext:"รถรับส่งมาทุก 20 นาทีเริ่ม 6 โมงเช้าพรุ่งนี้ - ตารางเดินรถ",options:["arrives","is arriving","will arrive","has arrived"],correctAnswer:"arrives",explanationEn:"Regular schedule = Present Simple.",explanationTh:"ตารางเดินรถประจำ ใช้ Present Simple",rule:"Regular timetable",category:"Timetable future"},{id:46,sentence:"I ____ (meet) my thesis advisor tomorrow morning to review my research proposal.",thaiContext:"ฉันจะพบอาจารย์ที่ปรึกษาพรุ่งนี้เช้าเพื่อตรวจข้อเสนอวิจัย - นัดหมายแล้ว",options:["am meeting","meet","will meet","have met"],correctAnswer:"am meeting",explanationEn:"Future arrangement = Present Continuous.",explanationTh:"นัดหมายที่ตกลงกันแล้ว ใช้ Present Continuous บอกอนาคต",rule:"Future arrangement: Present Continuous",category:"Future arrangements"},{id:47,sentence:"We ____ (fly) to Singapore next week to present our findings at the conference.",thaiContext:"เราจะบินไปสิงคโปร์สัปดาห์หน้าเพื่อนำเสนอผลการวิจัย - วางแผนแล้ว",options:["are flying","fly","will fly","have flown"],correctAnswer:"are flying",explanationEn:"Arranged future travel = Present Continuous.",explanationTh:"แผนการเดินทางที่จองแล้ว ใช้ Present Continuous",rule:"Arranged travel",category:"Future arrangements"},{id:48,sentence:"She ____ (give) a keynote speech at the international symposium on Friday evening.",thaiContext:"เธอจะกล่าวสุนทรพจน์หลักที่งานสัมมนานานาชาติเย็นวันศุกร์ - กำหนดการส่วนตัว",options:["is giving","gives","will give","has given"],correctAnswer:"is giving",explanationEn:"Personal schedule arrangement = Present Continuous.",explanationTh:"กำหนดการส่วนตัวที่วางไว้แล้ว ใช้ Present Continuous",rule:"Personal arrangement",category:"Future arrangements"},{id:49,sentence:"They ____ (host) a workshop on AI ethics this weekend for postgraduate students.",thaiContext:"พวกเขาจะจัดเวิร์กช็อปเรื่องจริยธรรม AI สุดสัปดาห์นี้ - จัดเตรียมแล้ว",options:["are hosting","host","will host","have hosted"],correctAnswer:"are hosting",explanationEn:"Hosting event arranged = Present Continuous.",explanationTh:"จัดงานที่เตรียมแล้ว ใช้ Present Continuous",rule:"Event arrangement",category:"Future arrangements"},{id:50,sentence:"My colleagues ____ (have) dinner with the visiting professor tonight at 7 PM.",thaiContext:"เพื่อนร่วมงานจะทานข้าวเย็นกับศาสตราจารย์รับเชิญคืนนี้ - นัดแล้ว",options:["are having","have","will have","have had"],correctAnswer:"are having",explanationEn:"Have dinner arrangement = Present Continuous.",explanationTh:"have dinner ที่เป็นนัดหมาย ใช้ Present Continuous",rule:"Dinner arrangement",category:"Future arrangements"},{id:51,sentence:"He ____ (interview) for a senior research position at Oxford tomorrow afternoon.",thaiContext:"เขาจะสัมภาษณ์ตำแหน่งนักวิจัยอาวุโสที่ออกซ์ฟอร์ดพรุ่งนี้บ่าย - นัดสัมภาษณ์แล้ว",options:["is interviewing","interviews","will interview","has interviewed"],correctAnswer:"is interviewing",explanationEn:"Interview arrangement = Present Continuous, or is being interviewed.",explanationTh:"นัดสัมภาษณ์ที่กำหนดแล้ว ใช้ Present Continuous",rule:"Interview arrangement",category:"Future arrangements"},{id:52,sentence:"The evaluation committee ____ (evaluate) all proposals next Monday in the main hall.",thaiContext:"คณะกรรมการประเมินจะประเมินข้อเสนอทั้งหมดวันจันทร์หน้า - แผนที่วางไว้",options:["is evaluating","evaluates","will evaluate","has evaluated"],correctAnswer:"is evaluating",explanationEn:"Committee arrangement = Present Continuous.",explanationTh:"แผนของคณะกรรมการที่วางไว้ ใช้ Present Continuous",rule:"Committee plan",category:"Future arrangements"},{id:53,sentence:"I ____ (not / work) this Saturday; I have a family commitment in Chiang Mai.",thaiContext:"ฉันไม่ทำงานเสาร์นี้ มีธุระครอบครัวที่เชียงใหม่ - ไม่ทำงานตามแผน",options:["am not working","don't work","won't work","haven't worked"],correctAnswer:"am not working",explanationEn:"Not working = arrangement not to work, Present Continuous.",explanationTh:"ไม่ทำงานตามแผนที่วางไว้ ใช้ Present Continuous ปฏิเสธ",rule:"Negative arrangement",category:"Future arrangements"},{id:54,sentence:"What ____ you ____ (do) this evening? - I'm presenting my research paper.",thaiContext:"คุณจะทำอะไรเย็นนี้? - ฉันจะนำเสนอเปเปอร์ - ถามแผนอนาคต",options:["are you doing","do you do","will you do","have you done"],correctAnswer:"are you doing",explanationEn:"Asking about arrangement, Present Continuous.",explanationTh:"ถามแผนอนาคตที่จัดไว้แล้ว ใช้ Present Continuous",rule:"Asking arrangement",category:"Future arrangements"},{id:55,sentence:"We ____ (launch) our new academic database system next month after extensive testing.",thaiContext:"เราจะเปิดตัวระบบฐานข้อมูลวิชาการใหม่เดือนหน้า - วางแผนเปิดตัว",options:["are launching","launch","will launch","have launched"],correctAnswer:"are launching",explanationEn:"Launch plan = arrangement, Present Continuous.",explanationTh:"แผนเปิดตัวที่กำหนดแล้ว ใช้ Present Continuous",rule:"Launch arrangement",category:"Future arrangements"},{id:56,sentence:"The global climate ____ (get) increasingly unpredictable due to human activities.",thaiContext:"ภูมิอากาศโลกกำลังแปรปรวนมากขึ้นเรื่อยๆ - สถานการณ์ที่กำลังเปลี่ยนแปลง",options:["is getting","gets","has got","will get"],correctAnswer:"is getting",explanationEn:"Changing situation = Present Continuous, especially with increasingly.",explanationTh:"สถานการณ์ที่กำลังเปลี่ยนแปลงเรื่อยๆ ใช้ Present Continuous",rule:"Changing situation",category:"Changing/developing"},{id:57,sentence:"More and more students ____ (rely) on AI tools to analyze academic literature.",thaiContext:"นักศึกษามากขึ้นเรื่อยๆ พึ่งพาเครื่องมือ AI - แนวโน้มที่เพิ่มขึ้น",options:["are relying","rely","have relied","will rely"],correctAnswer:"are relying",explanationEn:"More and more = growing trend, Present Continuous.",explanationTh:"more and more บอกแนวโน้มเพิ่มขึ้น ใช้ Present Continuous",rule:"More and more trend",category:"Changing/developing"},{id:58,sentence:"The cost of advanced research equipment ____ (become) more and more prohibitive.",thaiContext:"ต้นทุนอุปกรณ์วิจัยขั้นสูงแพงขึ้นเรื่อยๆ - แพงขึ้นเรื่อยๆ",options:["is becoming","becomes","has become","will become"],correctAnswer:"is becoming",explanationEn:"More and more + become = changing, Present Continuous.",explanationTh:"more and more expensive = กำลังแพงขึ้นเรื่อยๆ ใช้ Continuous",rule:"Increasing cost",category:"Changing/developing"},{id:59,sentence:"Public awareness about sustainable development ____ (grow) rapidly in recent years.",thaiContext:"ความตระหนักเรื่องการพัฒนายั่งยืนเติบโตอย่างรวดเร็ว - กำลังเติบโต",options:["is growing","grows","has grown","will grow"],correctAnswer:"is growing",explanationEn:"Rapidly growing awareness = developing situation.",explanationTh:"สถานการณ์ที่กำลังพัฒนา ใช้ Present Continuous",rule:"Growing awareness",category:"Changing/developing"},{id:60,sentence:"The environmental situation ____ (deteriorate) - we must identify solutions immediately.",thaiContext:"สถานการณ์สิ่งแวดล้อมกำลังแย่ลง - ต้องหาทางแก้ไขทันที",options:["is deteriorating","deteriorates","has deteriorated","will deteriorate"],correctAnswer:"is deteriorating",explanationEn:"Deteriorating now = changing for worse, Present Continuous.",explanationTh:"กำลังแย่ลงตอนนี้ ใช้ Present Continuous",rule:"Deteriorating situation",category:"Changing/developing"},{id:61,sentence:"She ____ (work) remotely from Berlin this month while her office is being renovated.",thaiContext:"เธอทำงานทางไกลจากเบอร์ลินเดือนนี้ - ชั่วคราว",options:["is working","works","has worked","has been working"],correctAnswer:"is working",explanationEn:"This month = temporary, Present Continuous.",explanationTh:"this month บอกชั่วคราว ใช้ Present Continuous",rule:"Temporary this month",category:"Temporary vs permanent"},{id:62,sentence:"I ____ (live) with my parents until I find affordable accommodation near campus.",thaiContext:"ฉันอาศัยอยู่กับพ่อแม่ชั่วคราวจนกว่าจะหาที่พักได้ - ชั่วคราว",options:["am living","live","have lived","will live"],correctAnswer:"am living",explanationEn:"Until I find = temporary situation.",explanationTh:"อาศัยชั่วคราวจนกว่าจะหาที่ใหม่ได้ ใช้ Continuous",rule:"Temporary until",category:"Temporary vs permanent"},{id:63,sentence:"He ____ (live) in Tokyo; that's his permanent residence and workplace.",thaiContext:"เขาอาศัยอยู่ที่โตเกียว - ถาวร",options:["lives","is living","has lived","will live"],correctAnswer:"lives",explanationEn:"Permanent residence = Present Simple.",explanationTh:"ที่อยู่ถาวร ใช้ Present Simple",rule:"Permanent residence",category:"Temporary vs permanent"},{id:64,sentence:"They ____ (stay) at a hotel near the university during the international conference.",thaiContext:"พวกเขาพักที่โรงแรมใกล้มหาวิทยาลัยช่วงประชุม - ชั่วคราวช่วงประชุม",options:["are staying","stay","have stayed","will stay"],correctAnswer:"are staying",explanationEn:"During conference = temporary.",explanationTh:"พักชั่วคราวช่วงประชุม ใช้ Continuous",rule:"Temporary stay",category:"Temporary vs permanent"},{id:65,sentence:"The research team ____ (conduct) fieldwork in the Amazon this year for their project.",thaiContext:"ทีมวิจัยทำการวิจัยภาคสนามในแอมะซอนปีนี้ - โครงการชั่วคราวปีนี้",options:["is conducting","conducts","has conducted","will conduct"],correctAnswer:"is conducting",explanationEn:"This year project = temporary.",explanationTh:"โครงการชั่วคราวปีนี้ ใช้ Present Continuous",rule:"Temporary project",category:"Temporary vs permanent"},{id:66,sentence:"This advanced laboratory ____ (analyze) over 200 samples per day on a regular basis.",thaiContext:"ห้องปฏิบัติการนี้วิเคราะห์ตัวอย่างกว่า 200 ตัวอย่างต่อวันเป็นประจำ - ความสามารถถาวร",options:["analyzes","is analyzing","has analyzed","will analyze"],correctAnswer:"analyzes",explanationEn:"On a regular basis = permanent habit/capacity.",explanationTh:"เป็นประจำ ความสามารถถาวร ใช้ Present Simple",rule:"Regular capacity = Simple",category:"Temporary vs permanent"},{id:67,sentence:"My brother ____ (study) at Cambridge this semester as an exchange student.",thaiContext:"น้องชายฉันเรียนที่เคมบริดจ์เทอมนี้ในฐานะนักเรียนแลกเปลี่ยน - ชั่วคราวเทอมนี้",options:["is studying","studies","has studied","will study"],correctAnswer:"is studying",explanationEn:"This semester = temporary.",explanationTh:"เทอมนี้ชั่วคราว ใช้ Present Continuous",rule:"This semester temporary",category:"Temporary vs permanent"},{id:68,sentence:"The Mekong River ____ (flow) through six countries in Southeast Asia.",thaiContext:"แม่น้ำโขงไหลผ่านหกประเทศในเอเชียตะวันออกเฉียงใต้ - ความจริงถาวร",options:["flows","is flowing","has flowed","will flow"],correctAnswer:"flows",explanationEn:"Geographical fact = Present Simple, permanent.",explanationTh:"ข้อเท็จจริงทางภูมิศาสตร์ถาวร ใช้ Present Simple",rule:"Geographical permanent",category:"Temporary vs permanent"},{id:69,sentence:"She ____ (teach) two additional courses this term because her colleag <!-- GOOGLE SHEET SCORE SUBMISSION V2 - ระบบส่งคะแนนแบบใหม่ ทนกว่าเดิม -->
<div id="score-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999999;align-items:center;justify-content:center;padding:20px;font-family:'Sarabun','Noto Sans Thai',system-ui,sans-serif">
  <div style="background:white;border-radius:20px;max-width:440px;width:100%;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:popIn .3s ease">
    <div style="text-align:center;margin-bottom:16px"><div style="font-size:40px">🎉</div><h3 style="font-size:19px;font-weight:800;margin:8px 0 4px">ทำเสร็จแล้ว! ส่งคะแนนเลยไหม?</h3><p style="font-size:13px;color:#78716c">กรอกชื่อเพื่อให้ครูบันทึกคะแนนลง Google Sheet อัตโนมัติ</p></div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <input id="student-name" placeholder="ชื่อ-นามสกุล (บังคับ)" style="padding:12px 14px;border:1.5px solid #e7e5e4;border-radius:12px;font-size:14px;width:100%;box-sizing:border-box;outline:none">
      <input id="student-class" placeholder="ชั้น / ห้อง (เช่น ม.2/1)" style="padding:12px 14px;border:1.5px solid #e7e5e4;border-radius:12px;font-size:14px;width:100%;box-sizing:border-box;outline:none">
      <div id="score-preview" style="background:#f5f5f4;padding:12px 14px;border-radius:12px;font-size:14px;color:#1c1917;font-weight:600;text-align:center;border:1px dashed #d6d3d1"></div>
      <button id="submit-score-btn" style="background:#4f46e5;color:white;padding:13px;border:none;border-radius:12px;font-weight:700;cursor:pointer;width:100%;font-size:15px;box-shadow:0 4px 14px rgba(79,70,229,.3)">📤 ส่งคะแนนให้ครู</button>
      <button id="skip-score-btn" style="background:#f5f5f4;color:#57534e;padding:11px;border:none;border-radius:12px;cursor:pointer;width:100%;font-size:14px">ข้าม ไม่ส่งตอนนี้</button>
      <p id="submit-status" style="font-size:13px;text-align:center;display:none;margin:4px 0 0;padding:8px;border-radius:8px"></p>
    </div>
  </div>
</div>
<style>@keyframes popIn{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}} #score-modal input:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.15)}</style>
<script>
(function(){
  const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbzc4ofn7BMgVzfjRwMe2Mifuk0kp8vVQwlAkV4FKoIcG2qnNxPKuvBM2lTDD6I-Mpf0/exec";
  const TEST_NAME = "100-Pool-Random-Test_Present_Simple-Vs-Continuous_Advanced02";
  let modalShown = false;
  let currentScore = 0;
  let currentTotal = 20;

  function getScoreFromPage(){
    try{
      const bodyText = document.body.innerText;
      // หาเลข 7 / 20 แบบในรูป
      const patterns = [
        /(\d+)\s*\/\s*20/g,
        /คะแนน[\s\S]*?(\d+)\s*\/\s*(\d+)/,
        /(\d+)\s*ถูก/g
      ];
      // วิธีที่ชัวร์สุด: หา span ตัวใหญ่ที่เป็นคะแนน
      const bigScoreEl = document.querySelector('span.text-\[44px\]');
      if(bigScoreEl) {
        const s = parseInt(bigScoreEl.textContent);
        if(!isNaN(s)) { currentScore = s; currentTotal = 20; return {score:s,total:20}; }
      }
      // fallback: หาจาก text ที่มี / 20
      const m = bodyText.match(/(\d+)\s*\/\s*20/);
      if(m) {
        // เอาตัวแรกที่เจอหลังคำว่า สรุปผล
        const summaryIndex = bodyText.indexOf('สรุปผลการทดสอบ');
        if(summaryIndex > -1){
          const after = bodyText.substring(summaryIndex, summaryIndex+200);
          const mm = after.match(/(\d+)\s*\/\s*20/);
          if(mm) return {score:parseInt(mm[1]), total:20};
        }
        return {score:parseInt(m[1]), total:20};
      }
    }catch(e){}
    return null;
  }

  function showScoreModal(score,total){
    if(modalShown) return;
    modalShown = true;
    currentScore = score; currentTotal = total;
    const percent = Math.round(score/total*100);
    const preview = document.getElementById('score-preview');
    if(preview) preview.innerText = `📊 ${TEST_NAME} — ได้ ${score} / ${total} (${percent}%)`;
    const modal = document.getElementById('score-modal');
    if(modal) modal.style.display = 'flex';
    
    // ปุ่มส่ง
    const btn = document.getElementById('submit-score-btn');
    const status = document.getElementById('submit-status');
    if(btn){
      btn.onclick = async () => {
        const name = document.getElementById('student-name').value.trim();
        const classRoom = document.getElementById('student-class').value.trim();
        if(!name){ alert('กรอกชื่อก่อนนะครับ 😊'); document.getElementById('student-name').focus(); return; }
        btn.innerText = '⏳ กำลังส่ง...'; btn.disabled = true;
        btn.style.opacity = '0.7';
        try{
          await fetch(GOOGLE_SHEET_URL, {
            method: 'POST', mode: 'no-cors',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({
              name: name, classRoom: classRoom, testName: TEST_NAME,
              score: score, total: total, percent: percent,
              details: `${TEST_NAME} - ${score}/${total} (${percent}%)`,
              timestamp: new Date().toISOString(),
              userAgent: navigator.userAgent
            })
          });
          status.style.display='block'; status.style.background='#dcfce7'; status.style.color='#166534';
          status.innerText = '✅ ส่งคะแนนสำเร็จ! ครูได้รับแล้วใน Google Sheet';
          btn.innerText = '✅ ส่งแล้ว'; btn.style.background='#16a34a';
          setTimeout(()=>{ document.getElementById('score-modal').style.display='none'; modalShown = false; }, 2500);
        }catch(e){
          status.style.display='block'; status.style.background='#fee2e2'; status.style.color='#991b1b';
          status.innerText = '❌ ส่งไม่สำเร็จ ลองใหม่นะครับ — ' + e.message;
          btn.innerText = '🔄 ลองใหม่'; btn.disabled = false; btn.style.opacity='1';
        }
      };
    }
    const skip = document.getElementById('skip-score-btn');
    if(skip) skip.onclick = () => { document.getElementById('score-modal').style.display='none'; modalShown = false; };
  }

  // วิธีตรวจจับแบบใหม่: ดูว่ามีคำว่า "สรุปผลการทดสอบ" โผล่มาหรือยัง
  function checkIfFinished(){
    if(modalShown) return;
    const bodyText = document.body.innerText;
    if(bodyText.includes('สรุปผลการทดสอบ') && bodyText.includes('/ 20')){
      const result = getScoreFromPage();
      if(result && result.score >=0){
        console.log('Score detected:', result);
        showScoreModal(result.score, result.total);
      }
    }
  }

  // ตรวจทุก 1 วิ + ใช้ MutationObserver ดูการเปลี่ยนแปลงของ DOM
  setInterval(checkIfFinished, 1000);
  
  const observer = new MutationObserver(checkIfFinished);
  observer.observe(document.body, {childList:true, subtree:true});

  // เผื่อกรณีโหลดหน้านี้มาแล้วเป็นหน้าสรุปเลย (รีเฟรช)
  window.addEventListener('load', () => setTimeout(checkIfFinished, 1500));

  console.log('✅ Score system ready for', TEST_NAME);
})();
</script>
