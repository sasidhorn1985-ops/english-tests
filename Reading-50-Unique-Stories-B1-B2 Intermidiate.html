Morning starts differently now. Ten years ago, people used an alarm clock, read a paper newspaper, and checked a wall calendar. Today, one device does all of that before we even get out of bed. It wakes us, shows the news, tells us the weather, and plans our route to work.

This change has practical benefits. You can order food, pay bills, and talk to your grandmother in another country without leaving your sofa. During the pandemic in 2020, smartphones kept families connected when they could not meet. Maps mean fewer people get lost in new cities.

But there are costs. Studies from 2023 show that many teenagers check their phones within five minutes of waking up. Sleep becomes worse because blue light keeps the brain awake. People also compare their lives to perfect photos online and feel sad.

The key is balance. Experts suggest simple rules: no phones at dinner, no screens one hour before sleep, and turning off notifications for non-important apps. The phone is a powerful tool, but we decide how to use it.`,questions:[{q:"What does the passage say about phone use in 2010?",options:["Everyone had iPhone 4","Internet on phone was slow and phones were luxury","Phones had no internet","People spent 6 hours daily"],correct:1,explain:"In 2010 iPhone 4 was luxury and internet was slow."},{q:"How much time do people spend on phones today according to the text?",options:["2 hours","About 6 hours daily","10 hours","30 minutes"],correct:1,explain:"Text says almost 6 hours looking at small screen."},{q:"What is one benefit mentioned?",options:["Phones are free","Helped families stay connected in pandemic","No one gets tired","Newspapers are cheaper"],correct:1,explain:"Smartphones kept families connected during pandemic."},{q:"What is a negative effect mentioned?",options:["Better sleep","Blue light makes sleep worse","Maps don't work","Alarm clocks are expensive"],correct:1,explain:"Blue light keeps brain awake and hurts sleep."},{q:"What does the author suggest at the end?",options:["Throw away phones","Use phones with balance and rules","Never use maps","Only use iPhone 4"],correct:1,explain:"Key is balance and simple rules."}]},{id:2,title:"What is Artificial Intelligence?",category:"Technology",level:"B1",words:278,passage:`If you have used Siri to set an alarm or seen Netflix suggest a movie you might like, you have already used artificial intelligence. AI is not a robot from a science fiction film. It is software that learns from data and makes predictions.

Imagine teaching a child to recognize dogs. You show many pictures of dogs, and slowly the child learns what a dog looks like. AI works in a similar way, but much faster. It looks at thousands or millions of examples. After seeing enough data, it can guess what comes next.

We meet two main types in daily life. The first is called narrow AI. It does one job very well. For example, Google Translate can change English to Thai, but it cannot drive a car. The second dream is general AI, which could do any human job. That does not exist yet.

AI is useful because it saves time. Doctors use AI to look at X-ray images and find problems quickly. Farmers use it to check which plants need water. Online shops use it to recommend shoes based on what you bought before.

There are concerns too. If AI learns from biased data, it can make unfair decisions. Also, some jobs might disappear as machines become better. The best approach is to teach people how to work with AI, not fear it. Understanding basic ideas helps everyone make better choices about technology.`,questions:[{q:"What is AI according to the passage?",options:["Only a sci-fi robot","Software that learns from data and makes predictions","A new phone model","Human brain"],correct:1,explain:"AI is software that learns from data."},{q:"How does AI learn, as explained?",options:["By sleeping","By looking at many examples like a child","By reading one book","By magic"],correct:1,explain:"It looks at thousands of examples like teaching a child."},{q:"What is narrow AI?",options:["AI that does one job very well","AI that can do everything","AI that doesn't exist","AI for children only"],correct:0,explain:"Narrow AI does one job very well."},{q:"Which example of AI use is mentioned?",options:["Doctors using AI for X-rays","AI cooking dinner","AI building houses alone","AI writing laws"],correct:0,explain:"Doctors use AI to look at X-ray images."},{q:"What concern is mentioned about AI?",options:["AI is too cheap","It can make unfair decisions if data is biased","AI needs no electricity","AI cannot save time"],correct:1,explain:"If AI learns from biased data, it can be unfair."}]},{id:3,title:"Why Video Games Are Good for Brain",category:"Technology",level:"B1",words:272,passage:`For many years, parents worried that video games were a waste of time. A 2023 study from Karolinska Institute in Sweden changed that view. Researchers followed 5,000 children aged 10 to 12 for two years and found that kids who played games improved their memory and problem-solving faster than those who did not.

The reason is that good games are like puzzles. In Minecraft, players must plan, collect resources, and build structures. In strategy games like Age of Empires, you need to manage money, time, and workers. Your brain practices planning and quick decisions without you noticing it.

Teamwork is another benefit. Online games such as Fortnite or Valorant require players to talk, share tasks, and help each other. A quiet student can become a team leader in the game. Teachers in Finland now use games to teach math and language because students are more motivated.

Of course, not all gaming is healthy. Playing for 8 hours without breaks can hurt eyes and posture. Games with constant rewards can be addictive. Experts recommend the 60-60 rule: after 60 minutes, take a 10-minute break and look 20 feet away.

When played in moderation, games can be part of a balanced life. Like reading or sports, they teach skills that are useful in school and work. The key question is not if you play, but what you play and how long.`,questions:[{q:"What did the 2023 Swedish study find?",options:["Games have no effect","Kids who played games improved memory and problem-solving","Games make kids sick","Only adults benefit"],correct:1,explain:"Kids who played improved faster."},{q:"Why are games like puzzles?",options:["They require planning and resource management","They are easy","They have no rules","They are only for fun"],correct:0,explain:"Need to plan, collect resources, build."},{q:"How do online games help with teamwork?",options:["Players must talk and share tasks","They stop people talking","Only one person plays","They are always violent"],correct:0,explain:"Require talking and helping each other."},{q:"What is the 60-60 rule?",options:["Play 60 games","After 60 minutes take a 10-min break","60 players per game","60 dollars per game"],correct:1,explain:"After 60 mins, break and look away."},{q:"What is the main message?",options:["All games are bad","Games can be good in moderation","Children should not play","Only Minecraft is good"],correct:1,explain:"When played in moderation, part of balanced life."}]},{id:4,title:"How Online Shopping Works",category:"Technology",level:"B1",words:290,passage:`Last year, global online shopping reached $5.7 trillion. From your phone, you can buy a book from the US or shoes from Vietnam in less than two minutes. But what happens after you click 'Buy Now'?

Step one is the digital store. Companies like Amazon, Lazada, or Shopee create websites that act like huge shopping malls. They show photos, prices, and reviews. When you add items to your cart, a computer system checks if the product is available in a warehouse.

Step two is payment. Your card details are encrypted, which means they are turned into secret codes that hackers cannot easily read. The money goes to the seller, but a small part is held by the payment company until you confirm you received the product.

Step three is the most complex: delivery. Big companies use robots in warehouses to pick your order. Then trucks, planes, and finally a local rider bring the package to your door. In Bangkok, this can take 24 hours. In remote areas, it may take three days.

There are risks. Sometimes products look different from photos. Returns are possible but take time. Scams also exist. Smart shoppers check seller ratings, read at least 10 reviews, and use cash on delivery when unsure.

Despite problems, online shopping saves time and often money because online stores have lower rent costs than physical shops. Understanding the process helps you shop more safely and wisely.`,questions:[{q:"How much was global online shopping worth last year?",options:["$5.7 trillion","$5.7 million","$57 billion","$570"],correct:0,explain:"$5.7 trillion mentioned."},{q:"What does encrypted payment mean?",options:["Payment is turned into secret codes","Payment is free","Payment is slow","Payment is cash only"],correct:0,explain:"Turned into secret codes hackers cannot read."},{q:"What is step three in the process?",options:["Delivery with robots and riders","Making the product","Closing the shop","Writing reviews"],correct:0,explain:"Delivery is most complex step."},{q:"What do smart shoppers do?",options:["Never read reviews","Check seller ratings and read reviews","Always pay first","Buy without checking"],correct:1,explain:"Check ratings, read 10 reviews, use COD when unsure."},{q:"Why is online shopping often cheaper?",options:["Lower rent costs than physical shops","Products are fake","No workers","No delivery cost"],correct:0,explain:"Online stores have lower rent costs."}]},{id:5,title:"The Problem with Social Media",category:"Technology",level:"B1",words:275,passage:`Maya is 19 years old and spends 4 hours and 12 minutes on social media every day. She is not unusual. The average teenager today spends more than 3 hours scrolling Instagram, TikTok, and X. The apps are designed to keep you watching as long as possible.

One major issue is comparison. People usually post their best moments: vacations, perfect skin, new clothes. When you see 100 perfect photos while sitting in your bedroom studying, it is normal to feel unhappy. A 2022 survey in the UK found that 62% of young women feel worse about their bodies after using Instagram.

Another problem is time loss. Each short video seems like only 15 seconds, but 40 videos become 10 minutes. Before you know it, an hour has passed. Sleep suffers too. Many people check their phones in bed, and blue light plus exciting content makes it hard to fall asleep.

The good news is you can control this. Simple actions help a lot. First, remove social apps from your home screen so you must search for them. Second, set a daily limit of 90 minutes using your phone's settings. Third, follow accounts that teach you something useful, not just make you jealous.

Social media itself is not evil. It connects friends and spreads useful news quickly. The challenge is to use it as a tool you control, not let it control you.`,questions:[{q:"How much time does Maya spend on social media?",options:["1 hour","4 hours 12 minutes","10 hours","30 minutes"],correct:1,explain:"Maya spends 4h12m."},{q:"What problem does comparison cause?",options:["People feel worse after seeing perfect photos","People become happier","People stop using phones","People sleep better"],correct:0,explain:"62% feel worse about bodies."},{q:"How does time loss happen?",options:["Short videos add up quickly","Videos are long","Phones are broken","Internet is slow"],correct:0,explain:"40 videos of 15s become 10 minutes."},{q:"What is one suggested solution?",options:["Buy a new phone","Remove apps from home screen","Watch more videos","Never sleep"],correct:1,explain:"Remove apps from home screen."},{q:"What is the final view on social media?",options:["It is evil","It is a tool you should control","It should be banned","It has no benefits"],correct:1,explain:"Use it as tool you control."}]},{id:6,title:"Electric Cars and Environment",category:"Technology",level:"B1",words:283,passage:`When Tesla launched Model S in 2012, many people thought electric cars were just toys for rich people. Now, in 2024, there are over 40 million electric cars on roads worldwide. In Norway, 82% of new cars sold last year were electric.

The main advantage is clean air. A normal petrol car burns fuel and releases carbon dioxide and tiny particles that damage lungs. An electric car has no exhaust pipe, so it produces no smoke while driving. In cities like London and Bangkok, this could reduce air pollution by 30% if many drivers switch.

Cost is another factor. An electric car costs more at first. A Tesla Model 3 costs around $40,000 while a similar petrol car costs $25,000. However, electricity is much cheaper than petrol. In Thailand, driving 100 km costs about 80 baht with electricity versus 300 baht with petrol. Over five years, the electric car becomes cheaper.

Challenges remain. Charging takes longer than filling petrol. Fast chargers need 30 minutes for 80%, while petrol takes 5 minutes. Also, not every apartment has a charger. Governments are building more public chargers, but in rural areas they are still rare.

Despite these issues, sales grow every year because batteries improve and become cheaper. Most experts predict that by 2035, electric cars will cost the same as petrol cars to buy, and will be clearly better for both wallet and planet.`,questions:[{q:"How many electric cars are on roads worldwide in 2024?",options:["40 million","4 million","400 thousand","40 thousand"],correct:0,explain:"Over 40 million."},{q:"What is the main environmental benefit?",options:["No smoke while driving, reducing air pollution","Louder sound","More expensive","Faster"],correct:0,explain:"No exhaust pipe, no smoke."},{q:"What about long-term cost?",options:["Electric becomes cheaper after 5 years","Always more expensive","Free to buy","No electricity cost"],correct:0,explain:"Electricity cheaper, becomes cheaper over 5 years."},{q:"What is a current challenge?",options:["Charging takes longer than petrol","No need to charge","Electric cars cannot move","All apartments have chargers"],correct:0,explain:"Charging takes 30 mins vs 5 mins petrol."},{q:"What do experts predict for 2035?",options:["Electric will cost same as petrol to buy","Electric will disappear","Petrol will be free","No cars will exist"],correct:0,explain:"By 2035 cost same as petrol to buy."}]},{id:7,title:"What is Cybersecurity?",category:"Technology",level:"B1",words:279,passage:`Imagine you left your house door open with your wallet on the table. That is what using '123456' as a password is like for your online life. Cybersecurity is the practice of protecting your digital house from thieves.

The most common attack is phishing. You receive an email that looks like it is from your bank: 'Your account has a problem, click here.' The link takes you to a fake website that steals your password. In 2023, over 300 million phishing emails were sent every day worldwide.

Hackers also use software that guesses passwords. If your password is short or uses your birthday, it can be cracked in minutes. Longer passwords are much safer. 'ILoveMango2024!' is far stronger than 'mango123' because it has 15 characters and mixes types.

How can you stay safe? Security experts give four simple tips. First, use a different password for each important account. Second, turn on two-factor authentication, which asks for a code from your phone. Third, update your apps regularly because updates fix security holes. Fourth, think before you click links in emails or messages.

You do not need to be a computer expert to be safe. Small habits like these protect 95% of attacks. Just like locking your door at night, digital locks become automatic once you practice them.`,questions:[{q:"What is cybersecurity compared to?",options:["Protecting your digital house","Building a real house","Buying a wallet","Leaving door open"],correct:0,explain:"Practice of protecting digital house."},{q:"What is phishing?",options:["Fake email that looks like bank to steal password","Fishing for fish","A type of password","A safe email"],correct:0,explain:"Email looks from bank, steals password."},{q:"Why is 'ILoveMango2024!' stronger than 'mango123'?",options:["Longer and mixes types","Shorter","Uses only letters","Same strength"],correct:0,explain:"15 characters and mixes types."},{q:"What is two-factor authentication?",options:["Code from your phone extra step","One password","No password needed","Only email"],correct:0,explain:"Asks for code from phone."},{q:"How much protection do simple habits give?",options:["95% of attacks","5%","No protection","100% guarantee"],correct:0,explain:"Protect 95% of attacks."}]},{id:8,title:"How YouTube Makes Money",category:"Technology",level:"B1",words:282,passage:`Have you ever wondered why you see an ad before a video about cooking? That ad is how YouTube makes most of its money. In 2023, YouTube earned $31.5 billion, almost all from advertising.

The process is straightforward. Companies want to sell products to specific people. A company that sells baby toys wants to reach young parents. YouTube knows what videos you watch, so it can show baby toy ads to parents who watch family channels. This is called targeted advertising.

Creators also benefit. When you watch an ad on a creator's video, YouTube keeps 45% and gives 55% to the creator. For a channel with 1 million subscribers, this can mean $2,000 to $5,000 per month. Some large channels earn much more. That is why you see 'Please don't skip ads' messages.

The algorithm decides which videos you see next. It looks at what you watched before, how long you watched, and what similar users liked. Its goal is to keep you watching. If you watch three cat videos, it will suggest more cat videos.

For viewers, there is a trade-off. You get free entertainment and education, but you watch ads and share data about your interests. YouTube Premium removes ads for $13.99 per month, but most people choose the free version with ads.

Understanding this system helps you be a smarter viewer. You can choose what data to share and support creators you like by watching their ads.`,questions:[{q:"How much did YouTube earn in 2023?",options:["$31.5 billion","$3.15 billion","$315 billion","$31.5 million"],correct:0,explain:"$31.5 billion almost all from ads."},{q:"What is targeted advertising?",options:["Showing baby toy ads to young parents based on viewing","Random ads","No ads","Only baby videos"],correct:0,explain:"Show ads to specific people based on what they watch."},{q:"How is ad money split?",options:["YouTube 45%, creator 55%","YouTube 100%","Creator 100%","50-50"],correct:0,explain:"YouTube keeps 45% gives 55% to creator."},{q:"What does the algorithm do?",options:["Decides which videos you see next to keep watching","Deletes videos","Makes videos","Stops ads"],correct:0,explain:"Looks at what you watched, keeps you watching."},{q:"What is YouTube Premium?",options:["Paid version without ads for $13.99","Free with more ads","A new channel","A creator"],correct:0,explain:"Removes ads for $13.99 per month."}]},{id:9,title:"Why Finnish Schools Are Different",category:"Society",level:"B1",words:277,passage:`In most countries, children start homework at age 6 and take big exams at age 10. Finland does the opposite, and it works. Finnish students often rank top 3 in the world for reading and math, yet they have less homework than almost any other country.

One big difference is no standardized exams until age 16. Teachers design their own small tests to check understanding, but there is no national test that ranks all schools. This reduces stress for children and allows teachers to focus on learning, not test preparation.

Play is considered serious learning. In primary school, students have 15 minutes of outdoor play after every 45 minutes of class. They climb trees, play in snow, and build things. Research shows that after play, children concentrate better and remember more. Teachers say a tired child cannot learn.

Teachers are also treated differently. To become a teacher in Finland, you need a master's degree, and only 10% of applicants are accepted. Because teachers are highly respected, similar to doctors, they have freedom to choose their own methods.

Finally, equality is key. All schools are free, including meals, books, and even transport if needed. There are almost no private schools. A child from a poor family gets the same quality education as a child from a rich family. This system shows that less pressure and more trust can produce excellent results.`,questions:[{q:"How do Finnish students rank?",options:["Top 3 in world for reading and math","Bottom 3","Middle","Not ranked"],correct:0,explain:"Often rank top 3."},{q:"When do they have national exams?",options:["No standardized until age 16","At age 6","Every month","At age 10"],correct:0,explain:"No standardized exams until 16."},{q:"How much play do primary students have?",options:["15 mins after every 45 mins class","No play","5 hours","Only indoors"],correct:0,explain:"15 minutes outdoor play after 45 mins."},{q:"What is required to become teacher?",options:["Master's degree and only 10% accepted","No degree","Only high school","Easy entry"],correct:0,explain:"Need master's, only 10% accepted."},{q:"What about equality?",options:["All schools free including meals and books","Only rich get free","Private schools common","Poor get less"],correct:0,explain:"All schools free including meals books."}]},{id:10,title:"Life in Big Cities vs Small Towns",category:"Society",level:"B1",words:284,passage:`Tokyo has 37 million people, more than the entire population of Canada. In contrast, the small town of Pai in northern Thailand has only 2,300 residents. Both places offer happiness, but in very different ways.

Big cities attract people with opportunities. There are more jobs, especially in technology, finance, and entertainment. You can find food from 50 different countries within one kilometer. Hospitals have special doctors for every condition. Public transport runs every 3 minutes, so you do not need a car.

However, city life has stress. Apartments are small and expensive. In Hong Kong, average rent for a tiny 30 square meter flat is $2,000 per month. Noise is constant, and many people feel lonely despite being surrounded by millions. Commuting for 90 minutes each day is common.

Small towns offer the opposite. Life is slower and cheaper. Neighbors know each other and often help without being asked. Air is cleaner, and you can see stars at night. In Pai, many residents grow their own vegetables and have time for hobbies.

The downside is fewer choices. There may be only one high school and limited job options. Young people often move to cities for university and stay there. Internet has helped a lot, allowing remote work from small towns, but not all jobs can be done online.

Many people now try a mix: live in a small town but visit the city for work or fun a few times a month. The best place depends on what you value most at your life stage.`,questions:[{q:"How many people live in Tokyo?",options:["37 million","2,300","1 million","5 million"],correct:0,explain:"37M more than Canada."},{q:"What is an advantage of big cities?",options:["More jobs and diverse food","Cheaper rent","Cleaner air","Less noise"],correct:0,explain:"More jobs, food from 50 countries."},{q:"What is a problem with city life?",options:["Small expensive apartments and loneliness","Too much space","No jobs","No transport"],correct:0,explain:"Small expensive, lonely despite millions."},{q:"What is an advantage of small towns?",options:["Neighbors help and cleaner air","More job choices","Many high schools","No stars"],correct:0,explain:"Neighbors know each other, cleaner air, stars."},{q:"What mix are some people trying?",options:["Live in small town, visit city sometimes","Live in two cities","Never visit city","Only city"],correct:0,explain:"Live in small town but visit city sometimes."}]},{id:11,title:"How K-Pop Became Popular Worldwide",category:"Society",level:"B1",words:286,passage:`In 2012, Psy's 'Gangnam Style' was the first K-Pop song most foreigners heard. Twelve years later, K-Pop is a global industry worth $12.5 billion. BTS alone has over 100 million fans called ARMY in 100 countries.

Success was not accidental. Korean entertainment companies created a training system that starts when future stars are 12 or 13 years old. Trainees practice singing, dancing, and languages for 8-10 hours daily for many years before they debut. This hard work creates extremely skilled performers.

Social media turned local fans into global fans. Groups post daily videos on YouTube, TikTok, and Weverse. Fans can comment and feel close to their idols. When BTS tweeted, it got 1 million retweets in 30 minutes. This connection is stronger than traditional pop stars who appeared only on TV once a week.

Language learning is an unexpected effect. According to Duolingo's 2023 report, Korean is the 7th most studied language in the world, up from 15th in 2015. Many learners say they started because of K-Pop lyrics. Universities in the US and Thailand now offer Korean culture courses.

K-Pop also changed beauty and fashion trends. The 'glass skin' skincare routine from Korea is now popular worldwide. However, critics worry about pressure on young idols and strict beauty standards. Fans and companies are now discussing healthier working conditions.

From one viral video to a worldwide culture, K-Pop shows how internet can spread music beyond language barriers.`,questions:[{q:"What was the first K-Pop song many foreigners heard?",options:["Gangnam Style 2012","BTS song","No song","Traditional song"],correct:0,explain:"Psy's Gangnam Style 2012."},{q:"How much is K-Pop industry worth now?",options:["$12.5 billion","$1 billion","$100 million","$12 million"],correct:0,explain:"$12.5B industry."},{q:"How do companies train stars?",options:["Practice 8-10 hours daily from age 12-13","No training","One hour weekly","Only singing"],correct:0,explain:"Training from 12-13, 8-10 hours daily."},{q:"What effect on language learning?",options:["Korean is 7th most studied, many learn because of K-Pop","No effect","Korean is least studied","Only English studied"],correct:0,explain:"7th most studied, started because of lyrics."},{q:"What criticism is mentioned?",options:["Pressure on young idols and beauty standards","No criticism","Too easy training","Not popular"],correct:0,explain:"Worry about pressure and strict beauty standards."}]},{id:12,title:"Why People Work From Home Now",category:"Society",level:"B1",words:280,passage:`Before 2020, only 5% of Americans worked from home full-time. When COVID-19 spread, offices closed overnight and everyone had to learn Zoom. Three years later, 28% of work days in the US are still done from home, and the trend is global.

Technology made this shift possible. High-speed internet, free video calls, and tools like Slack and Google Docs allow teams to collaborate from different cities. A designer in Chiang Mai can work for a company in London without moving.

Employees like remote work for several reasons. The biggest is time. Without commuting, people save an average of 72 minutes per day. They can spend that time with family, exercise, or sleep. Work-life balance improves when you can cook lunch at home or walk your dog between meetings.

Companies have mixed feelings. Some, like Airbnb, allow employees to work from anywhere forever. They save money on office rent. Others, like some banks, want people back in offices because they think teamwork and creativity happen better face to face.

Hybrid work is now the most common solution. People go to the office 2-3 days a week for meetings and teamwork, and work from home the rest for focused tasks. Studies show hybrid teams are equally productive but report higher job satisfaction.

The office did not disappear, but its role changed from the only place to work to one of many options.`,questions:[{q:"How many Americans worked from home before 2020?",options:["5% full-time","28%","50%","100%"],correct:0,explain:"Only 5% before 2020."},{q:"What technology enabled remote work?",options:["High-speed internet, Zoom, Slack, Google Docs","Only phones","No technology","Only paper"],correct:0,explain:"High-speed internet, free video calls, tools."},{q:"How much commute time is saved on average?",options:["72 minutes per day","10 minutes","5 hours","No time saved"],correct:0,explain:"Save average 72 mins per day."},{q:"What is hybrid work?",options:["Office 2-3 days, home rest of week","Only home","Only office","No work"],correct:0,explain:"Office 2-3 days for meetings, home for focused tasks."},{q:"What did studies show about hybrid teams?",options:["Equally productive but higher satisfaction","Less productive","No satisfaction","Always unhappy"],correct:0,explain:"Equally productive but higher job satisfaction."}]},{id:13,title:"The Importance of Family Dinner",category:"Society",level:"B1",words:276,passage:`In 1950, 90% of American families ate dinner together every night. Today, that number is below 50%. Busy schedules, phones at the table, and different work times have made shared meals rare. Yet science says family dinners matter more than ever.

A large study in 2022 followed 2,000 children for five years. Kids who ate dinner with their families at least 4 times a week had higher grades, better mental health, and healthier diets. They ate 35% more vegetables and less fast food.

Why does a simple meal help so much? First, it creates routine. Children feel safe when they know dinner is at 7 PM with family. Second, it improves communication. Without TV, families actually talk. Parents learn about school problems early. Children learn to listen and tell stories.

Third, cooking together teaches life skills. A 10-year-old can wash vegetables or set the table. Teenagers can learn to cook simple dishes like fried rice or soup. These skills build confidence and independence.

You do not need fancy food. The research shows benefits come from being together, not what you eat. Even 20 minutes of simple rice and soup with phones put away is enough. Some families use a basket: everyone puts their phone in it during dinner.

In a fast world, sitting together for one meal can be the anchor that keeps a family close. It is a small daily investment with large long-term returns.`,questions:[{q:"How many families ate together in 1950 vs today?",options:["90% in 1950, below 50% today","50% in 1950, 90% today","100% both","0% both"],correct:0,explain:"90% in 1950, below 50% today."},{q:"What did the 2022 study find?",options:["Kids eating together 4x/week had higher grades and healthier diets","No difference","Worse grades","Only ate fast food"],correct:0,explain:"Higher grades, better mental health, healthier diets."},{q:"How does family dinner create safety?",options:["Routine at 7 PM makes children feel safe","No routine","Only expensive food","Only eating alone"],correct:0,explain:"Routine, safe when dinner at 7 PM."},{q:"What skill can a 10-year-old learn?",options:["Wash vegetables or set table","Drive car","No skills","Only eat"],correct:0,explain:"10-year-old can wash veg or set table."},{q:"What is suggested about phones?",options:["Put phones in basket during dinner","Use phones at table","No phones ever","Only parents put away"],correct:0,explain:"Basket for phones during dinner."}]},{id:14,title:"Why Young People Care About Climate",category:"Society",level:"B1",words:279,passage:`On August 20, 2018, a 15-year-old Swedish girl sat alone in front of parliament with a sign that said 'School Strike for Climate'. Her name was Greta Thunberg. Within one year, more than 6 million young people in 150 countries joined her Fridays for Future movement.

Why do young people lead this fight? One reason is personal. A person born in 2005 will live to see 2080. They will experience more floods, heatwaves, and food problems than their grandparents. Climate change is not a distant story for them; it is their future.

Social media amplifies their voice. A single video of melting ice or a protest can reach 10 million viewers in a day. Young activists use TikTok and Instagram to explain science in simple language and organize clean-up events. They trust peers more than politicians.

Schools also play a role. In many countries, climate topics are now part of the curriculum from primary school. Children learn about carbon footprint: how much CO2 is created by their food, clothes, and travel. A hamburger, for example, creates 3 kg of CO2.

Critics say young people should focus on studies, not protests. But supporters argue they learn more from organizing real campaigns than from textbooks alone. They practice public speaking, data analysis, and teamwork.

Whatever your view, youth climate activism has already changed policies. Several European cities banned cars in central areas after youth pressure. Their message is simple: they want to inherit a planet that is still livable.`,questions:[{q:"When did Greta Thunberg start her strike?",options:["Aug 20 2018 alone in front of parliament","2020","2015","2010"],correct:0,explain:"Aug 20 2018 sat alone."},{q:"How many joined within a year?",options:["6 million in 150 countries","600","60 thousand","600 million"],correct:0,explain:"6 million in 150 countries."},{q:"Why is climate personal for youth?",options:["They will live to 2080 and experience more problems","Not personal","Only grandparents care","They won't see future"],correct:0,explain:"Born 2005 will live to 2080, experience more problems."},{q:"How does social media help?",options:["Video can reach 10M viewers in a day","No help","Only TV helps","No one watches"],correct:0,explain:"Single video can reach 10M viewers."},{q:"What change resulted from youth pressure?",options:["European cities banned cars in central areas","No changes","More cars","Less activism"],correct:0,explain:"Several European cities banned cars after pressure."}]},{id:15,title:"How Social Media Affects Friendships",category:"Society",level:"B1",words:275,passage:`Liam has 1,200 friends on Instagram and feels lonely. This contradiction is common among teenagers today. A 2023 study of 500 teens aged 13-17 found that those with more than 1,000 online friends reported feeling lonelier than those with fewer than 200.

The difference between online and real friendship is important. Online friends often like your photos but do not help when you are sad or need to move house. Real friends require time and sometimes difficult conversations. A quick 'happy birthday' message is not the same as a 2-hour chat about your problems.

Social media can also create misunderstanding. When you read a message without seeing facial expressions or hearing tone, you might think your friend is angry when they are just busy. Many arguments start from a short text that was misread.

There are positive sides too. For shy teenagers or those living in small towns, online communities provide support. A teen who loves anime can find 1,000 people who share that interest. During COVID lockdowns, group video calls kept friendships alive when meeting was impossible.

Researchers suggest a healthy balance: use online tools to plan real meetings. Instead of just chatting online for 3 hours, use 10 minutes to arrange to meet at a park or cafe. Quality matters more than quantity. Five close friends you can call at midnight are more valuable than 1,000 likes.`,questions:[{q:"What did the study of 500 teens find?",options:["More than 1000 online friends felt lonelier","More friends less lonely","No relation","Only adults lonely"],correct:0,explain:"More than 1000 online friends felt lonelier than <200."},{q:"What is difference between online and real friends?",options:["Online like photos but not help when sad; real requires time","Same","Online better","Real worse"],correct:0,explain:"Online like photos but not help; real requires time."},{q:"Why can messages cause arguments?",options:["Without facial expressions tone misread","Always clear","Never cause arguments","Only long messages cause"],correct:0,explain:"Without expressions or tone, misread."},{q:"What is a positive side?",options:["Shy teens find support and shared interests","No positives","Only loneliness","Only fights"],correct:0,explain:"Shy teens find support, anime interest."},{q:"What do researchers suggest?",options:["Use online to plan real meetings, quality over quantity","Only online chat","Never meet real","1000 likes better than 5 friends"],correct:0,explain:"Use 10 mins to arrange park meeting, 5 close friends more valuable."}]},{id:16,title:"What Makes Denmark Happy",category:"Society",level:"B1",words:281,passage:`For 8 years in a row, Denmark has been ranked among the top 3 happiest countries in the world. It is not because of weather; winters are dark and cold. The secret is a concept called 'hygge' and high social trust.

Hygge, pronounced hoo-ga, means creating a warm, comfortable atmosphere with people you love. It can be lighting candles on a rainy evening, drinking hot chocolate with family, or wearing soft socks while reading. Danes spend more time at home with close friends than going to big parties. This focus on small, cozy moments reduces stress.

Trust is the second factor. In Denmark, 74% of people say they trust strangers, compared to 30% in many other countries. Parents leave baby strollers outside cafes while they drink coffee inside. People return lost wallets with money inside. High trust means less anxiety in daily life.

The welfare system supports this. Education is free, healthcare is free, and if you lose your job, the government pays 90% of your previous salary for up to 2 years. This safety net means Danes do not worry constantly about money.

Work-life balance is also protected. Most Danes work 37 hours per week and have 5 weeks of paid holiday plus extra time for parents. Overtime is uncommon. Leaving work at 4 PM to pick up children is normal, not seen as lazy.

Happiness in Denmark is not about being cheerful all the time. It is about feeling safe, trusted, and having time for cozy moments with people you care about.`,questions:[{q:"How long has Denmark been top 3 happiest?",options:["8 years in a row","1 year","Never","20 years"],correct:0,explain:"8 years in a row top 3."},{q:"What does hygge mean?",options:["Warm comfortable atmosphere with loved ones","Big parties","Cold weather","Expensive clothes"],correct:0,explain:"Creating warm comfortable atmosphere."},{q:"What percentage of Danes trust strangers?",options:["74% vs 30% elsewhere","10%","100%","0%"],correct:0,explain:"74% trust strangers."},{q:"What does welfare system provide?",options:["Free education, healthcare, 90% salary if job lost","No support","Only for rich","Only healthcare"],correct:0,explain:"Free education, healthcare, 90% salary 2 years."},{q:"How many hours do Danes work per week?",options:["37 hours plus 5 weeks holiday","60 hours","20 hours","80 hours"],correct:0,explain:"37 hours per week and 5 weeks paid holiday."}]},{id:17,title:"What is Inflation?",category:"Economy",level:"B1",words:273,passage:`In 2020, a loaf of bread in Bangkok cost 30 baht. In 2023, the same bread cost 40 baht. That price increase is called inflation. It means your money buys less than before.

Inflation happens for several reasons. One reason is higher costs. If petrol prices go up, transporting bread from factory to shop costs more, so shops raise bread prices. Another reason is high demand. When many people want to buy the same house, sellers can increase the price.

A little inflation, around 2% per year, is normal and even healthy. It shows the economy is growing. People spend money instead of waiting because they know prices will slowly rise. Companies can plan to increase salaries.

High inflation is a problem. In Turkey, inflation reached 85% in 2022. That means something that cost 100 lira in January cost 185 lira in December of the same year. People's salaries did not double, so they could buy much less. Savings in banks lost value.

Governments try to control inflation by raising interest rates. When banks charge higher interest for loans, people borrow less and spend less. Less spending means sellers cannot raise prices easily. Central banks in the US and Europe raised rates in 2023 to fight inflation.

For regular people, simple steps help: save some money, learn to compare prices, and avoid debt with high interest. Understanding inflation helps you plan your personal budget better.`,questions:[{q:"What is the bread example?",options:["30 baht 2020 to 40 baht 2023 = inflation","Price went down","Bread free","Same price"],correct:0,explain:"Price increase is inflation."},{q:"What is one cause of inflation?",options:["Higher petrol raises transport cost so bread price up","Lower costs","No demand","No reason"],correct:0,explain:"Higher costs like petrol raise prices."},{q:"What is considered healthy inflation?",options:["Around 2% per year","85%","0%","100%"],correct:0,explain:"2% per year normal and healthy."},{q:"What happened in Turkey 2022?",options:["Inflation reached 85%","No inflation","2% inflation","Prices fell"],correct:0,explain:"Inflation reached 85%."},{q:"How do governments control inflation?",options:["Raising interest rates so people borrow/spend less","Lowering rates","Printing more money","No action"],correct:0,explain:"Raise interest rates."}]},{id:18,title:"How Online Stores Like Shein Sell Cheap",category:"Economy",level:"B1",words:284,passage:`A dress on Shein costs $8, while a similar dress in a shopping mall costs $50. How can online fast fashion be so cheap? The answer is a completely different business model.

Traditional fashion brands design clothes 6 months in advance, produce large quantities, and ship to stores worldwide. If designs do not sell, they must discount them heavily. Shein does the opposite. It uses AI to watch what people search for on TikTok and Instagram. If many people search for 'green cargo pants', Shein designs 10 versions in 3 days.

Instead of making 10,000 pieces, Shein makes only 100 pieces of each design. It puts them online and sees what sells. Popular items get more production; unpopular items disappear. This test-and-repeat system reduces waste and risk.

Labor costs are also lower. Most Shein clothes are made in factories in Guangzhou, China, where workers sew quickly. Factories have fewer safety checks and lower wages than factories in Europe. Materials are thin and cheap, which lowers cost but also quality.

There are hidden costs. Cheap clothes often break after 3-4 washes, so customers buy more. Environmental costs are high: fast fashion creates 92 million tons of waste yearly. Workers work long hours.

Consumers save money short-term but should think about long-term value. A $50 dress that lasts 3 years is cheaper than five $8 dresses that last 3 months each.`,questions:[{q:"What price difference is mentioned?",options:["Shein $8 vs mall $50","Same price","Shein more expensive","$100 vs $8"],correct:0,explain:"Dress $8 vs mall $50."},{q:"How does Shein design quickly?",options:["AI watches TikTok/Instagram searches, designs in 3 days","6 months advance","Random","No design"],correct:0,explain:"AI watches searches, designs 10 versions in 3 days."},{q:"How many pieces does Shein initially make?",options:["Only 100 pieces to test","10,000","1 million","0"],correct:0,explain:"Makes only 100 pieces to test."},{q:"What about labor?",options:["Factories in Guangzhou, lower wages, fewer safety checks","High wages","No workers","Only robots"],correct:0,explain:"Lower wages, fewer safety checks."},{q:"What is hidden cost?",options:["Clothes break after 3-4 washes, environmental waste","Last forever","No waste","Higher quality"],correct:0,explain:"Break after 3-4 washes, 92M tons waste."}]},{id:19,title:"Why Some People Love Cryptocurrency",category:"Economy",level:"B1",words:280,passage:`In 2009, a mysterious person named Satoshi Nakamoto created Bitcoin. At that time, 1 Bitcoin was worth less than $1. In November 2021, it reached $69,000. Even now, prices go up and down by thousands of dollars in one day.

People are attracted to crypto for different reasons. Some believe in the idea behind it: no bank or government controls it. You can send money to anyone in the world in 10 minutes without permission from a bank. For people in countries with unstable currencies, this feels safer than local money.

Others see it as an investment, like buying stocks. They hope prices will rise and they can sell for profit. In 2020-2021, many young investors made quick profits and posted them online. This attracted more buyers.

Risks are huge. Unlike a bank account, if you lose your crypto password, no one can help you recover it. Hackers stole $3.8 billion in crypto in 2022 alone. Governments may also ban it. China banned all crypto transactions in 2021.

Experts advise treating crypto like gambling money: only use money you can afford to lose completely. Do not borrow money to buy crypto. Learn about blockchain technology first, which is the system that records all transactions.

Whether crypto is the future of money or just a trend is still unclear. What is clear is that it is high risk and requires careful research.`,questions:[{q:"When was Bitcoin created and by whom?",options:["2009 by Satoshi Nakamoto","2021","2000 by bank","2010 by government"],correct:0,explain:"2009 by mysterious Satoshi Nakamoto."},{q:"What was Bitcoin's peak price mentioned?",options:["$69,000 Nov 2021","Less than $1","$100","$69"],correct:0,explain:"Reached $69k Nov 2021."},{q:"Why do some people like crypto idea?",options:["No bank/government controls, send money without permission","Bank controls it","Government controls","Slower than bank"],correct:0,explain:"No bank/government controls, send in 10 mins."},{q:"What risk is mentioned about passwords?",options:["If you lose password no one can help recover","Easy recovery","Bank helps","No risk"],correct:0,explain:"If lose password no one can help."},{q:"What do experts advise?",options:["Only use money you can afford to lose","Borrow to buy","Use all savings","No research needed"],correct:0,explain:"Only use money you can afford to lose."}]},{id:20,title:"How Gig Economy Works",category:"Economy",level:"B1",words:276,passage:`Somchai drives a Grab car in the morning, delivers food for Foodpanda at lunch, and walks dogs through an app in the evening. He is part of the gig economy, where people do short-term jobs instead of one full-time job. In 2023, 36% of US workers did some gig work.

Apps make gig work possible. A customer opens an app, requests a ride or delivery, and the system finds the nearest available worker. Payment is automatic, and both sides can rate each other. This flexibility is the main attraction. You can work when you want, stop when you want, and be your own boss.

For many, gig work provides extra income. A university student can drive 3 hours after classes. A mother can deliver food while her child is at school. During COVID, when many lost office jobs, gig apps provided quick employment.

There are serious downsides. Gig workers are usually not employees, so they get no health insurance, paid holiday, or retirement fund. If their motorbike breaks or they get sick, they earn nothing. Income is unstable: one week you earn $500, next week $200.

Governments are debating how to protect gig workers without destroying flexibility. Some cities now require apps to pay minimum wage and provide accident insurance. Workers are forming groups to negotiate better conditions.

Gig economy offers freedom but also insecurity. Understanding both sides helps workers make informed choices about this new way of working.`,questions:[{q:"Who is Somchai example?",options:["Drives Grab morning, Foodpanda lunch, dog walking evening = gig economy","Full-time office worker","No job","Only one job"],correct:0,explain:"Does short-term jobs instead of one full-time."},{q:"What percentage of US workers did gig work 2023?",options:["36%","5%","100%","0%"],correct:0,explain:"36% of US workers did some gig work."},{q:"What is main attraction?",options:["Flexibility, work when you want","Fixed schedule","No payment","Boss controls"],correct:0,explain:"Flexibility main attraction."},{q:"What is a downside?",options:["No health insurance, paid holiday, unstable income","Free insurance","Stable income","Too much holiday"],correct:0,explain:"Not employees, no insurance, unstable."},{q:"What are governments debating?",options:["How to protect workers without destroying flexibility","Ban all apps","No debate","Only more flexibility"],correct:0,explain:"Debating how to protect without destroying flexibility."}]},{id:21,title:"Why Financial Education is Important",category:"Economy",level:"B1",words:282,passage:`In Finland, children start learning about money at age 7. They play shop games, learn to save 10% of pocket money, and discuss the difference between needs and wants. By age 15, Finnish teenagers score highest in financial literacy tests worldwide.

Many adults lack these skills. A 2023 survey in Thailand found that 68% of adults could not explain compound interest, which is interest that earns more interest over time. Without this knowledge, people make expensive mistakes like using credit cards for everyday purchases and paying 20% interest.

Financial education teaches three basic habits. First, budgeting: writing down income and expenses every month. If you earn $1,000 and spend $1,200, you have a problem. A simple app or notebook helps you see where money goes.

Second, saving before spending. The 50-30-20 rule is popular: 50% of income for needs like rent and food, 30% for wants like movies, and 20% for savings and debt repayment. Paying yourself first builds a safety net.

Third, understanding risk. All investments have some risk. If someone promises 10% profit every month with no risk, it is likely a scam. Learning to check facts and compare options protects you from fraud.

Schools are slowly adding these topics, but you can start now. Read one article about money each week and practice with small amounts. Good financial habits early can prevent big stress later in life.`,questions:[{q:"When do Finnish children start learning about money?",options:["Age 7 with shop games and saving 10%","Age 15","Never","Age 20"],correct:0,explain:"Start at age 7."},{q:"What did Thai survey 2023 find?",options:["68% could not explain compound interest","Everyone explained","No survey","Only children lack skills"],correct:0,explain:"68% could not explain compound interest."},{q:"What is first habit taught?",options:["Budgeting: writing income and expenses","Spending more","No budgeting","Only saving"],correct:0,explain:"First is budgeting."},{q:"What is 50-30-20 rule?",options:["50% needs, 30% wants, 20% savings","50% wants","100% savings","No rule"],correct:0,explain:"50% needs, 30% wants, 20% savings."},{q:"How to spot scam?",options:["Promises 10% profit monthly with no risk likely scam","High risk is scam","No profit is scam","All investments no risk"],correct:0,explain:"Promises 10% profit no risk likely scam."}]},{id:22,title:"What is Minimum Wage?",category:"Economy",level:"B1",words:274,passage:`In the United States, the federal minimum wage is $7.25 per hour. It has not changed since 2009. If you work 40 hours a week at this rate, you earn $290 per week before tax. In cities like New York, that is not enough to pay rent.

Supporters of raising minimum wage to $15 per hour say it reduces poverty. A full-time worker would earn $600 per week, which allows a more decent life. They argue that if companies like McDonald's make billions in profit, they can pay workers more. Higher wages also mean workers spend more in local shops, helping the economy.

Opponents worry that higher minimum wages force small businesses to cut jobs. A small restaurant with 10 employees might need to fire 2 workers or raise menu prices by 20% to cover higher wage costs. Some studies show that after minimum wage increases, fewer teenagers get first jobs.

Many states have set their own higher minimum wages. California's minimum is $16.50, and Washington's is $16.28. Other countries have different systems. In Australia, minimum wage is about $15 US per hour, but cost of living is also high.

The debate is complex because both sides have valid points. Most economists agree that moderate increases help workers without major job losses, but very large sudden increases can hurt small businesses. Finding balance requires looking at local costs and business conditions, not just one national number.`,questions:[{q:"What is US federal minimum wage?",options:["$7.25 per hour since 2009","$15","$16.50","$20"],correct:0,explain:"$7.25 since 2009."},{q:"How much would $15 wage give weekly full-time?",options:["$600 per week","$290","$100","$1000"],correct:0,explain:"40h x $15 = $600."},{q:"What do supporters say?",options:["Reduces poverty and workers spend more locally","Cuts jobs","No benefits","Hurts economy"],correct:0,explain:"Reduces poverty, spend more."},{q:"What do opponents worry?",options:["Small businesses cut jobs or raise prices 20%","No worries","More jobs","Lower prices"],correct:0,explain:"Small businesses cut jobs or raise prices."},{q:"What is California minimum?",options:["$16.50","$7.25","$15","$10"],correct:0,explain:"California $16.50."}]},{id:23,title:"How Small Businesses Started During COVID",category:"Economy",level:"B1",words:279,passage:`When COVID-19 forced shops to close in March 2020, many people thought it would be the end of small businesses. Instead, something surprising happened. In the US alone, 4.4 million new businesses were registered in 2020, the highest number ever recorded.

People had time and needs. A chef who lost his restaurant job started cooking curry from home and selling via Instagram. A mother who needed masks for her kids learned to sew them and soon received 200 orders per week. Low startup costs online made trying new ideas less risky.

Digital tools helped enormously. Free tools like Canva allowed anyone to design a logo in 30 minutes. Facebook Marketplace and Line MyShop let sellers create an online store in one day with no programming. Delivery apps solved the problem of reaching customers without a physical shop.

Not all survived. About 30% of new businesses closed within two years because competition was fierce and profit margins were small. Those who survived had two things in common: they listened to customer feedback quickly and kept costs very low at the start.

Governments also provided support. In Thailand, the government offered soft loans of up to 1 million baht with low interest for small online businesses. Many banks simplified account opening to encourage entrepreneurs.

The pandemic was painful, but it also showed that with creativity and internet access, ordinary people can start a business from their kitchen table.`,questions:[{q:"How many new US businesses in 2020?",options:["4.4 million highest ever","440 thousand","44 million","No new businesses"],correct:0,explain:"4.4M highest ever."},{q:"Why did people start businesses during COVID?",options:["Had time and needs, low startup costs online","No reason","Only rich started","Forced by government"],correct:0,explain:"Had time and needs, low costs."},{q:"What digital tool helped with logos?",options:["Canva design logo in 30 mins","No tools","Only expensive designers","Photoshop only"],correct:0,explain:"Canva allowed design logo in 30 mins."},{q:"What percentage closed within 2 years?",options:["About 30% closed","0%","100%","70% survived meaning 30% closed"],correct:0,explain:"About 30% closed within 2 years."},{q:"What government support in Thailand?",options:["Soft loans up to 1M baht low interest","No support","Only for big companies","Ban on business"],correct:0,explain:"Soft loans up to 1M baht low interest."}]},{id:24,title:"What is Democracy?",category:"Politics",level:"B1",words:277,passage:`The word democracy comes from Greek 'demos' meaning people and 'kratos' meaning power. Simply put, it means power belongs to the people. Citizens choose their leaders through voting and have freedom to express opinions.

New Zealand is often cited as a strong example. It was the first country to give women the right to vote in 1893. Today, voter turnout is high, corruption is low, and people trust courts to be fair. Citizens can protest peacefully without fear of arrest.

Democracy has key features. First, free and fair elections: every adult citizen gets one vote, and votes are counted honestly. Second, rule of law: even the president must follow the law. Third, freedom of speech and press: journalists can criticize the government without going to prison.

It is not perfect. Decisions can be slow because many opinions must be heard. Sometimes voters choose leaders who make poor choices. Winston Churchill famously said, 'Democracy is the worst form of government except for all the others.'

Different countries practice democracy differently. Some have presidents, some have prime ministers. Some have many parties, some have two main parties. But the core idea remains: governments should serve the people, not the other way around. Education helps democracy work better because informed voters make better choices.`,questions:[{q:"What does democracy mean in Greek?",options:["People power","One ruler","No power","Rich power"],correct:0,explain:"Demos people, kratos power."},{q:"Which country first gave women vote?",options:["New Zealand 1893","US","Thailand","Greece"],correct:0,explain:"First to give women right to vote 1893."},{q:"What are key features?",options:["Free fair elections, rule of law, freedom of speech","Only elections","No law","No speech"],correct:0,explain:"Free elections, rule of law, freedom speech press."},{q:"What did Churchill say?",options:["Democracy worst except all others","Democracy best","No democracy","Only monarchy"],correct:0,explain:"Worst form except all others."},{q:"What helps democracy work better?",options:["Education and informed voters","No education","Only voting","Only protest"],correct:0,explain:"Education helps, informed voters make better choices."}]},{id:25,title:"Why Voting is Important",category:"Politics",level:"B1",words:281,passage:`In the US presidential election of 2020, 66% of eligible voters voted. That was the highest rate in 100 years. Usually, only about 55% vote. Many people ask, does my single vote really matter?

History shows it does. In 2017, a Virginia state election ended in a tie: 11,608 votes for each candidate. The winner was chosen by drawing a name from a bowl. One more voter could have changed the result.

Voting affects daily life more than you think. Local governments decide school budgets, road repairs, and hospital funding. National governments decide taxes, climate policy, and healthcare. If you do not vote, others decide these issues for you.

Young people voting can change outcomes. In 2020, 50% of US citizens aged 18-29 voted, up from 43% in 2016. Politicians pay more attention to groups that vote. If young people vote more, parties will address student debt, climate, and housing.

Some countries make voting easier. Australia fines citizens $20 if they do not vote, resulting in 92% turnout. Others have voting on weekends or allow mail voting. The US is expanding early voting to increase participation.

Even if your favorite candidate loses, voting shows you care about your community. It is a habit that builds over time. The first time may feel small, but collective action of millions creates change. Democracy needs participation to stay healthy.`,questions:[{q:"What was voter turnout US 2020?",options:["66% highest in 100 years","55%","90%","30%"],correct:0,explain:"66% highest in 100 years."},{q:"What happened in Virginia 2017?",options:["Tie 11,608 each, winner by drawing bowl","Landslide","No election","One candidate won big"],correct:0,explain:"Tie, winner chosen by drawing name from bowl."},{q:"What do local governments decide?",options:["School budgets, road repairs, hospital funding","Only national issues","Nothing","Only taxes"],correct:0,explain:"School budgets, road repairs, hospital funding."},{q:"What about youth voting 2020 vs 2016?",options:["50% vs 43% in 2016 increased","Decreased","Same","0%"],correct:0,explain:"50% in 2020 up from 43% 2016."},{q:"What does Australia do?",options:["Fines $20 if not vote, 92% turnout","No voting","Bans voting","Only weekend"],correct:0,explain:"Fines $20, 92% turnout."}]},{id:26,title:"How Young People Change Politics",category:"Politics",level:"B1",words:279,passage:`In 2023, over 1 million young people marched in Seoul demanding action on housing prices. They organized entirely through TikTok and Discord, without any political party. This is the new face of youth politics.

Traditionally, young people voted less than older people. That is changing. In many democracies, voter turnout among 18-24 year olds increased by 15% between 2015 and 2023. They care about issues that directly affect their future: climate, affordable housing, student loans, and mental health support.

Social media gives them tools older generations did not have. A 19-year-old can make a 60-second video explaining a new law and get 500,000 views overnight. Petitions on Change.org can collect 1 million signatures in 3 days. This speed forces politicians to respond quickly.

Youth movements also use humor and creativity. Instead of long speeches, they create memes, songs, and art. During climate protests in Berlin, students built a giant wooden horse with a sign 'Don't be Trojan horse for oil companies'. Images spread faster than press releases.

Political parties are noticing. In New Zealand and Austria, voting age is now 16 for some elections. Parties hire young staff who understand online culture. Whether these changes lead to better policies depends on whether young energy turns into long-term engagement beyond one viral campaign.

The message is clear: young people are not apathetic; they just participate differently.`,questions:[{q:"What happened in Seoul 2023?",options:["1M young marched demanding action on housing via TikTok Discord","No march","Only older marched","Small march"],correct:0,explain:"Over 1M marched in Seoul demanding housing action."},{q:"How much did youth turnout increase?",options:["15% between 2015-2023","0%","Decreased","100%"],correct:0,explain:"Increased by 15%."},{q:"What issues do youth care about?",options:["Climate, housing, student loans, mental health","Only games","Only music","No issues"],correct:0,explain:"Climate, affordable housing, student loans, mental health."},{q:"What tool gives them speed?",options:["60-sec video can get 500k views overnight, petitions fast","No tools","Only TV","Only newspapers"],correct:0,explain:"19-year-old video 500k views overnight."},{q:"What voting age in NZ and Austria?",options:["16 for some elections","18 always","21","25"],correct:0,explain:"Voting age now 16 for some elections."}]},{id:27,title:"What is Climate Agreement?",category:"Politics",level:"B1",words:283,passage:`In December 2015, representatives from 196 countries met in Paris and agreed on something historic. For the first time, almost every country promised to limit global warming. This is called the Paris Climate Agreement.

The main goal is to keep temperature rise below 2 degrees Celsius compared to pre-industrial times, and try to stay below 1.5 degrees. Why 1.5? Scientists say beyond 1.5 degrees, coral reefs die, sea levels rise much faster, and extreme weather becomes more common.

Each country sets its own plan, called NDC. For example, the EU promised to cut emissions by 55% by 2030 compared to 1990. Thailand promised to be carbon neutral by 2050. Rich countries also promised $100 billion per year to help poor countries switch to clean energy.

Progress has been slow. Global temperatures already rose by 1.2 degrees by 2023. Many countries are not meeting their targets because changing energy systems is expensive and politically difficult. Coal plants still provide 35% of world electricity.

Every year, countries meet again at COP conferences to check progress. COP28 in Dubai in 2023 included 97,000 participants. Activists say meetings have too many fossil fuel lobbyists and too little action.

Despite criticism, the agreement matters because it creates a common direction. Without it, warming could reach 4-5 degrees, which would be catastrophic. With it, we still have a chance to limit damage if countries act faster.`,questions:[{q:"When and where was Paris Agreement?",options:["Dec 2015, 196 countries","2010","2020","2005"],correct:0,explain:"Dec 2015, 196 countries."},{q:"What is main temperature goal?",options:["Below 2 degrees, try 1.5","Below 10 degrees","No goal","Below 0"],correct:0,explain:"Keep below 2, try below 1.5."},{q:"Why is 1.5 degrees important?",options:["Beyond it coral die, sea rises faster","No importance","Only small change","Only affects one country"],correct:0,explain:"Beyond 1.5 coral reefs die, sea levels rise faster."},{q:"How much had temperature risen by 2023?",options:["1.2 degrees","0.1","5 degrees","No rise"],correct:0,explain:"Already rose by 1.2 degrees by 2023."},{q:"What is COP?",options:["Yearly meetings to check progress","A company","A city","No meaning"],correct:0,explain:"Countries meet again at COP conferences to check progress."}]},{id:28,title:"How Switzerland Votes Often",category:"Politics",level:"B1",words:275,passage:`In most democracies, people vote once every 2-4 years. In Switzerland, citizens vote about 4 times a year, sometimes on 5 different issues in one day. This is called direct democracy.

How does it work? If 50,000 citizens sign a petition, they can force a national vote on any law. If 100,000 sign, they can propose a new amendment to the constitution. The government must organize a referendum within 18 months.

Recent votes show how diverse topics are. In 2021, Swiss voted on whether to ban facial coverings like burqa. In 2022, they voted on increasing retirement age from 65 to 66. In 2023, they voted on a law to make Switzerland carbon neutral by 2050. Turnout is usually 40-50%, lower than general elections but still significant.

This frequent voting has effects. Citizens feel more responsible and informed. They cannot blame politicians alone because they themselves approved the laws. It also makes radical changes difficult because voters tend to be cautious. Big reforms need to convince a majority.

Critics say average citizens do not have enough time or knowledge to decide complex issues like trade agreements or pension systems. Information pamphlets are sent to every household, but many people do not read them carefully.

Despite debate, most Swiss like the system. It gives them a direct voice and prevents power from concentrating in few hands. It is a slow but stable way to govern a country with four languages and different cultures.`,questions:[{q:"How often do Swiss vote?",options:["About 4 times a year, sometimes 5 issues in one day","Once every 4 years","Never","Daily"],correct:0,explain:"Vote about 4 times a year."},{q:"How many signatures to force vote on law?",options:["50,000 citizens","100,000","1,000","1 million"],correct:0,explain:"50k can force national vote."},{q:"How many to propose new constitution amendment?",options:["100,000 signatures","50,000","10,000","1 million"],correct:0,explain:"100k can propose new amendment."},{q:"What was a recent vote topic 2023?",options:["Make Switzerland carbon neutral by 2050","No votes","Only burqa ban","Only retirement"],correct:0,explain:"2023 vote on carbon neutral by 2050."},{q:"What is one effect of frequent voting?",options:["Citizens feel more responsible, cannot blame only politicians","Less responsibility","No effect","More radical changes"],correct:0,explain:"Citizens feel more responsible, cannot blame politicians alone."}]},{id:29,title:"What is Fake News?",category:"Politics",level:"B1",words:278,passage:`During the US election in 2016, a story spread that the Pope endorsed Donald Trump. It was completely false, but it was shared 1 million times on Facebook. This is an example of fake news: false information created to look like real news.

Fake news spreads faster than true news. A study by MIT in 2018 found that false stories on Twitter reached 1,500 people 6 times faster than true stories. Why? False stories are often more surprising or emotional, so people share them without checking.

There are different types. Some is clickbait: headlines like 'You won't believe what this actor did!' to get clicks for advertising money. Some is propaganda: governments or parties create false stories to make opponents look bad. Some is satire that people mistake for real news.

How can you spot it? Experts suggest four checks. First, look at the source: is it a known newspaper or an unknown website with many ads? Second, read beyond headline; headline may be misleading. Third, check date; old stories are sometimes reshared as new. Fourth, search other sources: if only one site reports it, it is suspicious.

Media literacy classes are now taught in Finland and Sweden from age 10. Students practice checking facts before sharing. Learning to pause before sharing can reduce spread of false information.

In a democracy, accurate information is essential for good decisions. Being a careful reader is part of being a good citizen.`,questions:[{q:"What false story spread in 2016?",options:["Pope endorsed Trump, shared 1M times","True story","No story","Only true news"],correct:0,explain:"Pope endorsed Trump false, shared 1M times."},{q:"What did MIT 2018 study find?",options:["False stories reached 1500 people 6x faster than true","True faster","Same speed","No study"],correct:0,explain:"False stories 6 times faster than true."},{q:"What is clickbait?",options:["Headlines to get clicks for ad money","True news","No ads","Only government news"],correct:0,explain:"Headlines like you won't believe to get clicks for advertising."},{q:"What is first check to spot fake news?",options:["Look at source: known newspaper or unknown site","Ignore source","Only read headline","Share immediately"],correct:0,explain:"Look at source."},{q:"Where is media literacy taught from age 10?",options:["Finland and Sweden","No where","Only US","Only Thailand"],correct:0,explain:"Finland and Sweden from age 10."}]},{id:30,title:"How Estonia Votes Online",category:"Politics",level:"B1",words:280,passage:`In most countries, voting means going to a school building, standing in line, and marking paper. In Estonia, you can vote from your sofa using your laptop. Estonia has allowed online voting since 2005, the first country in the world to do so.

The system uses a national ID card with a chip. Every citizen gets one. You insert the card into a reader, enter two PIN codes, and choose your candidate. The vote is encrypted and sent securely. You can even change your online vote later by voting again; only the last vote counts.

In the 2023 parliamentary election, 51% of voters voted online. That is more than half. Young people and people living abroad find it especially convenient. Estonians living in London or Bangkok can vote without flying home.

Security is the main concern. Critics worry hackers could manipulate results. Estonia uses several protections: blockchain-like logs, independent audits, and the option to verify your vote with a smartphone app. So far, no major fraud has been proven in 18 years.

Other countries watch Estonia closely. Some Swiss cantons and Canadian cities tested similar systems, but most governments are cautious because trust in elections is essential. One mistake could damage democracy.

Estonia also uses digital ID for taxes, health records, and business registration. 99% of public services are online. For Estonians, internet voting is not futuristic; it is normal life. It shows how small countries can lead in digital innovation.`,questions:[{q:"When did Estonia start online voting?",options:["Since 2005 first country","2023","2010","2000"],correct:0,explain:"Since 2005 first country."},{q:"What is used for online voting?",options:["National ID card with chip and two PIN codes","No ID needed","Only phone","Paper only"],correct:0,explain:"National ID card with chip, two PIN codes."},{q:"What percentage voted online 2023?",options:["51% more than half","10%","5%","100%"],correct:0,explain:"51% voted online."},{q:"Can you change online vote?",options:["Yes, only last vote counts","No","Only once","Never"],correct:0,explain:"Can change, only last vote counts."},{q:"What other services are online in Estonia?",options:["99% public services like taxes, health, business","None","Only voting","Only taxes"],correct:0,explain:"99% public services online."}]},{id:31,title:"How Penicillin Was Found",category:"History",level:"B1",words:276,passage:`In September 1928, Scottish scientist Alexander Fleming returned from a two-week holiday to his messy lab in London. He noticed something strange in a dish where he had been growing bacteria. Blue-green mold had grown, and around the mold, bacteria had disappeared.

Most people would have thrown the dish away. Fleming was curious. He realized the mold was producing something that killed bacteria. He named it penicillin after the mold Penicillium notatum. At first, he could not produce enough to be useful.

Ten years later, in 1938, two other scientists at Oxford University, Howard Florey and Ernst Chain, read Fleming's paper and figured out how to mass-produce penicillin. By 1941, they had enough to treat a policeman who was dying from a scratch infection. The treatment worked miraculously.

During World War II, penicillin saved millions of lives. Before it, a small cut could lead to death from infection. Soldiers who would have died from wounds survived. Production increased from 400 million units in early 1943 to 650 billion units by September 1943.

Fleming, Florey, and Chain shared the Nobel Prize in 1945. Fleming warned early about antibiotic resistance: if we use too little or stop too early, bacteria learn to resist. Today, his warning is important as some bacteria no longer respond to penicillin.

A messy lab and a curious mind changed medicine forever.`,questions:[{q:"What did Fleming notice in 1928?",options:["Blue-green mold killed bacteria around it","Bacteria grew well","No mold","Lab was clean"],correct:0,explain:"Mold around which bacteria disappeared."},{q:"What did he name it?",options:["Penicillin after Penicillium notatum","Mold","Bacteria","No name"],correct:0,explain:"Named penicillin after mold."},{q:"Who mass-produced it?",options:["Howard Florey and Ernst Chain at Oxford 1938","Fleming alone","No one","Soldiers"],correct:0,explain:"Florey and Chain figured out mass-produce."},{q:"How did production increase in WWII?",options:["From 400M units early 1943 to 650B by Sept 1943","Decreased","Same","No production"],correct:0,explain:"From 400M to 650B units."},{q:"What warning did Fleming give?",options:["Bacteria can learn to resist if we use too little","No warning","Penicillin has no resistance","Stop using"],correct:0,explain:"Warned about antibiotic resistance."}]},{id:32,title:"Why Roman Buildings Still Stand",category:"History",level:"B1",words:279,passage:`The Pantheon in Rome was built in 126 AD. Almost 2,000 years later, its dome is still the world's largest unreinforced concrete dome. Tourists walk inside and wonder why modern buildings sometimes crack after 20 years but Roman buildings last millennia.

The secret is in their concrete recipe. Modern concrete uses cement, water, sand, and steel bars for strength. Roman concrete used volcanic ash from Mount Vesuvius, lime, and seawater. When seawater touches this mix, a chemical reaction creates crystals that actually make concrete stronger over time, not weaker.

Researchers at MIT and Harvard studied Roman concrete in 2023 and found another clever feature. The Romans added small lime chunks that could self-heal cracks. When water entered a small crack, lime dissolved and filled the gap, like how our skin heals a small cut.

Romans also built with purpose. They used heavy concrete for foundations and lighter pumice stone for upper walls. They understood weight distribution without computers. Aqueducts that carried water 50 kilometers still stand because arches spread weight efficiently.

Not everything lasted. Many Roman buildings fell due to earthquakes or were taken apart for materials. But those built with best techniques survived.

Modern engineers are now copying Roman recipes to create more sustainable concrete that lasts longer and produces less CO2. Sometimes ancient knowledge is more advanced than we think.`,questions:[{q:"When was Pantheon built?",options:["126 AD almost 2000 years ago","2023","1900","1000 AD"],correct:0,explain:"Built 126 AD."},{q:"What is special about its dome?",options:["Largest unreinforced concrete dome still","Smallest","Wooden","Steel"],correct:0,explain:"Largest unreinforced concrete dome."},{q:"What made Roman concrete stronger over time?",options:["Volcanic ash + seawater creates crystals","Steel bars","Only water","No secret"],correct:0,explain:"Volcanic ash, lime, seawater reaction makes stronger."},{q:"How did Roman concrete self-heal?",options:["Lime chunks dissolve and fill cracks when water enters","Cannot self-heal","Workers repair daily","Magic"],correct:0,explain:"Lime chunks self-heal cracks."},{q:"What are modern engineers doing now?",options:["Copying Roman recipes for sustainable longer-lasting concrete","Ignoring it","Destroying Roman buildings","Only using steel"],correct:0,explain:"Copying Roman recipes to create sustainable concrete."}]},{id:33,title:"Women Who Helped Go to Moon",category:"History",level:"B1",words:283,passage:`When Neil Armstrong walked on the Moon in 1969, millions watched on TV. Few knew that calculations behind the mission were done by women, many of them Black women who faced discrimination.

Katherine Johnson was one of them. Born in 1918 in West Virginia, she was brilliant at math. At a time when Black students could not attend white universities easily, she finished college at 18. In 1953, she joined NASA as a 'computer' – a person who does calculations by hand.

Her work was critical. She calculated the trajectory for Alan Shepard's first American flight into space in 1961. For John Glenn's orbit in 1962, astronauts did not trust electronic computers yet. Glenn said, 'Get the girl to check the numbers.' Johnson did, and the numbers matched.

Other women also contributed. Dorothy Vaughan learned the new IBM computer language FORTRAN and taught her team. Mary Jackson became NASA's first Black female engineer. Margaret Hamilton led the team that wrote software for Apollo. Her code prevented a crash during Moon landing when computers were overloaded.

These women worked long hours for less pay than men and often without recognition. In 2016, the film 'Hidden Figures' finally told their story to the world. Johnson received Presidential Medal of Freedom in 2015.
