Their story shows that space success was not just about astronauts. It required thousands of skilled people on Earth, including women whose talent overcame barriers.`,questions:[{q:"Who did calculations for Moon mission?",options:["Women including Black women like Katherine Johnson","Only Neil Armstrong","Only men","No one"],correct:0,explain:"Calculations done by women many Black women."},{q:"When was Katherine Johnson born?",options:["1918 in West Virginia, college at 18","1969","1953","2000"],correct:0,explain:"Born 1918, college at 18."},{q:"What did John Glenn say in 1962?",options:["Get the girl to check numbers","Trust computer only","No check needed","Ask someone else"],correct:0,explain:"Get the girl to check numbers."},{q:"What did Margaret Hamilton do?",options:["Led team that wrote Apollo software, prevented crash","Was astronaut","No contribution","Only math"],correct:0,explain:"Led team wrote software for Apollo, prevented crash."},{q:"When did Hidden Figures film tell story?",options:["2016 film finally told story","1969","1953","2020"],correct:0,explain:"2016 film Hidden Figures told story."}]},{id:34,title:"How Coffee Came to World",category:"History",level:"B1",words:281,passage:`Today, people drink 2 billion cups of coffee every day. But 600 years ago, almost no one outside Yemen knew what coffee was. The journey of coffee is a story of travel, trade, and theft.

According to legend, coffee was discovered in Ethiopia when a goat herder noticed his goats dancing after eating red berries. The drink was first made in Yemen in the 15th century by Sufi monks who used it to stay awake for night prayers. From Yemen, coffee spread to Mecca and Istanbul, where coffee houses became places to discuss politics.

For 200 years, Yemen tried to keep a monopoly. They boiled coffee beans before export so they could not be planted. In 1616, a Dutch trader named Pieter van der Broeck smuggled some live plants to Amsterdam. From there, coffee went to colonies.

Coffee reached Europe and was controversial. Some religious leaders called it 'devil's drink' because it came from Muslim countries. Pope Clement VIII tasted it and said it was too delicious to leave to Muslims, so he blessed it.

In the 18th century, a Brazilian colonel smuggled seedlings hidden in a bouquet of flowers given by the wife of the governor of French Guiana. Brazil now produces 40% of world coffee.

From a Yemeni monastery to global habit, coffee's history shows how small seeds can change world culture and economy.`,questions:[{q:"How many cups of coffee daily today?",options:["2 billion cups","2 million","2 thousand","200"],correct:0,explain:"2B cups daily."},{q:"Where was coffee first made as drink?",options:["Yemen 15th century by Sufi monks for prayers","Ethiopia as drink","Brazil","Amsterdam"],correct:0,explain:"First made Yemen 15th century Sufi monks."},{q:"How did Yemen keep monopoly?",options:["Boiled beans before export so cannot be planted","Free export","No monopoly","Gave seeds"],correct:0,explain:"Boiled beans before export so cannot be planted."},{q:"Who smuggled plants to Amsterdam 1616?",options:["Pieter van der Broeck Dutch trader","No one","Pope","Brazilian colonel"],correct:0,explain:"Pieter van der Broeck smuggled live plants 1616."},{q:"How did coffee reach Brazil?",options:["Seedlings hidden in bouquet from French Guiana governor's wife","Bought legally","No coffee in Brazil","From Yemen directly"],correct:0,explain:"Smuggled hidden in bouquet."}]},{id:35,title:"Fall of Berlin Wall 1989",category:"History",level:"B1",words:277,passage:`On the night of November 9, 1989, thousands of East Germans walked to the Berlin Wall and began to climb it. Guards, confused by new orders, did nothing. People danced, cried, and used hammers to break concrete that had divided their city for 28 years.

The wall was built in 1961. After World War II, Germany was split into East (communist) and West (democratic). Berlin, located inside East Germany, was also split. To stop people from escaping to the West, East Germany built a 155-kilometer wall with barbed wire, watchtowers, and guards with orders to shoot.

Families were separated overnight. A mother who lived in East Berlin could not visit her son in West Berlin, just 2 kilometers away. At least 140 people died trying to cross, including children.

By 1989, pressure was growing. Hungary opened its border, allowing thousands of East Germans to escape through Austria. Weekly protests in Leipzig grew from 1,000 to 300,000 people. The East German government announced that citizens could travel to the West, but did not explain procedures clearly.

When news broadcast that borders were open, crowds rushed to checkpoints. The images of strangers hugging and Trabant cars driving into West Berlin became symbols of freedom. Within a year, East and West Germany reunited.

The wall's fall showed that even strong barriers cannot last forever when people want freedom.`,questions:[{q:"When did Berlin Wall fall?",options:["Night of Nov 9 1989","1961","1990","1980"],correct:0,explain:"Nov 9 1989 thousands walked to wall."},{q:"How long did wall divide city?",options:["28 years","10 years","5 years","100 years"],correct:0,explain:"Divided city for 28 years."},{q:"How long was the wall?",options:["155 km with barbed wire watchtowers","15 km","1 km","500 km"],correct:0,explain:"155 km wall."},{q:"How many died trying to cross?",options:["At least 140 including children","None","10","1000"],correct:0,explain:"At least 140 died trying to cross."},{q:"What happened within a year after fall?",options:["East and West Germany reunited","Wall rebuilt","No reunion","War started"],correct:0,explain:"Within year East West reunited."}]},{id:36,title:"How Printing Changed World",category:"History",level:"B1",words:278,passage:`Before 1440, a book cost as much as a house. Monks copied books by hand, one page taking one hour. Only kings, churches, and very rich people owned books. Most people could not read because there was nothing to read.

Johannes Gutenberg, a goldsmith from Mainz, Germany, changed everything. Around 1440, he combined existing technologies in a new way. He used movable metal letters that could be rearranged, oil-based ink that stuck to metal, and a wine press to press paper onto ink.

His first major book was the Bible, printed in 1455. He printed 180 copies, each with 1,282 pages. The result was beautiful and much cheaper than handwritten versions. Within 50 years, printing presses existed in 250 cities in Europe. By 1500, 20 million books had been printed.

Effects were enormous. When books became cheap, more people learned to read. Literacy in Europe rose from 10% in 1400 to 50% by 1700. Ideas spread quickly. Martin Luther's ideas for church reform reached thousands within weeks because of printed pamphlets.

Science advanced because scientists could share results. Maps became available, helping explorers. Newspapers started in the 1600s, creating public opinion.

Gutenberg died poor and largely unknown, but his invention is considered one of the most important in history. It turned knowledge from private luxury into public resource.`,questions:[{q:"How much did a book cost before 1440?",options:["As much as a house, monks copied by hand 1 hour per page","Cheap","Free","As much as bread"],correct:0,explain:"Cost as much as house, monks 1 hour per page."},{q:"What did Gutenberg combine around 1440?",options:["Movable metal letters, oil ink, wine press","Only paper","Only ink","Computer"],correct:0,explain:"Movable metal letters, oil-based ink, wine press."},{q:"What was first major book 1455?",options:["Bible 180 copies 1282 pages","Newspaper","No book","Small pamphlet"],correct:0,explain:"Bible printed 1455 180 copies."},{q:"How many books by 1500?",options:["20 million printed","180","1000","No books"],correct:0,explain:"20M books by 1500."},{q:"How did literacy change?",options:["10% 1400 to 50% by 1700","No change","Decreased","100% to 0%"],correct:0,explain:"10% in 1400 to 50% by 1700."}]},{id:37,title:"Why Mongol Empire Was Big But Short",category:"History",level:"B1",words:275,passage:`In 1227, at the time of Genghis Khan's death, the Mongol Empire stretched from the Pacific Ocean to Eastern Europe. It covered 24 million square kilometers, the largest continuous land empire in history. Yet 100 years later, it had broken into four parts and lost much power.

Mongols succeeded because they were excellent horsemen and archers. A Mongol soldier could shoot an arrow accurately while riding at full speed. They also adopted useful ideas from conquered peoples: Chinese engineers built catapults, Persian accountants managed taxes.

Communication was key. The Yam system was a network of stations every 25 kilometers with fresh horses. Messages could travel 300 kilometers per day, faster than any other system at that time. This allowed quick coordination across huge distances.

So why did it fall quickly? First, it was too big to govern. Managing different languages, religions, and climates from one capital was impossible before telephones or trains. Local leaders started acting independently.

Second, succession was unclear. When a Khan died, all princes had to return to Mongolia to choose a new leader. During these long trips, wars stopped and enemies recovered.

Third, Mongols did not build lasting institutions like schools or legal systems in most areas. They collected taxes but invested little. When military power weakened, there was nothing else to hold the empire together.

The Mongols proved that conquering is easier than governing for long periods.`,questions:[{q:"How large was Mongol Empire in 1227?",options:["24 million sq km largest continuous land empire","Small","2 million","100 million"],correct:0,explain:"24M sq km largest continuous."},{q:"Why did Mongols succeed militarily?",options:["Excellent horsemen and archers shooting while riding","Weak army","Only foot soldiers","No weapons"],correct:0,explain:"Excellent horsemen and archers."},{q:"What was Yam system?",options:["Stations every 25km with fresh horses, messages 300km/day","No system","Only horses","Slow mail"],correct:0,explain:"Network stations 25km fresh horses 300km/day."},{q:"Why was empire too big to govern?",options:["Different languages religions climates impossible before phones","Easy to govern","Small area","No diversity"],correct:0,explain:"Too big, different languages religions climates."},{q:"What happened when Khan died?",options:["Princes return to Mongolia choose new leader, wars stopped","Immediate new Khan","No effect","Empire grew"],correct:0,explain:"Princes had to return, wars stopped."}]},{id:38,title:"Why We Delay Work",category:"Psychology",level:"B1",words:278,passage:`You have an important report due tomorrow, but you clean your room, watch videos, and check your phone instead. This behavior is called procrastination, and 95% of people do it sometimes. It is not laziness; it is about managing emotions.

Psychologists say we delay tasks that cause negative feelings: fear of failure, boredom, or feeling overwhelmed. When you think about writing a difficult report, your brain feels uncomfortable. Cleaning your room gives quick positive feeling, so your brain chooses that instead.

The problem is that delay makes stress worse. A 2022 study tracked 400 students. Those who procrastinated had lower grades and higher anxiety. They also slept less because they worked late at night.

There are practical ways to stop. The 2-minute rule helps: if a task takes less than 2 minutes, do it immediately. For bigger tasks, use the 5-minute start. Promise yourself you will work for only 5 minutes. Often, after 5 minutes, you continue because starting was the hardest part.

Breaking work into tiny steps also helps. Instead of 'write report', write 'open document and write title'. Small steps feel less scary. Removing distractions is crucial: put your phone in another room and use website blockers.

Understanding that procrastination is emotional, not moral, reduces shame. You are not a bad person; your brain is trying to avoid discomfort. Teaching it that discomfort is temporary helps you act despite feelings.`,questions:[{q:"What percentage procrastinate sometimes?",options:["95%","5%","50%","0%"],correct:0,explain:"95% do it sometimes."},{q:"Why do we delay according to psychologists?",options:["Tasks cause negative feelings like fear boredom","Laziness only","No reason","Happy feelings"],correct:0,explain:"Delay tasks that cause negative feelings."},{q:"What did 2022 study of 400 students show?",options:["Procrastinators had lower grades higher anxiety less sleep","Higher grades","No difference","More sleep"],correct:0,explain:"Lower grades higher anxiety slept less."},{q:"What is 5-minute start technique?",options:["Promise work only 5 mins, often continue after","Work 5 hours","Only 5 minute tasks","No start"],correct:0,explain:"Promise work only 5 mins, starting hardest."},{q:"What helps besides small steps?",options:["Remove distractions phone in other room","More distractions","Only cleaning","No help"],correct:0,explain:"Removing distractions crucial."}]},{id:39,title:"How Habits Form",category:"Psychology",level:"B1",words:281,passage:`You have heard that it takes 21 days to form a habit. That idea came from a 1960 book about plastic surgery, not real research. A 2023 study from University College London found the true average is 66 days, with wide variation from 18 to 254 days.

Habits form through a loop: cue, routine, reward. For example, cue: you feel stressed after work. Routine: you eat chocolate. Reward: you feel better for 10 minutes. Repeating this loop strengthens connection in brain until it becomes automatic.

Environment matters more than willpower. If you want to eat more fruit, put fruit on the kitchen table where you see it daily. If you want to read more, put a book on your pillow. Making good behaviors easy and bad behaviors difficult works better than relying on motivation.

Small habits are more sustainable. Instead of 'exercise 1 hour daily', start with 'put on running shoes every morning'. The goal is to make identity change: 'I am a person who moves daily' rather than outcome change.

Tracking helps. Marking an X on calendar each day you do habit creates a chain you do not want to break. Missing once is okay; missing twice starts new pattern. Research shows people who forgive themselves after missing once are more likely to continue.

Habit formation is not about perfection but repetition. Every repetition, even imperfect, strengthens neural pathway. After 66 days average, behavior requires less mental energy and feels natural.`,questions:[{q:"How long does habit really take average?",options:["66 days average 18-254 variation not 21 days","21 days exactly","1 day","1 year"],correct:0,explain:"True average 66 days."},{q:"Where did 21 days idea come from?",options:["1960 book about plastic surgery not research","Real research","2023 study","Ancient book"],correct:0,explain:"1960 book plastic surgery not real research."},{q:"What is habit loop?",options:["Cue routine reward","Only reward","Only cue","No loop"],correct:0,explain:"Cue routine reward loop."},{q:"What matters more than willpower?",options:["Environment: put fruit on table book on pillow","Only willpower","No environment","Only motivation"],correct:0,explain:"Environment matters more than willpower."},{q:"What does tracking with calendar do?",options:["Creates chain you don't want to break, forgive self after miss","No effect","Breaks habit","Only for bad habits"],correct:0,explain:"Marking X creates chain not want break."}]},{id:40,title:"What is Emotional Intelligence?",category:"Psychology",level:"B1",words:277,passage:`In 1995, psychologist Daniel Goleman published a book that became famous worldwide. He argued that success in life depends not only on IQ, but also on emotional intelligence, or EQ. Companies now consider EQ as important as technical skills.

Goleman described five skills. First, self-awareness: recognizing your own emotions as they happen. For example, noticing 'I feel angry because my colleague ignored my idea' rather than just shouting.

Second, self-regulation: controlling reactions. Instead of sending an angry email immediately, you wait 30 minutes and write a calm message. This prevents damage to relationships.

Third, motivation: using emotions to reach goals. People with high EQ stay positive even after failure and keep trying. They see setbacks as temporary.

Fourth, empathy: understanding how others feel. If a friend is quiet during lunch, you might ask 'Are you okay?' instead of thinking they are rude. This builds trust.

Fifth, social skills: managing relationships well. This includes listening, resolving conflicts, and working in teams.

Research shows EQ can be learned, unlike IQ which changes little. Practicing mindfulness for 10 minutes daily improves self-awareness. Asking for feedback from friends helps empathy.

In job interviews, many companies now ask 'Tell me about a time you handled conflict' to test EQ. Technical skills get you hired, but EQ determines if you get promoted and keep good relationships.`,questions:[{q:"When did Goleman publish EQ book?",options:["1995 argued EQ important as IQ","2000","1990","2020"],correct:0,explain:"1995 book famous."},{q:"What is first EQ skill?",options:["Self-awareness recognizing own emotions as they happen","No skills","Only IQ","Selfishness"],correct:0,explain:"First self-awareness."},{q:"What is self-regulation example?",options:["Wait 30 mins instead of angry email immediately","Send angry email immediately","Shout","No control"],correct:0,explain:"Wait 30 mins write calm message."},{q:"What is empathy?",options:["Understanding how others feel asking are you okay","Ignoring others","Only self","No empathy"],correct:0,explain:"Understanding how others feel."},{q:"Can EQ be learned?",options:["Yes mindfulness 10 mins improves self-awareness unlike IQ","No cannot be learned","Only IQ learned","No research"],correct:0,explain:"EQ can be learned, IQ changes little."}]},{id:41,title:"Why We Remember Bad Memories",category:"Psychology",level:"B1",words:279,passage:`Have you ever tried to sleep but your brain replays an embarrassing moment from 3 years ago? You cringe and think 'Why can't I forget this?' There is a biological reason: your brain is designed to remember danger.

Long ago, humans who remembered where they saw a tiger or which berries made them sick survived. Humans who forgot dangers died. So evolution favored brains that store negative experiences strongly. The amygdala, a small almond-shaped part of brain, tags scary or shameful memories as important.

That is why one critical comment can hurt more than ten compliments. Psychologists call this negativity bias. In studies, people need about 5 positive experiences to balance 1 negative experience emotionally.

Stress and lack of sleep make this worse. At 3 AM, when you are tired, your prefrontal cortex, which helps rational thinking, is less active. Emotions feel stronger and more dramatic than during day.

How to manage it? First, write down the worry with a plan: 'I said something awkward yesterday. Next time I will pause before answering.' Writing externalizes thought. Second, practice self-compassion: talk to yourself like you would to a friend. Third, focus on what you can control now.

Bad memories are not a sign something is wrong with you. They are sign your brain tries to protect you, even if overprotectively. Training your brain to also notice good moments balances this old survival system.`,questions:[{q:"Why brain replays embarrassing moment at night?",options:["Designed to remember danger for survival","No reason","Only good memories","Brain broken"],correct:0,explain:"Designed to remember danger, survived."},{q:"What part tags scary memories?",options:["Amygdala small almond-shaped part","No part","Heart","Stomach"],correct:0,explain:"Amygdala tags scary shameful memories important."},{q:"What is negativity bias?",options:["One critical hurts more than ten compliments need 5 positive to balance 1 negative","Positive stronger","No bias","Only negative"],correct:0,explain:"One critical hurts more than ten compliments."},{q:"Why worse at 3 AM?",options:["Tired prefrontal cortex less active emotions stronger","Better thinking","No effect","Only daytime worse"],correct:0,explain:"Prefrontal less active, emotions stronger."},{q:"What helps manage bad memories?",options:["Write worry with plan and self-compassion","Ignore forever","More worry","No help"],correct:0,explain:"Write down worry with plan, self-compassion."}]},{id:42,title:"How Social Media Makes Us Jealous",category:"Psychology",level:"B1",words:280,passage:`The term FOMO, Fear Of Missing Out, was added to Oxford Dictionary in 2013. It describes anxiety that others have more fun, better jobs, or more interesting lives than you, based on social media posts. 69% of millennials report feeling FOMO regularly.

Social media creates jealousy because we compare our behind-the-scenes with others' highlight reels. You see your friend's vacation in Bali with perfect sunset, but you do not see her 12-hour flight, lost luggage, and argument with partner. Your brain assumes her life is always perfect.

This constant comparison affects mental health. A 2022 study of 1,000 young adults found that those who spent more than 3 hours daily on Instagram reported higher levels of anxiety and lower self-esteem. They felt pressure to look successful even when feeling tired or sad.

The platforms encourage this. Algorithms show most liked posts first, so you see only the top 5% most impressive moments. Filters make skin smoother and bodies thinner than reality.

There are ways to reduce jealousy. First, remember that posts are curated, like movie trailers, not full movies. Second, limit time: set 60-minute daily limit. Third, practice gratitude: write 3 things you appreciate each evening. Studies show gratitude reduces comparison.

Following accounts that show real life, including struggles, also helps. Some influencers now post without filters to promote honesty. Curating your feed is like choosing friends: surround yourself with content that makes you feel calm, not inferior.`,questions:[{q:"When was FOMO added to dictionary?",options:["2013 Fear Of Missing Out","2000","2020","1990"],correct:0,explain:"2013 added to Oxford Dictionary."},{q:"What percentage millennials feel FOMO regularly?",options:["69%","10%","100%","0%"],correct:0,explain:"69% millennials report FOMO regularly."},{q:"Why does social media create jealousy?",options:["Compare behind-the-scenes with others highlight reels","No comparison","Only real life","Only vacation"],correct:0,explain:"Compare behind-scenes with highlight reels."},{q:"What did 2022 study of 1000 young adults find?",options:[">3h Instagram higher anxiety lower self-esteem","No effect","Higher self-esteem","Less anxiety"],correct:0,explain:"More than 3h higher anxiety lower self-esteem."},{q:"What helps reduce jealousy?",options:["Remember posts curated like trailers, gratitude 3 things","More comparison","More filters","More time online"],correct:0,explain:"Posts curated like trailers, gratitude reduces comparison."}]},{id:43,title:"Why Music Makes Us Feel Good",category:"Psychology",level:"B1",words:276,passage:`When your favorite song reaches its best part, you might get chills or tears. This physical reaction has a chemical explanation. In 2022, researchers at McGill University found that listening to favorite music releases dopamine, the same brain chemical released when eating chocolate or falling in love.

Music also connects to memory. A song from your high school graduation can instantly bring back feelings, smells, and images from that time. This is because music activates hippocampus, the brain area for memory, and amygdala for emotion at same time.

Different types of music affect us differently. Fast music with strong beat, like 120 beats per minute, increases heart rate and energy. That is why gyms play upbeat music. Slow music around 60-80 beats per minute, similar to resting heart rate, helps us relax and can reduce stress hormones by 25%.

Playing music has even stronger benefits than listening. Learning an instrument improves coordination between hands and ears and can increase IQ scores by 7 points in children who practice regularly for one year.

In therapy, music helps people with depression and anxiety. Patients who listen to calming music for 30 minutes before sleep fall asleep faster and report better mood next day.

You do not need expensive equipment to benefit. Singing in shower, drumming on table, or listening mindfully for 15 minutes with eyes closed all activate these positive brain responses. Music is free medicine available to everyone.`,questions:[{q:"What chemical does favorite music release?",options:["Dopamine same as chocolate or falling in love","No chemical","Only adrenaline","Only water"],correct:0,explain:"Releases dopamine."},{q:"When was this found by McGill?",options:["2022 researchers found","1990","2010","2005"],correct:0,explain:"2022 McGill found."},{q:"Why does music bring back memories?",options:["Activates hippocampus memory and amygdala emotion together","No connection","Only memory","Only emotion"],correct:0,explain:"Activates hippocampus and amygdala."},{q:"What does fast music 120 bpm do?",options:["Increases heart rate and energy","Makes sleepy","No effect","Decreases heart rate"],correct:0,explain:"120 bpm increases heart rate energy."},{q:"What benefit does learning instrument have for children?",options:["Can increase IQ 7 points if practice 1 year","No benefit","Decrease IQ","Only coordination"],correct:0,explain:"Increase IQ 7 points children practice 1 year."}]},{id:44,title:"How Positive Thinking Helps",category:"Psychology",level:"B1",words:275,passage:`Psychologist Martin Seligman studied why some people recover quickly after failure while others stay depressed. In the 1990s, he developed the idea of learned optimism: positive thinking is a skill that can be practiced, not just personality you are born with.

Optimistic people explain bad events differently. When they fail a test, they think 'I did not study enough this time' (temporary and specific). Pessimistic people think 'I am stupid and always fail' (permanent and general). The first explanation allows change; second feels hopeless.

Research shows optimism improves health. A 35-year study of 900 people found that optimistic individuals lived 11% longer and had 35% lower risk of heart disease. They also recover faster from surgery because they follow medical advice more carefully.

Positive thinking does not mean ignoring problems. It means focusing on what you can control and taking action. For example, instead of worrying 'I will lose my job', optimistic person thinks 'What skills can I learn this month to be more valuable?'

Simple daily practices build optimism. One is the 'three good things' exercise: every night, write three good things that happened and why. After 2 weeks, participants reported 20% higher happiness.

Another is challenging negative thoughts: ask 'Is there another explanation? What would I say to a friend in same situation?' This creates more balanced view.

Optimism is like muscle: small regular exercise makes it stronger over time.`,questions:[{q:"Who developed learned optimism?",options:["Martin Seligman 1990s skill can be practiced","No one","Freud","Only pessimists"],correct:0,explain:"Seligman 1990s learned optimism skill."},{q:"How do optimistic people explain failure?",options:["Temporary specific: didn't study enough this time","Permanent: I am stupid always fail","No explanation","Only blame others"],correct:0,explain:"Temporary specific allows change."},{q:"What did 35-year study of 900 people find?",options:["Optimistic lived 11% longer 35% lower heart risk","No difference","Shorter life","More disease"],correct:0,explain:"Lived 11% longer lower heart risk."},{q:"What does positive thinking NOT mean?",options:["Ignoring problems","Focusing what can control and action","Taking action","Learning skills"],correct:0,explain:"Does NOT mean ignoring problems."},{q:"What is three good things exercise?",options:["Write three good things nightly why, 20% higher happiness after 2 weeks","Three bad things","No exercise","Only one good thing"],correct:0,explain:"Write three good things nightly."}]},{id:45,title:"Why Octopus Is Smart",category:"General",level:"B1",words:278,passage:`An octopus has 500 million neurons, similar to a dog. But unlike a dog, two-thirds of its neurons are in its arms, not its head. Each arm can taste, touch, and make decisions independently. If an arm is cut off, it can still move and react for an hour.

This distributed intelligence allows amazing abilities. In labs, octopuses have opened jars to get food inside, solved mazes, and carried coconut shells to use as armor. They can camouflage in 0.3 seconds by changing color, texture, and pattern to match rocks or coral.

Octopuses also have excellent memory. They remember which humans fed them and which annoyed them. In one aquarium, an octopus learned to turn off lights by spraying water at the bulb, because bright light bothered it at night. Staff had to fix the light many times.

Their intelligence evolved separately from ours. Humans and octopuses last shared an ancestor 600 million years ago, before dinosaurs. This is called convergent evolution: different species developing similar smart behaviors for survival.

Lifespan is short, only 1-2 years for most species. Females lay 200,000 eggs and guard them for months without eating, then die after eggs hatch. Males also die soon after mating. This short life makes their quick learning even more impressive.

Studying octopus brains may help us build better robots with arms that think independently. Nature often invents solutions before humans do.`,questions:[{q:"How many neurons does octopus have?",options:["500M similar to dog 2/3 in arms","50M","5M","No neurons"],correct:0,explain:"500M similar dog 2/3 in arms."},{q:"What can each arm do?",options:["Taste touch decide independently can move 1h after cut","Nothing","Only move","Only taste"],correct:0,explain:"Each arm taste touch decisions independently."},{q:"How fast can octopus camouflage?",options:["0.3 seconds changing color texture pattern","3 seconds","30 seconds","Cannot camouflage"],correct:0,explain:"0.3 seconds camouflage."},{q:"What did aquarium octopus learn?",options:["Turn off lights spraying water at bulb","Nothing","Only open jars","Only sleep"],correct:0,explain:"Learned turn off lights spraying water."},{q:"How long do most octopuses live?",options:["1-2 years female 200k eggs guards without eating","10 years","100 years","1 month"],correct:0,explain:"1-2 years, female lays 200k eggs."}]},{id:46,title:"How Trees Talk to Each Other",category:"General",level:"B1",words:280,passage:`Walk in a forest and you see individual trees competing for sunlight. Underground, they are actually cooperating through a network of fungi. Scientists call this the Wood Wide Web.

Mycorrhizal fungi grow tiny threads that connect tree roots over hundreds of meters. Trees share nutrients through this network. A large 'mother tree' can send sugars to younger seedlings that are shaded and cannot make enough food themselves. In return, fungi receive 30% of tree's sugars as payment.

Trees also send warning signals. When a tree is attacked by insects, it releases chemicals into fungal network that alert neighboring trees. Those neighbors then produce bitter compounds to make their leaves less tasty to insects. This happens within hours.

Research in Canadian forests showed that Douglas fir and birch trees share nutrients depending on season. In summer when fir has extra sugars from sun, it sends to birch. In winter when birch is dormant, the flow reverses.

This cooperation helps forest resilience. When one tree dies, its nutrients are redistributed to others through fungi rather than lost. Old trees store most carbon and support many younger trees.

Deforestation breaks this network because fungi need living roots. Replanting single species plantations does not restore full communication system. Protecting old growth forests preserves both trees and their underground internet.

Understanding tree communication changes how we see forests: not as collection of individuals but as community that supports each other.`,questions:[{q:"What is Wood Wide Web?",options:["Fungi threads connecting tree roots sharing nutrients","Internet for humans","No network","Only competition"],correct:0,explain:"Fungi network connecting roots sharing nutrients."},{q:"How much sugar do fungi receive?",options:["30% of tree sugars as payment","100%","0%","50%"],correct:0,explain:"Fungi receive 30% sugars."},{q:"How do trees warn neighbors?",options:["Release chemicals into fungal network neighbors make bitter leaves","No warning","Only sound","Only wind"],correct:0,explain:"Release chemicals alert neighbors produce bitter compounds."},{q:"What did Canadian research show about fir and birch?",options:["Share nutrients seasonally summer fir to birch winter reverse","No sharing","Only fir gives","Only birch gives"],correct:0,explain:"Share depending season."},{q:"Why deforestation breaks network?",options:["Fungi need living roots single species plantations don't restore","No effect","Helps network","Only old trees need"],correct:0,explain:"Fungi need living roots."}]},{id:47,title:"What is Dark Matter?",category:"General",level:"B1",words:276,passage:`Look at night sky. Stars and galaxies you see make up only 15% of universe's matter. The other 85% is invisible and mysterious. Scientists call it dark matter, discovered in 1933 by Swiss astronomer Fritz Zwicky.

Zwicky noticed that galaxies in Coma Cluster moved too fast. Visible matter did not have enough gravity to hold them together; they should have flown apart. He proposed invisible matter provides extra gravity.

For 90 years, we have not directly seen dark matter. We know it exists because of its gravitational effects. It bends light from distant galaxies, an effect called gravitational lensing. It also affects how galaxies rotate: outer stars rotate faster than expected if only visible matter existed.

What could dark matter be? One idea is WIMPs, Weakly Interacting Massive Particles that rarely touch normal matter. Another is axions, extremely light particles. Huge experiments deep underground try to detect them. So far, no direct detection, but searches continue.

Dark matter is different from dark energy, which makes up 68% of total universe energy and causes expansion to accelerate. Together, dark matter and dark energy make 95% of universe, meaning we understand only 5% that we see.

Studying dark matter helps us understand universe's structure and fate. If we solve this puzzle, we will understand where galaxies come from and how universe will end. For now, it remains one of biggest mysteries in science.`,questions:[{q:"How much of matter is visible vs dark?",options:["Visible 15% dark 85%","50-50","Visible 85% dark 15%","100% visible"],correct:0,explain:"Stars galaxies only 15%, other 85% dark matter."},{q:"Who discovered dark matter idea 1933?",options:["Fritz Zwicky Swiss astronomer Coma Cluster moved too fast","Newton","Einstein","No one"],correct:0,explain:"1933 Fritz Zwicky."},{q:"How do we know dark matter exists?",options:["Gravitational effects bends light lensing galaxies rotate faster","Directly seen","No evidence","Only theory"],correct:0,explain:"Gravitational effects, bends light, affects rotation."},{q:"What are WIMPs?",options:["Weakly Interacting Massive Particles rarely touch normal matter","Visible stars","Dark energy","No idea"],correct:0,explain:"WIMPs weakly interacting massive particles."},{q:"How much of total universe is dark matter + dark energy?",options:["95% we understand only 5% we see","15%","50%","0%"],correct:0,explain:"Together 95%, understand only 5%."}]},{id:48,title:"Why Honey Lasts Forever",category:"General",level:"B1",words:273,passage:`In 1922, archaeologists found 3,000-year-old honey in an Egyptian tomb. It was still edible. Honey is the only food that never spoils under proper conditions. The reason is clever chemistry.

Bees make honey by collecting nectar and adding enzymes that break sugars into simpler forms. They then fan their wings to remove water until honey has less than 18% water. Bacteria and mold need water to grow, so they cannot survive in thick honey.

Honey is also very acidic, with pH around 3.9, similar to orange juice. Most bacteria cannot grow in acidic environment. Additionally, bees add hydrogen peroxide, a natural antiseptic that kills microbes.

Storage matters. Honey must be kept in sealed container. If water gets in, for example from a wet spoon, fermentation can start and honey spoils. Ancient Egyptians stored honey in sealed pottery jars, which is why it lasted millennia.

Honey was valuable in past. Romans used it to pay taxes. During World War I, doctors used honey on wounds to prevent infection before antibiotics existed.

Today, honey is still used as natural remedy for sore throats and coughs. However, it should not be given to babies under 1 year because their stomachs cannot handle some bacteria that may survive.

So a jar of honey in your kitchen could theoretically last until your great-great-grandchildren, if kept dry and sealed. It is a small example of how bees create perfect preservation system.`,questions:[{q:"What was found in Egyptian tomb 1922?",options:["3000-year-old honey still edible","No honey","Spoiled honey","Gold only"],correct:0,explain:"3000-year-old honey still edible."},{q:"Why can't bacteria grow in honey?",options:["Less than 18% water bacteria need water","Too much water","No reason","Too cold"],correct:0,explain:"Less than 18% water, bacteria need water."},{q:"What is honey pH?",options:["Around 3.9 acidic similar orange juice bacteria cannot grow","Neutral","Basic","No pH"],correct:0,explain:"pH 3.9 acidic."},{q:"What else do bees add?",options:["Hydrogen peroxide natural antiseptic kills microbes","Sugar only","Water","Nothing"],correct:0,explain:"Add hydrogen peroxide antiseptic."},{q:"Why not give honey to babies under 1 year?",options:["Stomachs cannot handle some bacteria that may survive","Too sweet","No reason","Allergic always"],correct:0,explain:"Stomachs cannot handle some bacteria."}]},{id:49,title:"How Bees Choose New Home",category:"General",level:"B1",words:281,passage:`When a beehive becomes too crowded, about half the bees leave with the old queen to find a new home. This is called swarming. How do 10,000 bees agree on where to live? They use a form of democracy that is surprisingly sophisticated.

First, scout bees fly out to explore possible locations. They look for cavities that are about 40 liters in volume, with small entrance facing south, and protected from wind. Each scout returns and performs a waggle dance to advertise her site. More excited dancing means better site.

Other scouts visit advertised sites and make their own judgment. If they like it, they also dance for it. Gradually, more scouts dance for best sites and fewer for poor sites. This creates competition between options.

The decision is made when about 15 scouts gather at one site simultaneously. That quorum signals strong agreement. Then all scouts return to swarm and guide entire colony to new home by flying together.

This process takes 2-3 days and is very accurate. Studies show bees choose best available site 80% of time. Humans studying this system learned lessons for group decision making: encourage independent exploration, have open debate, and require strong agreement before action.

Bee democracy is not perfect. Sometimes swarm chooses site that is too small or too exposed and fails in winter. But overall, it shows that even small brains can make wise collective decisions without a central leader telling everyone what to do.`,questions:[{q:"What is swarming?",options:["Half bees leave with old queen when hive too crowded","Bees die","Bees sleep","Only queen leaves"],correct:0,explain:"Half bees leave with old queen when too crowded."},{q:"What do scout bees look for?",options:["Cavity 40 liters small south entrance protected wind","Any place","No criteria","Only large entrance"],correct:0,explain:"40 liters small south entrance protected."},{q:"How do scouts advertise sites?",options:["Waggle dance more excited better site","No dance","Only sound","Only smell"],correct:0,explain:"Waggle dance more excited better."},{q:"When is decision made?",options:["15 scouts gather at one site simultaneously quorum","1 scout","Immediately","No decision"],correct:0,explain:"15 scouts gather simultaneously quorum."},{q:"How accurate is bee choice?",options:["80% choose best available site","0%","100%","10%"],correct:0,explain:"Choose best site 80% time."}]},{id:50,title:"Why We Get Chills From Music",category:"General",level:"B1",words:278,passage:`Have you ever felt goosebumps when a song reaches a powerful chorus? About 90% of people experience music chills, also called frisson. Scientists studied why this happens and found brain and emotional reasons.

The main cause is unexpected change. When music suddenly becomes louder, adds new instrument, or changes key, your brain predicts what comes next and is surprised. This violation of expectation triggers dopamine release and physical response: chills, tears, or lump in throat.

Personality affects how often you get chills. People who score high on openness to experience, meaning they enjoy new ideas and art, report chills more frequently. They pay more attention to details and emotional content.

Favorite parts cause stronger chills because of memory. If you heard a song during important moment like first love or graduation, brain links music to that emotion. When you hear it again, memory and music combine.

A 2023 study at University of Southern California scanned brains of people experiencing chills. They found activity in reward centers, plus connection between auditory cortex and emotion areas. Essentially, music hijacks brain systems designed for social bonding.

You can increase chance of chills by listening with full attention, not as background. Use good headphones, close eyes, and focus on structure. Chills show that music is not just entertainment; it deeply connects to our emotional brain and can be used for well-being and stress relief.`,questions:[{q:"What percentage experience music chills?",options:["About 90% called frisson","10%","50%","100%"],correct:0,explain:"90% experience chills frisson."},{q:"What is main cause?",options:["Unexpected change louder new instrument key change violates expectation","Only loud music","Only soft music","No change"],correct:0,explain:"Unexpected change violation expectation triggers dopamine."},{q:"Which personality gets chills more?",options:["High openness to experience enjoy new ideas art","Closed","No personality effect","Only extroverts"],correct:0,explain:"High openness report chills more."},{q:"Why favorite parts stronger?",options:["Memory links important moments first love graduation","No memory","Only loudness","Only new songs"],correct:0,explain:"Brain links music to emotion memory."},{q:"What did USC 2023 scan find?",options:["Activity reward centers connection auditory cortex emotion","No activity","Only hearing area","Only reward"],correct:0,explain:"Activity reward centers plus connection auditory emotion."}]}];function ci(){let[e,n]=ue.useState(1),[t,r]=ue.useState({}),[l,u]=ue.useState(""),[o,i]=ue.useState("All"),[s,f]=ue.useState(""),[p,v]=ue.useState(""),[m,k]=ue.useState(!1),[E,_]=ue.useState(!1),[D,c]=ue.useState(()=>$n.map((w)=>w.id)),[a,d]=ue.useState(!1),[y,P]=ue.useState(!1),N=ue.useMemo(()=>{let w=$n.filter((x)=>D.includes(x.id)).sort((x,A)=>D.indexOf(x.id)-D.indexOf(A.id));if(o!=="All")w=w.filter((x)=>x.category===o);if(l.trim()){let x=l.toLowerCase();w=w.filter((A)=>A.title.toLowerCase().includes(x)||A.passage.toLowerCase().includes(x))}return w},[l,o,D]),z=ue.useMemo(()=>$n.find((w)=>w.id===e)||$n[0],[e]),T=Object.keys(t).length,M=Object.entries(t).fi
