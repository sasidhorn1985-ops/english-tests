<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - English Test</title>
<style>body{margin:0;background:#F5F3FF;font-family:-apple-system,system-ui;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:16px}.card{background:#fff;width:100%;max-width:420px;border-radius:24px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.08)}label{display:block;margin:14px 0 6px;font-weight:700}input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:16px;box-sizing:border-box}button{width:100%;margin-top:18px;padding:13px;border:none;border-radius:999px;background:#7C3AED;color:#fff;font-size:17px;font-weight:700;cursor:pointer}#msg{color:#dc2626;min-height:20px;margin-top:10px}</style></head>
<body><div class="card">
<h2>🔒 Login - เข้าสู่ระบบทำเทส</h2>
<p>Vocabulary Unit 01-10 Complete 500 Words</p>
<label>ชื่อ-นามสกุล</label><input id="name" placeholder="เช่น ด.ญ. สมหญิง ใจดี">
<label>ห้อง</label><select id="room"><option>1/1</option><option>1/2</option><option>1/3</option><option>1/4</option><option>1/5</option></select>
<label>รหัสนักเรียน</label><input id="sid" placeholder="เช่น 12345">
<label>รหัสผ่าน</label><input id="pw" type="password" placeholder="รหัสที่ครูให้มา">
<button id="go" onclick="login()">เข้าเทส →</button><p id="msg"></p>
</div>
<script>
function login(){
  var name=document.getElementById('name').value.trim();
  var room=document.getElementById('room').value;
  var sid=document.getElementById('sid').value.trim();
  var pw=document.getElementById('pw').value.trim();
  var msg=document.getElementById('msg');
  if(!name||!sid||!pw){msg.textContent='กรอกให้ครบก่อนครับ';return;}
  if(pw==='vocab123'){
    sessionStorage.setItem('login', JSON.stringify({name:name, classRoom:room, studentId:sid}));
    sessionStorage.setItem('studentName', name); sessionStorage.setItem('studentClass', room);
    location.href='index.html';
  } else { msg.textContent='รหัสผ่านไม่ถูก (ทดลอง: vocab123)'; }
}
</script></body></html>
