ail."},{id:"3-2",storyId:3,text:"How many times has the little dog bitten the writer?",options:["Only one time","Many times every week","Never","Every summer"],correct:"Only one time",explanationEn:"Writer says dog bit hand once and has bitten only that one time - specific detail."},{id:"3-3",storyId:3,text:"Why did the writer's finger bleed?",options:["Because he cut his finger working too fast","Because dog bit him","Because wind blew","Because hay bound too tight"],correct:"Because he cut his finger working too fast",explanationEn:"Passage explains cut finger and it bled before when work too fast - cause and effect."},{id:"3-4",storyId:3,text:"Which statement is true about life on the farm?",options:["Wind blows strong and lessons are simple","Dog bites badly every day","Farm has no wind","Hay is never bound"],correct:"Wind blows strong and lessons are simple",explanationEn:"Last lines describe simple lessons and wind blows daily - overall meaning."}]},{id:4,title:"Story 4: Family Picnic",verbs:[{base:"break",past:"broke",participle:"broken"},{base:"breed",past:"bred",participle:"bred"},{base:"bring",past:"brought",participle:"brought"},{base:"broadcast",past:"broadcast",participle:"broadcast"}],passage:"Last Sunday we had a picnic. My brother **broke** a plate by mistake, and he has **broken** many plates before. My uncle **bred** dogs for ten years, and he has **bred** very friendly dogs. Mom **brought** sandwiches, and she has **brought** juice every time. The radio **broadcast** the news about the weather, and it has **broadcast** the same song all day. We **broke** bread together and shared stories. My uncle has **bred** dogs since he was young. Mom **brought** extra food, and we were happy. The station **broadcast** music for our picnic. Nothing **broke** our happy mood. We have **brought** memories home, and we have **broken** no promises to meet again next week.",questions:[{id:"4-1",storyId:4,text:"When did the family have a picnic?",options:["Last Sunday","Last Monday","Yesterday morning","Tomorrow"],correct:"Last Sunday",explanationEn:"First sentence sets time: Last Sunday we had a picnic."},{id:"4-2",storyId:4,text:"What did Mom bring to the picnic?",options:["Sandwiches, juice and extra food","Only plates","Dogs","A radio"],correct:"Sandwiches, juice and extra food",explanationEn:"Mom brought sandwiches, has brought juice every time, and extra food - detailed list."},{id:"4-3",storyId:4,text:"Why was the picnic mood still happy despite broken plate?",options:["They shared stories, broke bread and listened to music","They bought new plates","They left early","Dog fixed it"],correct:"They shared stories, broke bread and listened to music",explanationEn:"Passage says nothing broke mood because they broke bread together and station broadcast music - inference."},{id:"4-4",storyId:4,text:"Which detail is mentioned about the radio?",options:["It broadcast news and same song all day","It broke","It was brought by uncle","It bred dogs"],correct:"It broadcast news and same song all day",explanationEn:"Radio broadcast news about weather and same song all day - comprehension of broadcast meaning in context."}]},{id:5,title:"Story 5: New House",verbs:[{base:"build",past:"built",participle:"built"},{base:"burn",past:"burnt",participle:"burnt"},{base:"burst",past:"burst",participle:"burst"},{base:"buy",past:"bought",participle:"bought"}],passage:"We **built** a small house near the river last year. We have **built** it with our own hands. One night we **burnt** some old wood in the garden, and we have **burnt** leaves every autumn. A water pipe **burst** suddenly, and it has **burst** before in winter. My parents **bought** new chairs for the house, and they have **bought** many plants too. We **built** the house slowly, we **burnt** no important things, the pipe **burst** but we fixed it, and we **bought** what we needed. The house we have **built** is warm and bright. We have never **burnt** food in the new kitchen. The balloon **burst** at the party. We **bought** the house with love and hope.",questions:[{id:"5-1",storyId:5,text:"Where is the new house?",options:["Near the river","In the city center","On the mountain","Near the airport"],correct:"Near the river",explanationEn:"First sentence says small house near the river - location main idea."},{id:"5-2",storyId:5,text:"What did they burn in the garden?",options:["Old wood and leaves in autumn","New chairs","Water pipe","House"],correct:"Old wood and leaves in autumn",explanationEn:"They burnt old wood and have burnt leaves every autumn - specific detail."},{id:"5-3",storyId:5,text:"What happened to the water pipe?",options:["It burst suddenly but they fixed it","It was bought new","It burnt","It was built"],correct:"It burst suddenly but they fixed it",explanationEn:"Pipe burst suddenly, has burst before, but they fixed it - problem and solution sequence."},{id:"5-4",storyId:5,text:"How is the house they built?",options:["Warm and bright, built with own hands slowly","Cold and dark","Big and expensive","Burst and broken"],correct:"Warm and bright, built with own hands slowly",explanationEn:"House is warm and bright, built with own hands slowly with love and hope - overall description."}]},{id:6,title:"Story 6: School Fair",verbs:[{base:"catch",past:"caught",participle:"caught"},{base:"choose",past:"chose",participle:"chosen"},{base:"cling",past:"clung",participle:"clung"},{base:"come",past:"came",participle:"come"}],passage:"At the school fair, I **caught** a red ball. I have **caught** many balls in games. I **chose** a blue shirt as a prize, and I have **chosen** blue many times before. My little sister **clung** to my arm because she was shy, and she has **clung** to me all day. My friends **came** to see me, and they have **come** to every fair. I **caught** the ball, I **chose** the gift, she **clung** to me, and they **came** to help. The ball I have **caught** is on my shelf. The shirt I have **chosen** is very soft. She has **clung** to her doll too. They have **come** early to enjoy the fair. It was a happy and simple day for all of us.",questions:[{id:"6-1",storyId:6,text:"What did the writer do at the school fair?",options:["Caught a red ball and chose a blue shirt","Sold shirts","Clung to teacher","Bought a doll"],correct:"Caught a red ball and chose a blue shirt",explanationEn:"Main actions: caught red ball, chose blue shirt as prize - what happened."},{id:"6-2",storyId:6,text:"What prize did the writer choose?",options:["A blue shirt, very soft","A red ball","A doll","An arm"],correct:"A blue shirt, very soft",explanationEn:"Chose blue shirt as prize, now soft - detail."},{id:"6-3",storyId:6,text:"Why did little sister cling to the writer?",options:["Because she was shy","Because she caught a ball","Because fair was over","Because she chose shirt"],correct:"Because she was shy",explanationEn:"Passage says clung because shy, inference."},{id:"6-4",storyId:6,text:"Which statement is NOT true?",options:["Friends never come to fair","Friends came to every fair and early","Ball is now on shelf","Day was happy and simple"],correct:"Friends never come to fair",explanationEn:"Friends have come to every fair early, so saying never come is false - negative comprehension."}]},{id:7,title:"Story 7: Shopping Day",verbs:[{base:"cost",past:"cost",participle:"cost"},{base:"creep",past:"crept",participle:"crept"},{base:"cut",past:"cut",participle:"cut"},{base:"deal",past:"dealt",participle:"dealt"}],passage:"The new bag **cost** twenty dollars yesterday, and it has **cost** the same for months. A small cat **crept** under the table, and it has **crept** there many times. I **cut** the price tag off, and I have **cut** paper for my project too. The shop **dealt** with many customers, and it has **dealt** with problems well. The bag **cost** little, the cat **crept** quietly, I **cut** the tag, and the shop **dealt** kindly with us. The bag that has **cost** twenty dollars is very strong. The cat that has **crept** under is now sleeping. I have **cut** the cloth for a new dress. The shop has **dealt** with us fairly. Shopping was easy and calm today.",questions:[{id:"7-1",storyId:7,text:"What did the writer do on shopping day?",options:["Bought a bag, cut price tag, saw cat","Sold a bag","Crept under table","Built a shop"],correct:"Bought a bag, cut price tag, saw cat",explanationEn:"Main events: bag cost 20, cut tag, cat crept - what happened overall."},{id:"7-2",storyId:7,text:"How much did the bag cost and how long same price?",options:["Twenty dollars for months, strong","Fifty dollars today only","Ten dollars yesterday","Free"],correct:"Twenty dollars for months, strong",explanationEn:"Bag cost 20 yesterday and has cost same for months, strong - detail."},{id:"7-3",storyId:7,text:"Why is the cat under the table?",options:["It creeps there many times quietly and sleeps","It cuts paper","It deals with customers","It costs money"],correct:"It creeps there many times quietly and sleeps",explanationEn:"Cat has crept there many times, quietly, now sleeping - habit inference."},{id:"7-4",storyId:7,text:"How did the shop deal with people?",options:["Kindly, fairly, dealt well with problems","Badly and angry","Cost too much","Cut tags"],correct:"Kindly, fairly, dealt well with problems",explanationEn:"Shop dealt with customers kindly, problems well, fairly - comprehension of dealt meaning in context."}]},{id:8,title:"Story 8: In The Garden",verbs:[{base:"dig",past:"dug",participle:"dug"},{base:"do",past:"did",participle:"done"},{base:"draw",past:"drew",participle:"drawn"},{base:"dream",past:"dreamt",participle:"dreamt"}],passage:"In the garden, I **dug** a small hole for seeds, and I have **dug** many holes this spring. I **did** my homework after gardening, and I have **done** it every day. My sister **drew** a picture of flowers, and she has **drawn** many pictures this month. Last night I **dreamt** about a big garden, and I have **dreamt** about it before n many times, forgiven small mistakes - character of mom, travel easier when forgive."}]},{id:12,title:"Story 12: Winter Day",verbs:[{base:"freeze",past:"froze",participle:"frozen"},{base:"get",past:"got",participle:"got"},{base:"give",past:"gave",participle:"given"},{base:"go",past:"went",participle:"gone"}],passage:"In winter, the lake **froze** early, and it has **frozen** every December. I **got** a warm coat from my aunt, and I have **got** many gifts from her. She **gave** me gloves too, and she has **given** me love always. We **went** for a walk on the ice, and we have **gone** there each year. The lake **froze**, I **got** a coat, she **gave** gloves, and we **went** out. The water that has **frozen** looks like glass. The coat I have **got** is very warm. The gloves she has **given** fit well. We have **gone** home happy and cold. Winter days are quiet and beautiful when we have warm clothes and kind people.",questions:[{id:"12-1",storyId:12,text:"What happened to the lake in winter?",options:["It froze early, looks like glass, freezes every December","It got coat","It gave gloves","It went walk"],correct:"It froze early, looks like glass, freezes every December",explanationEn:"Lake froze early, has frozen every December, looks like glass - detail comprehension."},{id:"12-2",storyId:12,text:"What did the writer get from aunt?",options:["Warm coat very warm and gloves that fit well, many gifts and love always","Lake","Ice","Walk"],correct:"Warm coat very warm and gloves that fit well, many gifts and love always",explanationEn:"Got warm coat, have got many gifts, gave gloves fit well, given love always - what aunt gave."},{id:"12-3",storyId:12,text:"Where did they go and how often?",options:["For a walk on the ice each year, then home happy and cold","To school","To market","To airport"],correct:"For a walk on the ice each year, then home happy and cold",explanationEn:"Went for walk on ice, have gone each year, gone home happy and cold - location and frequen
