ies and listen to songs. We can save photos of our family.","Computers need power to work. They also need internet for some jobs. If we have no internet, we can still play offline games. A computer is not a person, but it helps people a lot. We should thank the people who made it."],questions:[{q:"What is a computer called in the story?",options:["A smart machine","A small animal","A big car","A new phone"],a:0},{q:"Which part does a computer have?",options:["Screen, keys, mouse","Wheels and doors","Leaves and roots","Wings and tail"],a:0},{q:"What do students do on computers?",options:["Write homework","Cook rice","Wash clothes","Plant trees"],a:0},{q:"Can we use a computer without internet?",options:["Yes, for offline games","No, never","Only on Sundays","Only for calls"],a:0},{q:"Computers are people. True or false?",options:["False","True"],a:0}]},{id:3,title:"Video Games Are Fun",category:"Technology",words:182,paras:["Every Saturday I play games with my two friends. We meet online at four o'clock. We all have old laptops. We laugh a lot during the games.","We play a team game about building houses. I build the walls and roof. My friend finds wood and food. The other friend protects us from danger. We must talk and plan together. If we do not talk, we lose fast.","Some people say games are bad. I think games can teach us good things. They teach teamwork and patience. After one hour we stop and go outside. We play football in the park. Both kinds of play are fun for us."],questions:[{q:"When do they play games together?",options:["Every Saturday at four","Every Monday morning","Every night","Only in summer"],a:0},{q:"What is their game about?",options:["Building houses","Driving cars","Cooking food","Flying planes"],a:0},{q:"What must they do to win?",options:["Talk and plan together","Play alone","Shout loudly","Buy new laptops"],a:0},{q:"What do they do after one hour?",options:["Go outside and play football","Sleep all day","Eat pizza","Watch TV"],a:0},{q:"The writer thinks games can teach teamwork. True or false?",options:["True","False"],a:0}]},{id:4,title:"Shopping Online",category:"Technology",words:185,paras:["Last month I tried to buy clothes online for the first time. I was a little scared at first. I opened an app on my phone. The app showed many shirts in bright colors.","I chose a blue shirt and a black hat. I clicked the buy button. Then I paid with my bank app. It was very fast and easy. The shop said the box will come in three days.","On Thursday a small truck came to my house. The driver gave me a brown box. Inside was my blue shirt and black hat. The shirt fits well and looks nice. Now I like to shop online, but I check the size first."],questions:[{q:"What did she buy online first time?",options:["Clothes","Food and drinks","A new phone","Books only"],a:0},{q:"What color was the shirt?",options:["Blue","Red","Green","White"],a:0},{q:"How did she pay?",options:["With bank app","With cash only","With gold","With a letter"],a:0},{q:"When did the box arrive?",options:["After three days on Thursday","After one year","In five minutes","Never"],a:0},{q:"The shirt did NOT fit. True or false?",options:["False","True"],a:0}]},{id:5,title:"Social Media Time",category:"Technology",words:176,paras:["My sister uses Facebook and Instagram every day. She wakes up and looks at her phone. She sees photos of friends and family. She likes many posts and writes short comments.","Social media helps her talk to friends far away. Her cousin lives in Japan and they chat often. She also learns how to cook from short videos. But sometimes she looks at the screen for too long.","Last week she had a headache and sore eyes. Our mom said stop and go outside. Now she uses a timer for thirty minutes. After that she puts the phone down. She feels better and sleeps well now."],questions:[{q:"Which apps does her sister use?",options:["Facebook and Instagram","Only email","Only maps","Only games"],a:0},{q:"Where does her cousin live?",options:["In Japan","In Brazil","In Egypt","In Canada"],a:0},{q:"What problem did she have last week?",options:["Headache and sore eyes","Broken leg","Lost phone","No food"],a:0},{q:"What does she use now to control time?",options:["A timer for 30 minutes","A big clock","A friend","No tool"],a:0},{q:"She now sleeps well. True or false?",options:["True","False"],a:0}]},{id:6,title:"Electric Cars",category:"Technology",words:184,paras:["In our city we see new cars that make no loud noise. These cars use power from batteries, not gas. People call them electric cars. Tesla is a famous name for these cars. Many young people like them.","Electric cars are good for clean air. Gas cars make dark smoke. Smoke makes people sick. Electric cars do not make smoke. So the sky looks more blue when many people use them.","But electric cars have some hard points. They need places to charge. Charging takes more time than putting gas. Batteries cost a lot of money. Still, many cities plan to have more charging stations next year."],questions:[{q:"What do electric cars use?",options:["Power from batteries","Only water","Wood and coal","Human power"],a:0},{q:"Which brand is mentioned as famous?",options:["Tesla","Nike","Sony","Lego"],a:0},{q:"Why are they good for air?",options:["They do not make smoke","They make flowers","They clean roads","They are cheap"],a:0},{q:"What is one hard point?",options:["Need places to charge","Too noisy","Cannot move","Flies in sky"],a:0},{q:"Gas cars make clean air. True or false?",options:["False","True"],a:0}]},{id:7,title:"Safe Passwords",category:"Technology",words:179,paras:["My password was 123456 last year. It was very easy to guess. A friend told me that is not safe. He said a password is like a key to your house.","A good password should be long. It should have letters, numbers, and a small sign like @ or #. You should not use your name or birth date. You should not share it with other people.","Now I use a phrase I can remember. For example, I like blue sky at 7am! I make it BluSky@7am. I write it in a small book at home. I feel more safe online these days."],questions:[{q:"What was his old password?",options:["123456","MyDogName","Qwerty2020","Password!"],a:0},{q:"What is a password like?",options:["A key to your house","A spoon","A hat","A car"],a:0},{q:"What should a good password have?",options:["Letters, numbers, and @ or #","Only your name","Only 123","Only emojis"],a:0},{q:"Where does he keep his new password?",options:["In a small book at home","On the wall","On Facebook","In his shoe"],a:0},{q:"Sharing passwords is safe. True or false?",options:["False","True"],a:0}]},{id:8,title:"YouTube Learning",category:"Technology",words:181,paras:["After dinner I often open YouTube on my tablet. Many people from around the world make videos there. Some videos are funny and short. Some teach you how to do things.","I like to watch cooking videos the most. A kind lady shows how to make fried rice. She speaks slowly and shows each step. Last week I tried to cook it for my family. They said it was tasty and ate all of it.","YouTube can be good, but we must be careful. Some videos show wrong ideas. We should check if the person knows the topic well. We should not watch for many hours. A little learning every day is enough."],questions:[{q:"When does he open YouTube?",options:["After dinner","Before sunrise","At school","On the bus only"],a:0},{q:"What kind of videos does he like most?",options:["Cooking videos","Car racing","Makeup only","Horror movies"],a:0},{q:"What did his family do with the fried rice?",options:["Ate all of it","Threw it away","Sold it","Gave to dogs"],a:0},{q:"What should we check about videos?",options:["If the person knows the topic","If it is very long","If it has music","If it is old"],a:0},{q:"Watching many hours is good. True or false?",options:["False","True"],a:0}]},{id:9,title:"School in Finland",category:"Society",words:190,paras:["In Finland schools look very different from my school. Children start school at age seven. They have no big tests until they are sixteen. They also have very little homework each day.","In class kids play and work together. Teachers do not shout. They sit with kids and help them. If a child feels tired, they can rest for a while. Schools give free warm food for lunch.","People say Finland has happy students. Kids like to go to school in the morning. They learn to think, not just to remember. I think this is a kind way to learn. Maybe other places can learn from Finland too."],questions:[{q:"When do kids start school in Finland?",options:["At age seven","At age three","At age twelve","At age eighteen"],a:0},{q:"What do they have until age 16?",options:["No big tests","No food","No teachers","No friends"],a:0},{q:"How do teachers help?",options:["Sit with kids and help","Shout loudly","Give money","Leave class"],a:0},{q:"What do schools give for lunch?",options:["Free warm food","Only cold water","No lunch","Candy only"],a:0},{q:"Kids in Finland feel sad at school. True or false?",options:["False","True"],a:0}]},{id:10,title:"Big City and Small Town",category:"Society",words:187,paras:["Bangkok is very big and busy. Many cars and bikes move fast on the roads. Many people live close together. There are tall buildings, bright lights, and big malls. Life is fast there.","My grandparents live in a small town far from Bangkok. There are only a few shops. Most people know each other by name. At night you can see many stars. Life there is quiet and slow.","I like both places for different reasons. In Bangkok I can learn and meet new people. In the small town I can rest and breathe clean air. Where you live can change how you feel each day."],questions:[{q:"What is Bangkok like?",options:["Big and busy","Small and quiet","Cold and empty","Under water"],a:0},{q:"Where do grandparents live?",options:["In a small town","In Bangkok center","On an island","In another country"],a:0},{q:"What can you see at night in the small town?",options:["Many stars","Tall malls","Snow","No light"],a:0},{q:"What does the writer like about the small town?",options:["Rest and clean air","Fast cars","Loud music","Big crowds"],a:0},{q:"Life in both places is the same. True or false?",options:["False","True"],a:0}]},{id:11,title:"K-Pop Music Love",category:"Society",words:183,paras:["My favorite band is BTS from Korea. They are a group of seven young men. They sing and dance very well. Many fans around the world love their songs. I am one of those fans.","Their music is happy and full of hope. The words talk about loving yourself. The dance moves are fast and sharp. I watch their videos and try to learn the steps. It is hard but fun.","K-Pop is more than just music now. It teaches Korean language to many people. It brings fans together to make new friends. Even my mom knows one BTS song and sings it in the kitchen."],questions:[{q:"How many members are in BTS?",options:["Seven","Three","Ten","Two"],a:0},{q:"What do their songs talk about?",options:["Loving yourself","Buying cars","Cooking soup","Cold weather"],a:0},{q:"What does the writer try to learn?",options:["Dance steps","Math formulas","Car repair","French words"],a:0},{q:"What does K-Pop teach many people?",options:["Korean language","Swimming","Painting","Driving"],a:0},{q:"His mom knows a BTS song. True or false?",options:["True","False"],a:0}]},{id:12,title:"Work at Home",category:"Society",words:189,paras:["In the year 2020 many people had to stay home. A new virus made travel hard. So many offices closed their doors. People started to work from their living rooms and bedrooms.","They used apps like Zoom to meet their boss and team. They talked on screen all day. Working at home saved time because there was no bus. But it was also lonely sometimes. People missed talking face to face.","Now some people still work at home two days a week. They like the quiet and flexible time. Others want to go back to the office every day. Both ways can work if people plan well."],questions:[{q:"Why did people work at home in 2020?",options:["Because of a virus","Because of snow","Because of a party","Because of no jobs"],a:0},{q:"What app did they use to meet?",options:["Zoom","Only games","Paper letters","Radio"],a:0},{q:"What did they save by working at home?",options:["Time from no bus","Money for food only","Electricity","Water"],a:0},{q:"How do some people work now?",options:["Two days at home","Only at night","Never work","Only on boats"],a:0},{q:"Working at home was always easy. True or false?",options:["False","True"],a:0}]},{id:13,title:"Family Dinner Together",category:"Society",words:184,paras:["Every Sunday night my family eats dinner together. Mom cooks soup and grilled chicken. Dad brings fresh fruit from the market. My little brother sets the plates and spoons.","During dinner we turn off the TV and phones. We talk about our week at school and work. Sometimes we laugh about funny stories. My brother tells jokes that are not funny but we laugh anyway.","Studies show that families who eat together are happier. Children talk more and feel safe. They also eat more healthy food. I feel warm and loved when we eat together like this."],questions:[{q:"When does the family eat together?",options:["Every Sunday night","Every morning","Once a year","Never"],a:0},{q:"What does mom cook?",options:["Soup and grilled chicken","Only cake","Pizza and cola","No food"],a:0},{q:"What do they turn off during dinner?",options:["TV and phones","Lights only","Fans only","Nothing"],a:0},{q:"What do studies say about family dinners?",options:["Families are happier","Families fight more","Kids eat less","No effect"],a:0},{q:"The brother sets plates. True or false?",options:["True","False"],a:0}]},{id:14,title:"Young People and Climate",category:"Society",words:186,paras:["Greta is a young girl from Sweden. She started to care about Earth when she was fifteen. She sat outside her government building with a sign. The sign said we must act now for climate.","Many students around the world saw her photo. They also started to walk out of class on Fridays. They asked leaders to use clean power and plant more trees. They used phones to share their ideas fast.","Some adults said they are too young to speak. But many people listened and joined them. Now more schools talk about climate change. Young voices can make big change when they work together."],questions:[{q:"Where is Greta from?",options:["Sweden","Thailand","Japan","Brazil"],a:0},{q:"How old was she when she started?",options:["Fifteen","Seven","Thirty","Fifty"],a:0},{q:"What did students do on Fridays?",options:["Walk out of class","Play games only","Sleep all day","Go shopping"],a:0},{q:"What do they ask leaders to do?",options:["Use clean power and plant trees","Build more cars","Close schools","Stop phones"],a:0},{q:"Adults all ignored them. True or false?",options:["False","True"],a:0}]},{id:15,title:"Friends Online and Real Life",category:"Society",words:188,paras:["I have two kinds of friends in my life. Some I know from school and see every day. We play football and eat lunch together. We can hug and laugh face to face.","Other friends I know only from online games. We never met in real life. We talk with text and voice. We help each other win games. They live in other cities and even other countries.","Both kinds of friends are important to me. Real friends help when I am sad close by. Online friends teach me new ideas from far away. I try to give time to both groups every week."],questions:[{q:"How many kinds of friends does he have?",options:["Two kinds","One kind only","Five kinds","No friends"],a:0},{q:"What do real friends do together?",options:["Play football and eat lunch","Only chat online","Fly planes","Sell cars"],a:0},{q:"Where do online friends live?",options:["In other cities and countries","Next door only","In his house","Under water"],a:0},{q:"Which friends help when sad close by?",options:["Real friends","Online friends only","No one","Teachers only"],a:0},{q:"He gives time to both groups. True or false?",options:["True","False"],a:0}]},{id:16,title:"Happy Country Denmark",category:"Society",words:181,paras:["Last summer I read about Denmark in a book. People say it is one of the happiest places. I wanted to know why they feel so happy every day.","One reason is a word called hygge. Hygge means cozy and warm time with friends. Families light candles and drink hot tea. They talk and do not look at phones. Trust is also high there.","People trust their neighbors and their government. They help each other when someone is sick. They ride bikes even when it rains. I think happy life is not about money only. It is about kind people and simple time together."],questions:[{q:"What country is called happy?",options:["Denmark","Desert land","Ice island","No country"],a:0},{q:"What does hygge mean?",options:["Cozy warm time with friends","Fast driving","Loud party","No talking"],a:0},{q:"What do families do for hygge?",options:["Light candles and drink tea","Watch horror movies","Run fast","Shout"],a:0},{q:"How do people move even in rain?",options:["Ride bikes","Fly planes","Swim","Stay home only"],a:0},{q:"Happy life is only about money. True or false?",options:["False","True"],a:0}]},{id:17,title:"Prices Go Up",category:"Economy",words:183,paras:["At my local market bread cost 30 baht last year. Now the same bread costs 40 baht. My mom says this is called inflation. Inflation means money can buy less than before.","When prices go up, life feels harder. Families need more money for the same food. Some people ask boss for more pay. Shops may sell less because people buy less.","There are many reasons for high prices. Sometimes gas costs more, so trucks pay more. Sometimes there is not enough food to sell. Learning about this helps us plan and save money wisely."],questions:[{q:"How much did bread cost last year?",options:["30 baht","40 baht","100 baht","10 baht"],a:0},{q:"What is inflation?",options:["Money buys less","Money grows on trees","Bread is free","Shops close"],a:0},{q:"What do some people ask boss for?",options:["More pay","More holidays only","Less work only","Free bread"],a:0},{q:"Why may prices go up?",options:["Gas costs more or less food","Because of music","Because of rainbows","No reason"],a:0},{q:"Learning helps us save wisely. True or false?",options:["True","False"],a:0}]},{id:18,title:"Cheap Clothes Shein",category:"Economy",words:186,paras:["My cousin buys many cheap clothes from an app called Shein. The app comes from China. Clothes there cost very little money. New styles come every single day.","She likes it because she can buy ten shirts for the price of one in a mall. But the shirts feel thin and break fast. She wears them two times and then throws them away.","This is called fast fashion. It makes a lot of trash. Workers in factories work long hours for low pay. Now my cousin tries to buy less and keep clothes longer. She says that is better for Earth and people."],questions:[{q:"Where does Shein come from?",options:["China","Canada","Egypt","Peru"],a:0},{q:"Why does she like the app?",options:["Clothes cost very little","Clothes are made of gold","No shipping","Free food"],a:0},{q:"What is the problem with the shirts?",options:["Thin and break fast","Too heavy","Too hot like fire","Never arrive"],a:0},{q:"What is fast fashion making?",options:["A lot of trash","Clean air","Happy workers only","More forests"],a:0},{q:"She now buys less. True or false?",options:["True","False"],a:0}]},{id:19,title:"Bitcoin Money",category:"Economy",words:184,paras:["Some people talk about Bitcoin on the news. Bitcoin is a kind of money on the internet. You cannot touch it like coins or paper. It lives only in computers.","The price of Bitcoin goes up and down very fast. One day it is high, next day it is low. Some people buy it to make more money quickly. But they can also lose a lot of money quickly.","My dad says Bitcoin is risky for beginners. It is better to learn first before buying. Save your money in a safe place. Do not put all your money in one thing. That is wise advice."],questions:[{q:"What is Bitcoin?",options:["Internet money you cannot touch","Paper money from bank","Gold coin","Toy coin"],a:0},{q:"How does its price move?",options:["Up and down very fast","Never changes","Only goes up","Only goes down"],a:0},{q:"What can happen if you buy it?",options:["Lose money quickly","Get free house","Always win","No risk"],a:0},{q:"What does dad say about it?",options:["Risky for beginners","Very safe","Free for all","No need to learn"],a:0},{q:"Put all money in one thing. True or false - is that wise?",options:["False","True"],a:0}]},{id:20,title:"Uber and Grab Jobs",category:"Economy",words:187,paras:["My uncle drives for Grab in the city. He uses an app to find people who need a ride. When someone clicks, he drives to them. He works when he wants to work.","This job is flexible and free. He can stop at noon to pick up his son. He can work at night if he needs more money. But there are no paid holidays or sick days. If he does not work, he gets no pay.","Many young people like this kind of job. They like to be their own boss. But they also worry about safety and low pay on slow days. My uncle saves money for days when work is slow."],questions:[{q:"What does his uncle do?",options:["Drives for Grab","Sells flowers","Teaches math","Builds houses"],a:0},{q:"How does he find riders?",options:["Uses an app","Shouts on street","Writes letters","Uses smoke"],a:0},{q:"What is flexible about the job?",options:["Works when he wants","Fixed hours only","No driving","Free car"],a:0},{q:"What does he NOT get?",options:["Paid holidays or sick days","A phone","A car","Riders"],a:0},{q:"He saves for slow days. True or false?",options:["True","False"],a:0}]},{id:21,title:"Saving Money Young",category:"Economy",words:180,paras:["My teacher in Finland told us a story. In Finland kids learn to save money from age seven. They get a small piggy bank at school. They put coins inside each week.","The teacher shows how to make a simple plan. If you want a bike, you need to save a little each month. You write down how much you have. You do not spend it on candy.","I think this is a great idea for kids. When we save, we learn patience. We also learn the value of money. Now I have a jar at home for my savings. I hope to buy a book next month."],questions:[{q:"At what age do Finnish kids learn to save?",options:["Age seven","Age twenty","Age two","Age fifty"],a:0},{q:"What do they get at school?",options:["Small piggy bank","Big car","Free phone","Gold bar"],a:0},{q:"What should you do if you want a bike?",options:["Save a little each month","Ask for free bike","Steal a bike","Never save"],a:0},{q:"What does saving teach?",options:["Patience and value of money","How to run fast","How to sing","Nothing"],a:0},{q:"He has a jar at home. True or false?",options:["True","False"],a:0}]},{id:22,title:"Minimum Wage",category:"Economy",words:185,paras:["In the United States there is a rule about pay. It says boss must pay at least a small amount per hour. This is called minimum wage. Now it is about seven dollars in some places.","Some people say seven dollars is too low to live. Rent and food cost more now. They want to make it fifteen dollars per hour. Other people say small shops cannot pay that much and may close.","I do not know which number is best. But I know all workers should be treated fairly. Work is hard and takes time and power. Good pay helps families feel safe and calm."],questions:[{q:"What is minimum wage?",options:["Least pay per hour by law","Most pay per year","Free money","No pay"],a:0},{q:"How much is it now in some US places?",options:["About seven dollars","About one hundred dollars","Zero dollars","One dollar only"],a:0},{q:"What do some people want?",options:["Fifteen dollars per hour","Five dollars","No wage","Only food"],a:0},{q:"Why do others worry?",options:["Small shops may close","Too much money","Too many workers","No worry"],a:0},{q:"Good pay helps families feel safe. True or false?",options:["True","False"],a:0}]},{id:23,title:"Small Shops Online",category:"Economy",words:182,paras:["During 2020 many small shops closed their front doors. People could not go out to buy things. So shop owners learned to sell online instead. They opened pages on Facebook and Line.","My aunt sells curry and rice from her kitchen. She posts photos every morning. People order by message and she sends food by bike. She says she now has more customers than before.","Selling online is not easy at first. You need good photos and fast replies. You must keep food fresh and clean. But for many families it saved their business. It gave them hope in a hard time."],questions:[{q:"What happened to small shops in 2020?",options:["Closed front doors","Opened big malls","Sold cars only","Moved to moon"],a:0},{q:"Where did they sell instead?",options:["Online on Facebook and Line","Under water","In forest only","No place"],a:0},{q:"What does his aunt sell?",options:["Curry and rice","Shoes and hats","Phones and chargers","Gold rings"],a:0},{q:"How does she send food?",options:["By bike","By plane","By boat only","By hand only"],a:0},{q:"Selling online saved many businesses. True or false?",options:["True","False"],a:0}]},{id:24,title:"Democracy Means Vote",category:"Politics",words:183,paras:["Democracy is a way to run a country. In a democracy people can choose their leaders. They do this by voting. Each person has one vote. All votes count the same.","New Zealand is one example of democracy. People there vote every few years. They can also speak freely about what they like or do not like. The government must listen to people.","Democracy is not perfect every day. Sometimes leaders make mistakes. But people can vote again and change leaders. That is why many people think it is a fair system for all."],questions:[{q:"What is democracy?",options:["People choose leaders by voting","One person rules all","No voting","Only kings rule"],a:0},{q:"How many votes does each person have?",options:["One vote","Ten votes","No vote","Hundred votes"],a:0},{q:"Which country is an example?",options:["New Zealand","No example given","Mars","A small shop"],a:0},{q:"What must government do?",options:["Listen to people","Ignore people","Hide from people","Sleep all day"],a:0},{q:"People can change leaders by voting again. True or false?",options:["True","False"],a:0}]},{id:25,title:"Voting Day in USA",category:"Politics",words:184,paras:["In November 2020 many people in the US went to vote. It was a big election for president. News said about sixty six percent of adults voted. That number was high.","People stood in long lines for hours. Some wore masks because of the virus. Others sent their votes by mail from home. They wanted their voice to be heard.","Voting is important in any place. When you vote, you help decide the future. Even one vote can be part of a big change. I will vote when I am old enough to do so."],questions:[{q:"When was the big US election mentioned?",options:["November 2020","January 1990","June 2010","July 2000"],a:0},{q:"How many percent voted?",options:["About 66 percent","About 10 percent","About 100 percent","About 0 percent"],a:0},{q:"How did some people vote?",options:["By mail from home","By shouting","By throwing stones","No voting"],a:0},{q:"Why did people stand in long lines?",options:["To vote","To buy ice cream","To watch movie","To sleep"],a:0},{q:"Writer wants to vote when older. True or false?",options:["True","False"],a:0}]},{id:26,title:"Young People and Politics",category:"Politics",words:185,paras:["Many young people now join politics in new ways. They do not only watch TV news. They make short videos on TikTok about laws and leaders. They explain hard ideas in simple words.","In many cities they join peaceful walks to ask for change. They hold signs and sing together. They care about jobs, clean air, and fair schools. They want leaders to listen to youth.","Some older people say youth are too young to know. But young people will live longer with the choices made today. So their voice matters a lot. Talking together can make better plans for all."],questions:[{q:"How do young people join politics now?",options:["Make TikTok videos","Only sleep","Never talk","Only play games"],a:0},{q:"What do they do in cities?",options:["Join peaceful walks","Build towers","Fly kites only","Hide at home"],a:0},{q:"What do they care about?",options:["Jobs, clean air, fair schools","Only candy","Only shoes","No care"],a:0},{q:"Why does youth voice matter?",options:["They live longer with choices","They have no future","They are not real","They hate politics"],a:0},{q:"Talking together can make better plans. True or false?",options:["True","False"],a:0}]},{id:27,title:"Climate Agreement Paris",category:"Politics",words:186,paras:["In Paris in 2015 many countries met together. They talked about Earth getting too hot. Hotter Earth makes seas rise and storms stronger. They wanted to stop this bad change.","They made a promise called the Paris Agreement. Almost all countries signed it. Each country said it will try to make less smoke and use more clean power like sun and wind.","The promise is not easy to keep. Clean power costs money at first. But if all countries help, Earth can stay safer for kids in future. Working together is the key idea."],questions:[{q:"Where did countries meet in 2015?",options:["In Paris","In Bangkok","In Tokyo","On the moon"],a:0},{q:"Why was Earth getting hot a problem?",options:["Seas rise and storms stronger","More ice only","No problem","Only cold"],a:0},{q:"What is the promise called?",options:["Paris Agreement","Lunch Agreement","Game Agreement","No name"],a:0},{q:"What will countries use more of?",options:["Clean power like sun and wind","More coal only","More smoke","More trash"],a:0},{q:"Working together is key. True or false?",options:["True","False"],a:0}]},{id:28,title:"Switzerland Votes Often",category:"Politics",words:183,paras:["My friend lives in Switzerland, a small country in Europe. People there vote much more than in many places. They vote about four times each year. Not only for leaders, but also for laws.","This is called direct democracy. If people do not like a new law, they can say no with a vote. They get a small book in the mail that explains each choice in simple words.","Voting often takes time and thought. Some people feel tired from many votes. But many people like to have a say. They feel their voice counts in daily life."],questions:[{q:"How often do Swiss people vote?",options:["About 4 times a year","Once in 10 years","Never","Every day"],a:0},{q:"What can they vote on?",options:["Laws and leaders","Only food","Only colors","Only music"],a:0},{q:"What is this system called?",options:["Direct democracy","No democracy","King rule","Game rule"],a:0},{q:"What do they get in the mail?",options:["Small book explaining choices","Free money","Shoes","No mail"],a:0},{q:"Many like to have a say. True or false?",options:["True","False"],a:0}]},{id:29,title:"Fake News Problem",category:"Politics",words:185,paras:["Last week I read a story that was not true. It said a famous actor died, but he was fine. This is called fake news. Fake news is a lie made to look like real news.","In 2016 there was a lot of fake news online. Many people shared it without checking. Fake news can make people angry or scared. It can also change how people vote.","We can stop fake news by checking facts first. Look at who wrote the story. See if other trusted sites say the same thing. If not sure, do not share it. Truth is important for all."],questions:[{q:"What is fake news?",options:["A lie that looks like real news","True story always","Cooking recipe","Funny joke only"],a:0},{q:"When was there a lot of fake news?",options:["In 2016","In 1800","In 3000","Never"],a:0},{q:"What can fake news do?",options:["Make people angry or scared","Make people fly","Make food","Clean air"],a:0},{q:"How can we stop it?",options:["Check facts first","Share faster","Never read news","Sleep"],a:0},{q:"If not sure, do not share. True or false?",options:["True","False"],a:0}]},{id:30,title:"Voting Online in Estonia",category:"Politics",words:184,paras:["My brother lives in Estonia, a small country near the sea. There people can vote by computer since 2005. They do not need to go to a voting place. They can vote from home.","About fifty percent of voters now vote online there. It is easy and saves time. People use a special ID card and code to keep votes safe. They can even change their vote before the end day.","Some people worry that computers can be hacked. So Estonia keeps strong safety steps. Other countries watch Estonia to learn. Online voting may grow in future if it stays safe."],questions:[{q:"Since when can Estonians vote online?",options:["Since 2005","Since 1990","Since 2025","Since 1800"],a:0},{q:"How many vote online now?",options:["About fifty percent","Zero percent","One percent","One hundred percent"],a:0},{q:"What keeps votes safe?",options:["Special ID card and code","No safety","Just a name","Magic only"],a:0},{q:"Can voters change their vote?",options:["Yes, before end day","No, never","Only if rich","Only on paper"],a:0},{q:"Computers cannot be hacked. True or false?",options:["False","True"],a:0}]},{id:31,title:"Penicillin Medicine",category:"History",words:188,paras:["In 1928 a man named Alexander Fleming worked in a lab in London. He left some plates with bacteria on a table. When he came back, he saw something strange and blue-green.","A mold had grown on one plate. Around the mold, bacteria had died. Fleming understood that mold can kill bad germs. He called it penicillin. It was the first antibiotic medicine in the world.","Penicillin has saved millions of lives since then. Before it, small cuts could make people very sick. Now doctors can treat many infections. One small mold changed the history of health."],questions:[{q:"Who found penicillin in 1928?",options:["Alexander Fleming","Albert Einstein","Marie Curie","Thomas Edison"],a:0},{q:"Where did he work?",options:["In a lab in London","On a farm","On a ship","In a school"],a:0},{q:"What killed bacteria?",options:["A mold called penicillin","Water only","Sun light only","Cold air"],a:0},{q:"What was penicillin?",options:["First antibiotic medicine","First car","First phone","First book"],a:0},{q:"Small cuts could be dangerous before. True or false?",options:["True","False"],a:0}]},{id:32,title:"Roman Buildings Strong",category:"History",words:186,paras:["When I visited Rome, I saw old buildings from long ago. Romans knew how to make strong concrete. Their concrete can last for two thousand years. It even gets stronger in sea water.","One building is called Pantheon. It was built around 126 AD. It has a big round roof with a hole on top. Light comes in from the hole. People still meet inside it today.","Roman builders mixed lime, ash, and small stones. They did not have big machines like we do. Yet their work still stands and looks beautiful. We can learn from their smart ideas."],questions:[{q:"What could Roman concrete do?",options:["Last 2000 years","Melt quickly","Fly","Disappear"],a:0},{q:"When was Pantheon built?",options:["Around 126 AD","In 2020","Yesterday","In 3000"],a:0},{q:"What does Pantheon roof have?",options:["Hole on top for light","Gold only","No roof","Glass only"],a:0},{q:"What did Romans mix?",options:["Lime, ash, small stones","Only water","Only sand","Paper and glue"],a:0},{q:"Roman work still stands today. True or false?",options:["True","False"],a:0}]},{id:33,title:"Women and the Moon",category:"History",words:185,paras:["Katherine Johnson was a smart woman who loved math. She was born in 1918 in the US. At that time many schools did not let black girls study much. But she loved numbers and learned fast.","Later she worked for NASA, the space group. She did math that helped rockets fly to the moon. In 1969 astronauts walked on the moon for the first time. Her numbers made their trip safe.","For many years few people knew her name. Then a movie told her story to the world. Now girls see her and feel they can be scientists too. Hard work and love of learning matter."],questions:[{q:"Who loved math and helped NASA?",options:["Katherine Johnson","Mickey Mouse","Elvis Presley","No one"],a:0},{q:"When did astronauts walk on the moon?",options:["In 1969","In 2022","In 1800","In 1500"],a:0},{q:"What did she do for the moon trip?",options:["Math that made trip safe","Cooked food","Built rocket alone","Drove rocket"],a:0},{q:"How did people learn her story?",options:["From a movie","From a song only","From a dream","No story"],a:0},{q:"She was born in 1918. True or false?",options:["True","False"],a:0}]},{id:34,title:"Coffee History",category:"History",words:183,paras:["Long ago in Yemen in the 15th century, people found coffee. They picked red beans from small trees. They roasted the beans over fire and made a dark drink. The drink helped them stay awake at night.","Traders took coffee to many places like Turkey and Europe. Coffee shops opened where people talked about news and ideas. Some kings did not like coffee shops and tried to close them.","Today coffee is loved around the world. Many people drink it in the morning before work. Farmers still grow coffee on hills. One small bean made a big story across time."],questions:[{q:"Where was coffee found long ago?",options:["In Yemen","In Canada","On the moon","In Antarctica"],a:0},{q:"In which century?",options:["15th century","20th century","5th century","1st century"],a:0},{q:"What did coffee help people do?",options:["Stay awake at night","Sleep more","Fly","Swim"],a:0},{q:"What opened where people talked?",options:["Coffee shops","Car shops","Shoe shops","No shops"],a:0},{q:"Coffee is loved today. True or false?",options:["True","False"],a:0}]},{id:35,title:"Berlin Wall Fell",category:"History",words:186,paras:["On November 9 1989 something big happened in Germany. A long wall in Berlin fell down. This wall was built in 1961 to split the city into two sides. Families could not meet each other.","People on both sides felt sad for many years. They could not visit friends or grandparents. On that night in 1989 the government said people can cross. Many people cried and hugged each other.","They hit the wall with hammers and broke it into small pieces. People kept pieces as memory. Now there is no wall and the city is one again. Freedom felt very sweet that night."],questions:[{q:"When did Berlin Wall fall?",options:["Nov 9 1989","Jan 1 2000","Dec 25 1990","July 4 1776"],a:0},{q:"When was the wall built?",options:["In 1961","In 2005","In 1989","In 2020"],a:0},{q:"Why was wall bad?",options:["Families could not meet","It was too small","It was made of gold","It was fun"],a:0},{q:"What did people do with hammers?",options:["Broke wall into pieces","Built new wall","Made music only","Painted wall"],a:0},{q:"Now Berlin is one city again. True or false?",options:["True","False"],a:0}]},{id:36,title:"Printing Press Books",category:"History",words:184,paras:["In the year 1440 a man named Gutenberg lived in Germany. He made a new machine called printing press. Before that people wrote books by hand. One book took many months to finish.","With his machine, many copies of a book could be made fast. Books became cheaper and more people could buy them. More people learned to read and write. Ideas spread quickly across Europe.","This change helped science and schools grow. People could share new ideas far away. Today we have computers, but printing press was the first big step. It opened the door to learning for all."],questions:[{q:"Who made printing press in 1440?",options:["Gutenberg","Newton","Edison","Walt Disney"],a:0},{q:"How were books made before?",options:["By hand","By robots","By magic","No books"],a:0},{q:"What happened with the machine?",options:["Books became cheaper","Books disappeared","No change","Books burned"],a:0},{q:"What grew because of books?",options:["Science and schools","Only wars","Only games","Nothing"],a:0},{q:"Printing press opened door to learning. True or false?",options:["True","False"],a:0}]},{id:37,title:"Mongol Empire Big",category:"History",words:182,paras:["The Mongols lived long ago in the cold lands of Asia. They rode horses very well and moved fast. In 1206 a leader named Genghis Khan brought many tribes together. He made a big army.","By 1227 his empire was one of the biggest in world history. It went from China to Europe. Traders could travel safely on a road called Silk Road. But ruling such big land was hard.","After Genghis Khan died, his sons split the land into smaller parts. Soon these parts fought each other. The big empire fell quickly after being strong. Big size does not always mean long life."],questions:[{q:"Where did Mongols live?",options:["Cold lands of Asia","Hot desert only","Under sea","On moon"],a:0},{q:"Who brought tribes together?",options:["Genghis Khan","Julius Caesar","No leader","A farmer"],a:0},{q:"How big was empire by 1227?",options:["One of biggest in history","Very small","Only one town","No land"],a:0},{q:"What road was safe for traders?",options:["Silk Road","Ice Road","No road","Sky Road"],a:0},{q:"Big empire lasted forever. True or false?",options:["False","True"],a:0}]},{id:38,title:"Why We Delay Work",category:"Psychology",words:185,paras:["I often wait until the last day to do my homework. This is called delaying work. Many people do this, not only me. We know we should start now, but we do not.","One reason is fear. We fear that our work will not be good enough. So we wait and feel more stress. Our brain wants to feel safe now, not later. So we watch videos instead of working.","A good tip is to start very small. Work for just five minutes and then stop if you want. Most times you will keep going. Small steps make big jobs feel easy and light."],questions:[{q:"What does writer do with homework?",options:["Waits until last day","Finishes early always","Never does it","Gives to dog"],a:0},{q:"What is one reason for delay?",options:["Fear work not good enough","Too much money","No brain","Too happy"],a:0},{q:"What does brain want now?",options:["Feel safe now","Feel pain","Sleep forever","No feeling"],a:0},{q:"What tip helps stop delay?",options:["Start small 5 minutes","Never start","Wait one year","Buy new phone"],a:0},{q:"Small steps make jobs feel easy. True or false?",options:["True","False"],a:0}]},{id:39,title:"Habits Form Slowly",category:"Psychology",words:184,paras:["My brother wants to drink water every morning. At first he forgot many times. He had to set a reminder on his phone. After some weeks it became more easy.","A study says habits form in about sixty six days on average. It is not twenty one days like many people think. Some habits take more time, some take less time. Small daily action is key.","If you want a new habit, do not try to be perfect. If you miss one day, start again next day. Your brain learns from repeat, not from one time. Be kind to yourself and keep going."],questions:[{q:"What does his brother want to do?",options:["Drink water every morning","Run 10 km daily","Never drink water","Eat cake only"],a:0},{q:"How long do habits form on average?",options:["About 66 days","1 day","10 years","5 minutes"],a:0},{q:"What is key for habits?",options:["Small daily action","Big one-time action","No action","Money only"],a:0},{q:"What if you miss one day?",options:["Start again next day","Stop forever","Cry and quit","Buy gift"],a:0},{q:"Brain learns from repeat. True or false?",options:["True","False"],a:0}]},{id:40,title:"Emotional Intelligence",category:"Psychology",words:186,paras:["In 1995 Daniel Goleman wrote a book about feelings. He said being smart is not only about math. Knowing your own feelings is also important. He called it emotional intelligence.","He said there are five main skills. First, know how you feel. Second, control strong feelings. Third, push yourself to reach goals. Fourth, understand how other people feel. Fifth, work well with others.","People with these skills often do well at work and at home. They stay calm when there is stress. They listen and help friends. Schools now teach these skills to children too."],questions:[{q:"Who wrote about emotional intelligence in 1995?",options:["Daniel Goleman","Albert Einstein","Steve Jobs","No one"],a:0},{q:"What is NOT only about math?",options:["Being smart","Cooking rice","Driving car","Sleeping"],a:0},{q:"How many main skills did he list?",options:["Five","Two","Ten","One hundred"],a:0},{q:"What do skilled people do under stress?",options:["Stay calm","Shout always","Run away always","Cry only"],a:0},{q:"Schools now teach these skills. True or false?",options:["True","False"],a:0}]},{id:41,title:"Bad Memories Stay",category:"Psychology",words:183,paras:["I still remember my bad day at school last year. I forgot my lines in a play. Everyone looked at me and I felt hot. I remember that more than good days.","Our brain saves bad memories more strongly. Long ago this helped people stay safe. If you touched fire once, you remember and do not touch again. Bad memory kept you alive.","This is normal and happens to all people. But we can also try to remember good times. Write down three good things each night before sleep. This helps your mind feel more balanced."],questions:[{q:"What bad memory does writer have?",options:["Forgot lines in a play","Lost a car","Broke leg","No memory"],a:0},{q:"Why does brain save bad memories strong?",options:["To stay safe and not repeat danger","To be funny","No reason","To sell them"],a:0},{q:"What example shows safety learning?",options:["Touch fire once and remember","Eat candy and forget","Sleep and forget","No example"],a:0},{q:"What can help balance mind?",options:["Write 3 good things nightly","Never think","Only watch TV","Eat more"],a:0},{q:"Remembering bad times is normal. True or false?",options:["True","False"],a:0}]},{id:42,title:"FOMO Fear",category:"Psychology",words:185,paras:["My friends went to a concert last Friday. I stayed home to study. I kept looking at their photos online. I felt sad that I was not there. This feeling has a name.","The name is FOMO, which means fear of missing out. It became a new word in 2013. Social media makes FOMO stronger because we see what others do all the time.","To feel better, I turned off my phone for one hour. I read a book and drank tea. I realized I can enjoy my own time too. We do not need to be everywhere to be happy."],questions:[{q:"What did friends do last Friday?",options:["Went to a concert","Went to moon","Slept all day","Cooked soup"],a:0},{q:"What does FOMO mean?",options:["Fear of missing out","Fun of many oranges","First of many orders","No meaning"],a:0},{q:"When did FOMO become a new word?",options:["In 2013","In 1990","In 2005","In 1800"],a:0},{q:"What makes FOMO stronger?",options:["Social media seeing others","No phones","Reading books only","Sleeping"],a:0},{q:"Writer turned off phone for an hour. True or false?",options:["True","False"],a:0}]},{id:43,title:"Music and Feelings",category:"Psychology",words:184,paras:["When I listen to my favorite song, I feel happy inside. My heart beats faster and I want to dance. Music can change how we feel very quickly. It is like magic for the mind.","Scientists say music makes a chemical called dopamine in the brain. Dopamine gives us joy and reward. Sometimes music gives us chills on our skin. That means we feel deep emotion.","Different songs make different feelings. Slow songs can make us calm or sad. Fast songs can make us feel strong and ready. I keep a list of songs for different moods."],questions:[{q:"What happens when he hears favorite song?",options:["Heart beats faster, wants to dance","Falls asleep only","Feels angry only","No feeling"],a:0},{q:"What chemical does music make?",options:["Dopamine","Water","Salt","Sugar"],a:0},{q:"What does dopamine give?",options:["Joy and reward","Pain only","Nothing","Cold"],a:0},{q:"What can slow songs do?",options:["Make calm or sad","Make you fly","Make you cook","No effect"],a:0},{q:"He keeps list for different moods. True or false?",options:["True","False"],a:0}]},{id:44,title:"Positive Thinking",category:"Psychology",words:186,paras:["My aunt always says good things will happen. Even when it rains, she says plants will be happy. She smiles a lot and thanks people. I wanted to know if this helps health.","A man named Seligman studied this idea for many years. He found that positive people often live healthier lives. They handle stress better and get sick less often. They also have more friends who support them.","Positive thinking does not mean ignore bad things. It means look for a good step you can take. Write one good thing you can do tomorrow. Small hope each day can grow big over time."],questions:[{q:"What does aunt always say?",options:["Good things will happen","Bad things only","No talk","Only jokes"],a:0},{q:"Who studied positive thinking?",options:["Seligman","Shakespeare","Mozart","No one"],a:0},{q:"What do positive people handle better?",options:["Stress","Cars only","No stress","Money only"],a:0},{q:"What does positive thinking NOT mean?",options:["Ignore bad things","Look for good step","Hope each day","Be kind"],a:0},{q:"Small hope can grow big. True or false?",options:["True","False"],a:0}]},{id:45,title:"Octopus Is Smart",category:"General Knowledge",words:184,paras:["An octopus is a sea animal with eight long arms. It has no bones in its body. It can change color to hide from other fish. It is very smart for an animal.","Scientists say it has about five hundred million neurons. Neurons are brain cells that help think. Octopus can open jars to get food inside. It can solve simple puzzles in labs.","It lives only two to three years, not long. Yet it learns fast in short time. Some people keep octopus in tanks to study them. They say each octopus has its own character and likes."],questions:[{q:"How many arms does octopus have?",options:["Eight","Two","Four","Ten"],a:0},{q:"What can it do with no bones?",options:["Change color to hide","Fly in sky","Run fast on land","Sing songs"],a:0},{q:"How many neurons does it have?",options:["About 500 million","10 neurons","No neurons","1 billion exactly"],a:0},{q:"What can it open to get food?",options:["Jars","Doors of houses","Cars","Books"],a:0},{q:"Each octopus has its own character. True or false?",options:["True","False"],a:0}]},{id:46,title:"Trees Talk Together",category:"General Knowledge",words:187,paras:["In a quiet forest, trees talk to each other in a hidden way. They do not use words like people. They use tiny fungi under the ground. Fungi connect roots like internet wires.","A scientist named Simard studied this in 1997. She found mother trees help baby trees. Mother trees send food and warning signals through fungi. If insects attack one tree, others get ready.","This shows forests are like big families. Trees are not alone but help each other live. When we cut many trees fast, we break this network. Protecting forests keeps this talk alive."],questions:[{q:"How do trees talk?",options:["Via fungi under ground","Via phones","Via letters","They never talk"],a:0},{q:"Who studied this in 1997?",options:["Simard","Einstein","Newton","No one"],a:0},{q:"What do mother trees send?",options:["Food and warning signals","Money only","Cars","Nothing"],a:0},{q:"What happens if insects attack one tree?",options:["Others get ready","All die fast","No effect","Trees run"],a:0},{q:"Cutting many trees breaks network. True or false?",options:["True","False"],a:0}]},{id:47,title:"Dark Matter Mystery",category:"General Knowledge",words:183,paras:["Scientists study space with big telescopes. They see stars and planets that shine. But most of space is invisible and dark. They call this dark matter.","Dark matter makes up about eighty five percent of all matter in universe. We cannot see it with eyes or cameras. We know it is there because it pulls on stars with gravity.","A man named Zwicky first talked about it in 1933. He saw galaxies move too fast. Something unseen must be pulling them. Today scientists still try to find what dark matter really is."],questions:[{q:"What do scientists see with telescopes?",options:["Stars and planets that shine","Only dark matter","Nothing","Only Earth"],a:0},{q:"How much is dark matter?",options:["About 85% of matter","1% only","0% none","100% all light"],a:0},{q:"How do we know dark matter is there?",options:["It pulls stars with gravity","We see its color","We taste it","No proof"],a:0},{q:"Who first talked about it in 1933?",options:["Zwicky","Gutenberg","Fleming","Greta"],a:0},{q:"Scientists know exactly what it is now. True or false?",options:["False","True"],a:0}]},{id:48,title:"Honey Never Spoils",category:"General Knowledge",words:182,paras:["My grandmother keeps a jar of honey in her kitchen. She says honey never goes bad. Even honey from three thousand years ago was still good when found in old tombs.","Honey has very little water inside. Bacteria need water to grow and spoil food. No water means no bacteria can live in honey. Also bees add special enzymes that keep it fresh.","If honey gets hard, you can warm the jar in hot water. It will become soft and clear again. I like honey on toast in the morning. It is sweet and also good for sore throat."],questions:[{q:"What does grandmother keep?",options:["Jar of honey","Jar of milk","Jar of water","Jar of sand"],a:0},{q:"How old was honey found in tombs?",options:["3000 years ago","3 days ago","10 years ago","1 year ago"],a:0},{q:"Why does honey not spoil?",options:["Very little water, no bacteria","Too much water","Has salt only","No reason"],a:0},{q:"What can you do if honey gets hard?",options:["Warm jar in hot water","Throw away","Freeze it","Add ice"],a:0},{q:"Honey is good for sore throat. True or false?",options:["True","False"],a:0}]},{id:49,title:"Bees Vote for Home",category:"General Knowledge",words:185,paras:["Honey bees live together in big groups. When their hive gets too full, they need a new home. Scout bees fly out to look for safe places. They come back and dance to tell others.","Each scout dances for the place she likes best. More dancing means better place. Other bees watch and join the dance they like. After some time most bees dance for one best place.","Scientists say this is like voting. Bees choose together by dancing. Once many agree, all fly to new home together. It is amazing that small insects can make group decisions."],questions:[{q:"Why do bees need new home?",options:["Hive gets too full","Too cold only","No reason","They hate honey"],a:0},{q:"What do scout bees do?",options:["Fly to look for places","Stay and sleep","Eat all honey","Fight"],a:0},{q:"How do they tell others?",options:["Dance","Phone call","Letters","Songs only"],a:0},{q:"What does more dancing mean?",options:["Better place","Worse place","No meaning","Danger"],a:0},{q:"Bees voting is like group decision. True or false?",options:["True","False"],a:0}]},{id:50,title:"Music Chills",category:"General Knowledge",words:186,paras:["Last night I heard my favorite part of a song. I felt chills on my arms and neck. My hair stood up a little. It felt strange but very nice.","Scientists study why music gives us chills. They found our brain makes dopamine at favorite moments. Dopamine is a happy chemical. It is same chemical that comes when we eat tasty food.","Not everyone gets chills from music. About half of people feel it often. People who feel more emotion tend to get chills more. Your favorite song may give you chills next time you listen closely."],questions:[{q:"What did writer feel last night?",options:["Chills on arms and neck","Pain in foot","Cold from snow","Nothing"],a:0},{q:"What does brain make at favorite moment?",options:["
