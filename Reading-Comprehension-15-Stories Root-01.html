push({id:1,title:"The Busy City Morning",chap:"ped=foot + man=hand",roots:["ped","man"],passage:"At seven, the city woke up with pedestrian traffic everywhere. A biped owner walked his dog while a child stared at a centipede keychain and a millipede sticker on a shop window. A quadruped horse pulling a cart became an impediment at the crossing. I pressed the pedal of my bicycle and tried to maneuver past a peddler selling socks who also offered a quick pedicure on the curb. A tripod held a security camera that recorded everything. My manager had given me a mandate to emancipate our team from yesterday's delay. I carried a manual and a handwritten manuscript of delivery routes. I did not want to wear manacles of old rules, nor did I want to manipulate the schedule unfairly. I had to manufacture a better plan while giving customers a proper manicure coupon for waiting. My hands and feet worked together, and the morning finally moved forward.",words:t,questions:[{id:"1-1",type:"main",q:"What is the main idea of this passage?",options:["A city morning where foot and hand imagery show busy work life","A story about horses only","How to do pedicure","A manual for manufacturing"],correct:0,explain:"พารากราฟใช้คำราก ped=เท้า และ man=มือ เพื่อเล่าชีวิตเมืองที่วุ่นวายตอนเช้า"},{id:"1-2",type:"detail",q:"What did the manager ask the narrator to do?",options:["Sell socks","Free the team from delay with a mandate","Buy a tripod","Do a pedicure"],correct:1,explain:"manager + mandate ชัดเจนว่าต้องการปลดปล่อยทีมจากความล่าช้า"},{id:"1-3",type:"vocab",q:"In context, what does 'impediment' mean? Use ped=root.",options:["Something that blocks foot movement / obstacle","A type of hand tool","A foot massage","A fast vehicle"],correct:0,explain:"ped=foot, im-pediment = สิ่งที่ขวางทางเท้า → อุปสรรค"},{id:"1-4",type:"vocab",q:"'Emancipate' contains man=hand. What does it imply?",options:["To free from being held in hands / control","To wear handcuffs","To paint nails","To manufacture hands"],correct:0,explain:"e- = out, man=hand → ปล่อยออกจากมือ = ปลดปล่อย"},{id:"1-5",type:"inference",q:"What can we infer about the narrator?",options:["He is lazy","He uses both physical movement and hand skills to solve problems","He hates cities","He is a horse"],correct:1,explain:"ต้องทั้งปั่นจักรยาน (ped) และจัดการเอกสารด้วยมือ (man)"}]})}{let t=he(["circumspect","inspect","introspection","perspective","respect","retrospective","spectacle","spectacles","spectator","speculate","contradict","dictation","dictator","diction","dictionary","dictum","edict","indictment","predict","verdict"],"spec/dict");e.push({id:2,title:"The Courtroom",chap:"spec=see + dict=speak",roots:["spec","dict"],passage:"The courtroom was quiet. The judge was circumspect and asked the jury to inspect every piece of evidence. From my seat as a spectator, I saw a real spectacle: a man wearing thick spectacles trying to contradict his own earlier dictation. The prosecutor read an edict from the mayor and an indictment that would predict the defendant's future. The defense lawyer used clear diction and quoted a famous dictum about justice, then opened a dictionary to prove his point. The accused showed introspection during the retrospective review of the crime video. The judge demanded respect from everyone and reminded us that perspective matters. A dictator would decide alone, but here we must not speculate without proof. Finally, after hours, the jury gave its verdict, spoken aloud for all to hear.",words:t,questions:[{id:"2-1",type:"main",q:"What is the main idea?",options:["A court trial where seeing and speaking roots are central","A lesson on glasses","How to become dictator","A dictionary sale"],correct:0,explain:"spec=see และ dict=speak ปรากฏในบริบทการพิจารณาคดี"},{id:"2-2",type:"detail",q:"What did the man in spectacles try to do?",options:["Contradict his own dictation","Predict weather","Sell dictionaries","Inspect spectacles"],correct:0,explain:"ระบุว่า trying to contradict his own earlier dictation"},{id:"2-3",type:"vocab",q:"'Retrospective' – using spec root, what does it mean?",options:["Looking back at past events","Looking forward","Speaking loudly","A type of verdict"],correct:0,explain:"retro=back + spec=look → มองย้อนกลับ"},{id:"2-4",type:"vocab",q:"'Indictment' contains dict=speak. What is it?",options:["A formal spoken charge","A pair of glasses","A way of seeing","A silent gesture"],correct:0,explain:"in- + dict + ment = การพูดกล่าวหาเป็นทางการ"},{id:"2-5",type:"inference",q:"Why does the judge ask not to speculate?",options:["Because court needs evidence not guesses","Because he is a dictator","Because spectacles are broken","Because diction is bad"],correct:0,explain:"speculate = เดาโดยไม่มีหลักฐาน ศาลต้องใช้หลักฐาน"}]})}{let t=he(["dejected","eject","injection","interjection","jettison","projectile","projector","reject","subject","trajectory","bisect","dissect","insect","intersection","section","sectional","sector","transect","trisect","vivisection"],"ject/sect");e.push({id:3,title:"Space Launch",chap:"ject=throw + sect=cut",roots:["ject","sect"],passage:"The team felt dejected after the first test failed. Mission control had to eject the faulty module and jettison extra fuel before launch. The projectile rose slowly, its trajectory displayed by a huge projector on the wall. An engineer shouted an interjection, “Go!” when the doctors gave an injection of adrenaline to stay awake. No one would reject the data even though the subject of space was risky. On the map, they had to bisect the launch corridor and trisect the landing zone for safety. The scientists would dissect the results later, while a biologist noted that an insect was not allowed in the clean sector. The rocket had to transect the atmosphere at a sharp intersection of winds. Each section of the report included a sectional diagram, but no one supported vivisection in modern labs. The night was cut into hope and fear, thrown into stars.",words:t,questions:[{id:"3-1",type:"main",q:"Main idea?",options:["A space launch involving throwing and cutting concepts","A biology lab only","How to bisect insects","A projector manual"],correct:0,explain:"ject=throw, sect=cut ผูกกับการปล่อยจรวด"},{id:"3-2",type:"detail",q:"What did they jettison?",options:["Extra fuel","An insect","A projector","A dictionary"],correct:0,explain:"ระบุ jettison extra fuel"},{id:"3-3",type:"vocab",q:"'Trajectory' – ject root means?",options:["Path of something thrown","A cut into three","A thrown away feeling","A type of insect"],correct:0,explain:"tra- across + ject=throw → วิถีของสิ่งที่ถูกขว้าง"},{id:"3-4",type:"vocab",q:"'Trisect' uses sect=cut. What does it mean?",options:["Cut into three parts","Throw three times","See three times","Carry three"],correct:0,explain:"tri=3 + sect=cut = แบ่งสามส่วน"},{id:"3-5",type:"inference",q:"Why was the team dejected then excited?",options:["First test failed but later launch succeeded","They lost an insect","They rejected projector","They dissected a sector"],correct:0,explain:"อารมณ์เปลี่ยนจากล้มเหลวครั้งแรกไปสู่การปล่อยที่สำเร็จ"}]})}{let t=he(["deport","export","import","portable","porter","report","support","transport","airport","seaport","admit","dismiss","emit","intermission","missile","mission","omit","remit","submit","transmit"],"port/miss");e.push({id:4,title:"Airport Day",chap:"port=carry + miss=send",roots:["port","miss"],passage:"At the airport, a porter helped me carry my portable suitcase. I had to report at the counter to transport my bags to the seaport connection later. The airline would export my luggage and import new goods from abroad. Some passengers who forgot passports might be asked to deport? No, just to admit their mistake. The staff would not dismiss anyone without trying to support them. Planes emit a loud sound as they take off, each like a huge missile but safe. Our mission was to get to Bangkok, with a short intermission in Singapore. I did not want to omit my passport or forget to remit the extra fee. I had to submit my boarding pass and watch them transmit the final passenger list. The announcement reminded us that carrying and sending are the heart of travel.",words:t,questions:[{id:"4-1",type:"main",q:"Main idea of Airport Day?",options:["Travel involves carrying and sending","How to build airport","Missile launch","Dismissing people"],correct:0,explain:"port=carry, miss=send คือแกนของการเดินทาง"},{id:"4-2",type:"detail",q:"What did the porter do?",options:["Helped carry portable suitcase","Emitted sound","Dismissed passengers","Imported goods"],correct:0,explain:"porter helped carry portable suitcase"},{id:"4-3",type:"vocab",q:"'Portable' – port=root means?",options:["Able to be carried","Able to be sent by missile","A type of report","An airport building"],correct:0,explain:"port=carry + able = พกพาได้"},{id:"4-4",type:"vocab",q:"'Transmit' – miss/mit=send. What does it mean?",options:["Send across","Carry in hands","Cut in half","See clearly"],correct:0,explain:"trans=across + mit=send = ส่งข้าม"},{id:"4-5",type:"inference",q:"Why mention omit and remit?",options:["To stress not forgetting documents and fees when sending/carrying","Because airport sells missiles","Because porter is dejected","To show ped root"],correct:0,explain:"omit=ไม่ส่ง/ละเว้น, remit=ส่งคืนเงิน ต้องระวังตอนเดินทาง"}]})}{let t=he(["autobiography","autograph","bibliography","biography","cartography","homograph","paragraph","phonograph","photography","seismograph","describe","inscription","manuscript","postscript","prescription","scribble","scribe","script","subscription","transcribe"],"graph/scrib");e.push({id:5,title:"Library Mystery",chap:"graph=write + scrib=write",roots:["graph","scrib"],passage:"In the old library, Maya found an autobiography that was not supposed to be there. Inside, an autograph of a famous explorer and a short paragraph about cartography caught her eye. The book’s bibliography listed a biography of a photographer known for early photography with a phonograph in the background. There was also a strange seismograph reading tucked between pages and a homograph puzzle: the word “lead” could be metal or to guide. She tried to describe the clue to the librarian, but her note was only a scribble. On the wall, an inscription read, “The scribe who wrote this script left a subscription for truth.” She found a postscript that said, “Do not transcribe this without care, and check the prescription in drawer three.” She realized writing, whether graph or scrib, could hide secrets.",words:t,questions:[{id:"5-1",type:"main",q:"What is the passage about?",options:["A mystery in a library centered on writing","A medical prescription","How to use phonograph","A biography of a porter"],correct:0,explain:"graph/scrib=เขียน เป็นศูนย์กลางปริศนาห้องสมุด"},{id:"5-2",type:"detail",q:"What was tucked between pages?",options:["Seismograph reading","A portable suitcase","A missile","A biped"],correct:0,explain:"seismograph reading tucked between pages"},{id:"5-3",type:"vocab",q:"'Cartography' – graph=root, what field?",options:["Map writing/making","Life writing","Sound writing","Light writing"],correct:0,explain:"carto=map + graphy=writing = การทำแผนที่"},{id:"5-4",type:"vocab",q:"'Transcribe' – scrib=write, what action?",options:["Write across / copy to another form","Write before","Write under","Write with light"],correct:0,explain:"trans=across + scribe=write = ถอดความ"},{id:"5-5",type:"inference",q:"Why does inscription mention scribe and script?",options:["To emphasize writing as clue carrier","Because scribe is a peddler","Because script is portable","To show airport"],correct:0,explain:"สัญลักษณ์ของการเขียนที่ซ่อนความลับ"}]})}{let t=he(["accreditation","credence","credential","credible","credit","creed","credo","credulous","discredit","incredible","abjure","conjure","injure","jury","justice","justify","perjury","jurisdiction","judicious","prejudice"],"cred/jur");e.push({id:6,title:"Trust and Justice",chap:"cred=believe + jur=law",roots:["cred","jur"],passage:"The young lawyer wanted accreditation and brought her credential to court, hoping the jury would give credence to her case. Her client was credible and deserved credit for honesty, living by a simple creed and personal credo of truth. She was not credulous and would not discredit any witness without proof, even though the story sounded incredible. The opposing side tried to conjure fear and even attempted to abjure the law, which could injure the idea of justice. The judge reminded everyone that perjury is a crime and that his jurisdiction required judicious decisions without prejudice. To justify a decision, one must respect both belief and law.",words:t,questions:[{id:"6-1",type:"main",q:"Main theme?",options:["Belief and law working together in court","How to conjure magic","A story about pedicure","Thermal physics"],correct:0,explain:"cred=believe, jur=law คือแกน"},{id:"6-2",type:"detail",q:"What did the lawyer bring?",options:["Credential for accreditation","A phonograph","A tripod","A missile"],correct:0,explain:"brought credential for accreditation"},{id:"6-3",type:"vocab",q:"'Credulous' – cred=root, what person?",options:["One who believes too easily","One who disbelieves everything","A lawmaker","A foot doctor"],correct:0,explain:"credulous = เชื่อง่ายเกินไป"},{id:"6-4",type:"vocab",q:"'Jurisdiction' – jur/jus=root, meaning?",options:["Area where law says / authority","Area where foot walks","A belief system","A type of writing"],correct:0,explain:"juris=law + dict= speak → เขตอำนาจศาล"},{id:"6-5",type:"inference",q:"Why mention perjury?",options:["To show breaking belief/law has consequences","Because jury is credulous","To describe thermal","To bisect evidence"],correct:0,explain:"perjury = ให้การเท็จ ทำลายทั้งความเชื่อและความยุติธรรม"}]})}{let t=he(["benediction","benefactor","beneficial","benefit","benevolent","benign","bonus","bonanza","bona fide","bon voyage","malcontent","malfeasance","malnourished","malefactor","malaria","malodorous","malady","malice","malignant","malevolent"],"ben/mal");e.push({id:7,title:"Good vs Evil",chap:"ben=good + mal=bad",roots:["ben","mal"],passage:"In a small village, a benefactor gave a benediction before the harvest, wishing everyone benefit and a beneficial rain. He was benevolent and his smile was benign. When the crop became a bonanza, he gave a bonus to workers and a bona fide gift to each child, saying bon voyage to traders leaving. But there was a malcontent who committed malfeasance and left the children malnourished. This malefactor spread malaria with malodorous water and acted with pure malice. The doctor diagnosed the malady and said the tumor was malignant, caused by a malevolent plan. The villagers learned that good (ben) and bad (mal) always choose sides.",words:t,questions:[{id:"7-1",type:"main",q:"Main contrast?",options:["Good vs bad through ben vs mal roots","Two types of foot","How to navigate sea","Building structures"],correct:0,explain:"ben=good, mal=bad ชัดเจน"},{id:"7-2",type:"detail",q:"What did benefactor give after bonanza?",options:["Bonus and bona fide gift","Malaria","Malodorous water","Perjury"],correct:0,explain:"gave bonus and bona fide gift"},{id:"7-3",type:"vocab",q:"'Benevolent' – ben/bene=good + vol= wish. Meaning?",options:["Well-wishing, kind","Bad smelling","Breaking law","Throwing away"],correct:0,explain:"bene=good + vol=wish = ปรารถนาดี"},{id:"7-4",type:"vocab",q:"'Malevolent' – mal=bad, what?",options:["Wishing evil","Wishing good","Good voyage","Good bonus"],correct:0,explain:"mal=bad + vol=wish = มุ่งร้าย"},{id:"7-5",type:"inference",q:"What lesson does village learn?",options:["Actions show if you are ben or mal","Malaria is good","Bon voyage means stay","Benefactor is malcontent"],correct:0,explain:"การกระทำบ่งบอกว่าเป็นฝ่ายดีหรือร้าย"}]})}{let t=he(["biology","biotic","antibiotic","symbiotic","amphibian","biopsy","biosphere","biogenesis","biohazard","autobiography","vital","vitality","vitamin","vivacious","vivid","revive","survive","vivarium","convivial","vivisection"],"bio/vit");e.push({id:8,title:"Life Lab",chap:"bio=life + vit=live",roots:["bio","vit"],passage:"The biology class studied biotic factors in the biosphere. They learned how antibiotic kills bacteria but symbiotic bacteria help us survive. An amphibian in the vivarium showed vivid colors, and the teacher said vitamins are vital for vitality. The group watched a biopsy video, understanding biohazard safety and biogenesis theories about how life began. Maya was vivacious and tried to revive a wilting plant, hoping it would survive. Her convivial laugh made the lab friendly. Life, whether bio or viv, was about living fully, not just studying.",words:t,questions:[{id:"8-1",type:"main",q:"Main idea?",options:["Studying life and living in biology lab","A court case","Airport transport","Space trajectory"],correct:0,explain:"bio=life, vit=live ในห้องแล็บ"},{id:"8-2",type:"detail",q:"What helped students survive topic?",options:["Symbiotic bacteria example","Portable suitcase","Perjury","Bona fide gift"],correct:0,explain:"symbiotic bacteria help us survive"},{id:"8-3",type:"vocab",q:"'Biogenesis' – bio=life, gen=origin, meaning?",options:["Origin of life","Life danger","Live again","Cutting life"],correct:0,explain:"bio=life + genesis=origin = กำเนิดชีวิต"},{id:"8-4",type:"vocab",q:"'Revive' – viv=live, re=again, meaning?",options:["Live again / bring back to life","Live badly","Not live","Cut life"],correct:0,explain:"re- again + viv=live = ฟื้นคืน"},{id:"8-5",type:"inference",q:"Why mention convivial and vivacious?",options:["To show liveliness as part of life theme","To show malice","To show transport","To show jurisdiction"],correct:0,explain:"ทั้งสองคำเกี่ยวกับความมีชีวิตชีวา"}]})}{let t=he(["deflect","flexible","flexor","reflect","reflection","reflex","inflection","genuflect","retroflex","circumflex","fragile","fragment","fracture","fraction","refract","infraction","frail","fragmentation","fractal","fragile"],"flect/fract");e.push({id:9,title:"The Broken Bridge",chap:"flect=bend + fract=break",roots:["flect","fract"],passage:"The old bridge was fragile and frail after the storm. Engineers feared a fracture and saw a fragment of concrete fall, causing fragmentation across the deck. They said the bridge could not deflect the wind because its steel was not flexible. The flexor cables that should bend had lost their reflex to adapt, and every reflection in the river showed cracks. When a truck passed, the driver had to genuflect? No, but the bridge made a strange inflection sound and seemed to retroflex backward. The architect noted the circumflex shape of the arch was meant to reflect strength, but now light would refract strangely through broken gaps. What was once a whole was now a fraction of itself, and even a small infraction of weight limit could cause collapse. Nature reminded us that bending and breaking are connected.",words:t,questions:[{id:"9-1",type:"main",q:"Main idea?",options:["A bridge breaking shows bend and break roots","A biology lab","A good vs evil story","An airport day"],correct:0,explain:"flect=bend, fract=break กับสะพาน"},{id:"9-2",type:"detail",q:"What fell from bridge?",options:["Fragment of concrete","A manuscript","A bona fide gift","A microscope"],correct:0,explain:"fragment of concrete fall"},{id:"9-3",type:"vocab",q:"'Flexible' – flect/flex=bend, meaning?",options:["Able to bend","Able to break only","A type of fracture","A reflection"],correct:0,explain:"flexible = งอได้ ยืดหยุ่น"},{id:"9-4",type:"vocab",q:"'Fragmentation' – fract=break, what process?",options:["Breaking into pieces","Bending around","Sending across","Believing"],correct:0,explain:"fragmentation = การแตกเป็นชิ้นๆ"},{id:"9-5",type:"inference",q:"What lesson about flect vs fract?",options:["If something cannot bend (flect) it will break (fract)","Bending is always bad","Breaking is good","Reflection is infraction"],correct:0,explain:"ถ้ายืดหยุ่นไม่ได้ก็จะแตกหัก"}]})}{let t=h /inward under pressure","To show foot vs hand","To show thermal","To show port"],correct:0,explain:"extro=ออก, intro=เข้า สะท้อน vers=turn"}]})}{let t=he(["attract","contract","detract","distract","extract","protract","retract","subtract","tractor","traction","construct","destruct","instruct","infrastructure","obstruct","reconstruct","structure","superstructure","deconstruct","structural"],"tract/struct");e.push({id:12,title:"Building Future",chap:"tract=pull + struct=build",roots:["tract","struct"],passage:"The new park will attract families. The city signed a contract to construct a playground and not destruct the old trees. Engineers must instruct workers about infrastructure that could obstruct the view. They will reconstruct a fallen wall and check the superstructure of the bridge. Experts tried to deconstruct old myths about building and noted structural safety is priority. A tractor with strong traction had to extract rocks from the ground, while noise might distract children. If critics detract from the plan, leaders should not retract promises or protract delays. We should not subtract hope when we pull together to build.",words:t,questions:[{id:"12-1",type:"main",q:"Main idea?",options:["Pulling and building a community park","A courtroom drama","Space launch","Thermal heat"],correct:0,explain:"tract=pull, struct=build กับการสร้างสวน"},{id:"12-2",type:"detail",q:"What will tractor do?",options:["Extract rocks with traction","Emit missile","Conjure magic","Predict verdict"],correct:0,explain:"tractor with traction extract rocks"},{id:"12-3",type:"vocab",q:"'Distract' – tract=pull, dis=apart, meaning?",options:["Pull attention apart","Build together","Turn","Break"],correct:0,explain:"dis- apart + tract=pull = ทำให้ไขว้เขว"},{id:"12-4",type:"vocab",q:"'Infrastructure' – struct=build, infra=below, meaning?",options:["Below building / foundation system","Above building decoration","A pulling machine","A turning point"],correct:0,explain:"infra=below + struct=b
