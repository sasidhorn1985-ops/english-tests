      if(big && big.offsetParent !== null){
        const v = parseInt(big.textContent.trim());
        if(!isNaN(v)){
          // total is in sibling span like "/ 20"
          let total = 20;
          const parent = big.parentElement;
          if(parent){
            const mt = parent.textContent.match(/\/\s*(\d+)/);
            if(mt) total = parseInt(mt[1]);
          }
          // Also try next sibling
          if(big.nextElementSibling){
            const mt2 = big.nextElementSibling.textContent.match(/(\d+)/);
            if(mt2) total = parseInt(mt2[1]);
          }
          score = v;
          console.log('✅ Score from big span:', v, '/', total);
          return {s:v, t:total};
        }
      }
      // Method 2: Green box - first text-[22px] with emerald color is correct count
      const greenBoxes = document.querySelectorAll('div.bg-emerald-50 p.text-\[22px\], p.text-\[22px\].text-emerald-700');
      if(greenBoxes.length > 0){
        for(let el of greenBoxes){
          if(el.offsetParent !== null){
            const v = parseInt(el.textContent.trim());
            if(!isNaN(v)){
              // find red box for incorrect
              const redBoxes = document.querySelectorAll('div.bg-rose-50 p.text-\[22px\]');
              let total = 20;
              if(redBoxes.length > 0){
                const inc = parseInt(redBoxes[0].textContent.trim());
                if(!isNaN(inc)) total = v + inc;
              }
              console.log('✅ Score from green box:', v, '/', total);
              score = v;
              return {s:v, t:total};
            }
          }
        }
      }
      // Method 3: Parse from summary header text
      const all = document.body.innerText;
      const idx = all.indexOf('สรุปผลการทดสอบ');
      if(idx > -1){
        const slice = all.substring(idx, idx+1000);
        // Look for pattern like "18 / 20" or "0 / 20" near header
        const m = slice.match(/(\d+)\s*\/\s*(\d+)/);
        if(m){
          console.log('✅ Score from innerText slice:', m[1], '/', m[2]);
          score = parseInt(m[1]);
          return {s:parseInt(m[1]), t:parseInt(m[2])};
        }
      }
      // Method 4: Look for "ถูก" box value
      const allText = document.body.innerText;
      const correctMatch = allText.match(/ถูก\s*\n?\s*(\d+)/) || allText.match(/(\d+)\s*\n?ถูก/);
      if(correctMatch){
        console.log('✅ Score from ถูก label');
      }
    } catch(e){ console.log('getScore err', e); }
    return null;
  }

  function isSummaryPage(){
    try {
      const txt = document.body.innerText || '';
      // Must have full phrase, not just "ดูสรุปผล"
      if(!txt.includes('สรุปผลการทดสอบ')) return false;
      // Must have big score element visible
      const big = document.querySelector('span.text-\[44px\]');
      if(!big || big.offsetParent === null) return false;
      // Must have "เฉลยละเอียด" which only appears on summary
      if(!txt.includes('เฉลยละเอียด')) return false;
      return true;
    } catch(e){ return false; }
  }

  function showModal(s,t){
    if(shown) return;
    shown = true;
    score = s; total = t;
    const pct = Math.round(s/t*100);
    const prev = document.getElementById('score-preview');
    if(prev) prev.innerHTML = `📊 <b>${TEST_NAME}</b><br>ได้ <b style="font-size:18px;color:#4f46e5">${s} / ${t}</b> (${pct}%)`;
    const modal = document.getElementById('score-modal');
    if(modal) modal.style.display = 'flex';
    console.log('✅ SHOW MODAL', s, t, TEST_NAME);
  }

  function check(){
    if(shown) return;
    if(!isSummaryPage()) return;
    console.log('🔍 Summary page detected, getting score...');
    // Wait a bit for React to finish rendering numbers
    setTimeout(()=>{
      const r = getScore();
      if(r){
        showModal(r.s, r.t);
      } else {
        console.log('⚠️ Score not found, retrying in 800ms');
        setTimeout(()=>{
          const r2 = getScore();
          if(r2) showModal(r2.s, r2.t);
          else {
            // Last resort: try to find any numbers
            const all = document.body.innerText;
            const m = all.match(/สรุปผลการทดสอบ[\s\S]{0,300}(\d+)\s*\/\s*(\d+)/);
            if(m) showModal(parseInt(m[1]), parseInt(m[2]));
            else {
              console.log('❌ Could not find score, showing 0/20 as fallback - please report');
              // Don't show 0/20 automatically - wait for user to debug
              // showModal(0,20);
            }
          }
        }, 800);
      }
    }, 400);
  }

  function bind(){
    const btn = document.getElementById('submit-score-btn');
    const status = document.getElementById('submit-status');
    if(btn && !btn._bound){
      btn._bound = true;
      btn.onclick = async () => {
        const name = document.getElementById('student-name').value.trim();
        const cls = document.getElementById('student-class').value.trim();
        if(!name){ alert('กรอกชื่อก่อนนะครับ 😊'); document.getElementById('student-name').focus(); return; }
        btn.textContent = '⏳ กำลังส่ง...'; btn.disabled = true; btn.style.opacity = '.7';
        try{
          const payload = {name:name, classRoom:cls, testName:TEST_NAME, score:score, total:total, percent:Math.round(score/total*100), details: TEST_NAME + ' - ' + score + '/' + total, timestamp:new Date().toISOString()};
          console.log('Sending', payload);
          await fetch(GOOGLE_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
          status.style.display = 'block'; status.style.background = '#dcfce7'; status.style.color = '#166534'; status.style.border = '1px solid #86efac';
          status.innerHTML = '✅ <b>ส่งคะแนนสำเร็จ!</b><br>ครูได้รับแล้วใน Google Sheet';
          btn.textContent = '✅ ส่งแล้ว'; btn.style.background = '#16a34a';
          setTimeout(()=>{ document.getElementById('score-modal').style.display = 'none'; }, 2500);
        }catch(e){
          console.error(e);
          status.style.display = 'block'; status.style.background = '#fee2e2'; status.style.color = '#991b1b'; status.style.border = '1px solid #fecaca';
          status.textContent = '❌ ส่งไม่สำเร็จ: ' + e.message + ' ลองใหม่นะครับ';
          btn.textContent = '🔄 ลองใหม่'; btn.disabled = false; btn.style.opacity = '1';
        }
      };
    }
    const skip = document.getElementById('skip-score-btn');
    if(skip && !skip._bound){
      skip._bound = true;
      skip.onclick = ()=>{ document.getElementById('score-modal').style.display = 'none'; };
    }
  }

  // Check every 800ms but only when on summary page
  setInterval(()=>{ check(); bind(); }, 800);
  const obs = new MutationObserver(()=>{ check(); bind(); });
  obs.observe(document.documentElement, {childList:true, subtree:true, characterData:true});
  window.addEventListener('load', ()=> setTimeout(check, 1000));
  // Also check when user clicks "ดูสรุปผล"
  document.addEventListener('click', (e)=>{
    const t = e.target;
    if(t && t.textContent && t.textContent.includes('ดูสรุปผล')){
      console.log('👆 ดูสรุปผล clicked, will check in 1.2s');
      setTimeout(check, 1200);
    }
  }, true);

  console.log('✅ Score system V4 ready - waiting for summary page...');
})();
</script>
