        }
      }
      // 2. Green box - ถูก
      const allBoxes = document.querySelectorAll('p.text-\[22px\]');
      if(allBoxes.length >= 2){
        // First box is correct, second is incorrect
        const c = parseInt((allBoxes[0].textContent||'').trim());
        const inc = parseInt((allBoxes[1].textContent||'').trim());
        if(!isNaN(c) && !isNaN(inc)){
          console.log('✅ Score from boxes', c, '/', c+inc);
          return {s:c, t:c+inc};
        }
        if(!isNaN(c)){
          console.log('✅ Score from first box', c);
          return {s:c, t:20};
        }
      }
      // 3. Regex from innerText after summary
      const txt = document.body.innerText || '';
      const idx = txt.indexOf('สรุปผลการทดสอบ');
      if(idx > -1){
        const slice = txt.substring(idx, idx+800);
        const m = slice.match(/(\d+)\s*\/\s*(\d+)/);
        if(m){
          console.log('✅ Score from slice', m[1], '/', m[2]);
          return {s:parseInt(m[1]), t:parseInt(m[2])};
        }
      }
    } catch(e){ console.log('getScore error', e); }
    console.log('⚠️ getScore failed, returning 0/20 fallback');
    return {s:0, t:20};
  }

  function isSummaryPage(){
    try {
      const txt = document.body.innerText || '';
      return txt.includes('สรุปผลการทดสอบ');
    } catch(e){ return false; }
  }

  function showModal(s,t){
    if(shown) return;
    shown = true;
    score = s; total = t;
    const pct = t>0 ? Math.round(s/t*100) : 0;
    const prev = document.getElementById('score-preview');
    if(prev) prev.innerHTML = `📊 <b>${TEST_NAME}</b><br>ได้ <b style="font-size:18px;color:#4f46e5">${s} / ${t}</b> (${pct}%)`;
    const modal = document.getElementById('score-modal');
    if(modal) modal.style.display = 'flex';
    console.log('🎉 SHOW MODAL', s, '/', t);
  }

  function check(){
    if(shown) return;
    if(!isSummaryPage()) return;
    // Summary detected - wait for numbers to render
    setTimeout(()=>{
      const r = getScore();
      showModal(r.s, r.t);
    }, 600);
  }

  function bind(){
    const btn = document.getElementById('submit-score-btn');
    const status = document.getElementById('submit-status');
    if(btn && !btn._bound){
      btn._bound = true;
      btn.onclick = async () => {
        const name = document.getElementById('student-name').value.trim();
        const cls = document.getElementById('student-class').value.trim();
        if(!name){ alert('กรอกชื่อก่อนนะครับ 😊'); document.getElementById('student-name').focus(); return; }
        btn.textContent = '⏳ กำลังส่ง...'; btn.disabled = true; btn.style.opacity = '.7';
        try{
          const payload = {name:name, classRoom:cls, testName:TEST_NAME, score:score, total:total, percent: total>0?Math.round(score/total*100):0, details: TEST_NAME + ' - ' + score + '/' + total, timestamp:new Date().toISOString()};
          console.log('📤 Sending', payload);
          await fetch(GOOGLE_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
          status.style.display = 'block'; status.style.background = '#dcfce7'; status.style.color = '#166534'; status.style.border = '1px solid #86efac';
          status.innerHTML = '✅ <b>ส่งคะแนนสำเร็จ!</b><br>ครูได้รับแล้วใน Google Sheet';
          btn.textContent = '✅ ส่งแล้ว'; btn.style.background = '#16a34a';
          setTimeout(()=>{ document.getElementById('score-modal').style.display = 'none'; }, 2500);
        }catch(e){
          console.error(e);
          status.style.display = 'block'; status.style.background = '#fee2e2'; status.style.color = '#991b1b'; status.style.border = '1px solid #fecaca';
          status.textContent = '❌ ส่งไม่สำเร็จ: ' + e.message;
          btn.textContent = '🔄 ลองใหม่'; btn.disabled = false; btn.style.opacity = '1';
        }
      };
    }
    const skip = document.getElementById('skip-score-btn');
    if(skip && !skip._bound){
      skip._bound = true;
      skip.onclick = ()=>{ document.getElementById('score-modal').style.display = 'none'; };
    }
  }

  // Poll every 800ms
  setInterval(()=>{ check(); bind(); }, 800);
  // Watch DOM changes
  const obs = new MutationObserver(()=>{ check(); bind(); });
  obs.observe(document.documentElement, {childList:true, subtree:true});
  // When user clicks ดูสรุปผล, check soon after
  document.addEventListener('click', (e)=>{
    const txt = (e.target && e.target.textContent) || '';
    if(txt.includes('ดูสรุปผล')){
      console.log('👆 ดูสรุปผล clicked');
      setTimeout(check, 800);
      setTimeout(check, 1500);
      setTimeout(check, 2500);
    }
  }, true);

  window.addEventListener('load', ()=>{ setTimeout(check, 1000); });

  console.log('✅ V5 Score system ready - will ALWAYS show on summary page');
})();
</script>
